<div class="box ex"><b>Statement to evaluate</b><p>Australia is on track to close the gap in life expectancy between First Nations and non-Indigenous Australians by 2031.</p></div>
<h3>Marks and due dates</h3>

<tr><td><b>Evaluate and verify</b></td><td>5</td><td>25%</td><td>Verified results, reasonableness, strengths and limitations</td></tr>
<tr><td><b>Communicate</b></td><td>4</td><td>20%</td><td>Correct language, logical layout, justified decisions, oral presentation</td></tr>
</tbody></table></div>
<p>The total is 20 marks. Solve is the biggest share, but Formulate and Evaluate together are worth 9 marks, nearly half.</p>
<ul><li><b>Week 2 Friday:</b> Formulate complete</li><li><b>Week 3 Friday:</b> Solve complete</li><li><b>Week 4 Friday:</b> Evaluation and full draft</li><li><b>Week 5 Friday:</b> Final copy</li><li><b>Weeks 6–7:</b> 12-slide oral presentation</li></ul>
<h3>Report structure</h3>
<p>Use the scaffold your teacher gave you. Each heading lines up with part of the marking guide.</p>
<div class="tw"><table><thead><tr><th>Scaffold heading</th><th>What goes in it</th><th>Criterion</th><th>Words</th></tr></thead><tbody>
<tr><td>Introduction</td><td>The context, the statement you are evaluating, and a one-line outline of your approach.</td><td>Communicate</td><td>about 100</td></tr>
<tr><td>Observations, Assumptions, Mathematical translation</td><td>What you notice, what you assume (with reasons), and how the question becomes maths.</td><td>Formulate</td><td>about 450</td></tr>
<tr><td>Develop a model, Interpret the model, Answer the question</td><td>Gap calculations, graph, line of best fit, meaning of the numbers, prediction for 2031, answer.</td><td>Solve</td><td>about 550</td></tr>
<tr><td>Verify results, Justification, Strengths and limitations</td><td>Checks on your numbers, whether the answer is reasonable, strengths and limitations of the model.</td><td>Evaluate and verify</td><td>about 500</td></tr>
<tr><td>Conclusion</td><td>Restate the problem, results and answer; recommendations.</td><td>Communicate</td><td>about 150</td></tr>
<tr><td>References, Appendix</td><td>Sources; raw data, repeated calculations, screenshots of technology.</td><td>Not marked</td><td>not counted*</td></tr>
</tbody></table></div>
<p>The word budget is only a suggestion. It adds up to about 1750, which leaves room to spare under the 2000-word maximum. *Ask your teacher exactly what counts towards the 2000 words (for example captions, tables and references).</p>
<div class="box"><b>⚠ Watch out</b><p>The appendix is not marked, so anything the marker needs to see must be in the main report. Put long working in the appendix, and the result and its meaning in the body.</p></div>
<div class="box"><b>How to use this hub</b><p>The examples show the standard to aim for. Rewrite everything in your own words and make your own modelling decisions. Your teacher uses plagiarism-detection software and class cross-marking. Your decisions and reasoning are what get marked.</p></div>`,
qs:[
Q("c","Q1","Under which marking criterion do the scaffold headings “Verify results”, “Justification” and “Strengths and limitations” earn marks?","Evaluate and verify (5 marks)."),
Q("c","Q2","Where should a long table of repeated calculations go, and what must still appear in the main report?","In the appendix. The appendix is not marked, so the main report must still contain the result and its meaning, for example the slope and what it says about the gap."),
Q("c","Q3","Write each criterion’s marks as a percentage of 20. Which two criteria together are worth nearly half?","Formulate 4/20 = 20%, Solve 7/20 = 35%, Evaluate and verify 5/20 = 25%, Communicate 4/20 = 20%.<br>Formulate + Evaluate = 9/20 = 45%, nearly half."),
Q("h","Q4","Add up the suggested word budget (Introduction, Formulate, Solve, Evaluate, Conclusion). How many words are spare under the 2000-word maximum, and how would you use them?","100 + 450 + 550 + 500 + 150 = 1750 words, so 2000 − 1750 = 250 words spare.<br>Sensible uses: extra interpretation in Solve, or a fuller evaluation of assumptions in Evaluate (the criterion where good reports often lose marks). Check with your teacher what counts towards the limit."),
Q("h","Q5","Use the due dates to write a short weekly plan. For each Friday, say what must be finished and which scaffold headings it covers.","Sample plan (use your own wording):<br>Week 2 Friday: Observations, Assumptions, Mathematical translation (Formulate).<br>Week 3 Friday: Develop a model, Interpret the model, Answer the question (Solve).<br>Week 4 Friday: Verify, Justification, Strengths and limitations, plus a full draft with Introduction and Conclusion.<br>Week 5 Friday: final copy, references and appendix checked.<br>Weeks 6–7: 12-slide presentation."),
Q("x","Q6","A classmate plans to write “see appendix” for the whole Solve section. Explain why this puts marks at risk.","The appendix is not marked. Solve is the largest criterion (7 marks) and rewards a complete solution, so the marker must see the model, the graph, the interpretation, the 2031 prediction and the answer in the main report. Only repeated working and raw data belong in the appendix.")
]},
{id:"2",wk:"Week 2",title:"2 Formulate (4 marks)",
th:`<p>Formulate means turning the real-world question into a mathematical one. The top band asks for <b>justified</b> assumptions, <b>justified</b> observations and a <b>justified</b> mathematical translation.</p>
<h3>Observations</h3>
<p>An observation is something you notice from the task or the data. Give the source, then say why it matters for your model. A repeating pattern makes every observation justified:</p>
<div class="box ex"><b>Example wording</b>
<p><b>It is observed that</b> the target is to close the life expectancy gap by 2031. <b>It is justified by</b> the fact that “on track” can only be judged against a deadline, so the model needs to predict the gap in 2031 (task sheet).</p>
<p><b>It is observed that</b> both data sets are reported for the same periods. <b>It is justified by</b> the fact that matching periods let me subtract corresponding values to find the gap for each period.</p>
<p><b>It is observed that</b> the data comes from the Australian Bureau of Statistics (ABS), which estimates life expectancy from registered deaths and Census population counts, and is published by the Australian Institute of Health and Welfare (AIHW). <b>It is justified by</b> the sources named in the spreadsheets, so I treat it as reliable but not exact.</p></div>
<div class="box turn"><b>Your turn</b><p>Find an observation about the data itself (for example, which group has the larger gap, or how many time points you have) and write it with “It is observed that” and “It is justified by”.</p></div>
<h3>Assumptions</h3>
<p>An assumption is something you accept as true to make the model workable. Each needs a reason and an effect on the model:</p>
<div class="tw"><table><thead><tr><th>Assumption</th><th>Because</th><th>Effect on the model</th></tr></thead><tbody>
<tr><td>The Indigenous and non-Indigenous populations do not overlap.</td><td>The task sheet states it.</td><td>Each group can be analysed separately, and the gap is a simple subtraction.</td></tr>
<tr><td>A 3-year period can be treated as its midpoint year (2020–22 becomes 2021).</td><td>Each value is an average over the period.</td><td>Lets time go on the x-axis, but adds a small error of up to a year.</td></tr>
<tr><td>The gap changes at a roughly constant rate (linear trend).</td><td>The scatterplot looks roughly straight (check yours).</td><td>A straight line cannot show progress speeding up or slowing down.</td></tr>
<tr><td>The trend continues unchanged to 2031.</td><td>There are no data after 2022 to test otherwise.</td><td>The 2031 prediction is extrapolation, so it is less reliable.</td></tr>
<tr><td>Males and females are modelled separately.</td><td>Their gaps are different sizes.</td><td>Gives two conclusions that may differ.</td></tr>
<tr><td>The ABS estimates are accurate enough to model.</td><td>Official source built from death registrations and Census counts.</td><td>Any error in the estimates carries into the trend.</td></tr>
</tbody></table></div>
<div class="box"><b>⚠ Watch out</b><p>You will come back to every assumption in Evaluate. The QCAA’s top sample lost its only mark because it never judged its results against its assumptions. Write assumptions you can honestly test later.</p></div>
<h3>Mathematical translation</h3>
<p>This is where the real-world question becomes variables, a model and a decision rule. Define each of these:</p>
<ul>
<li><b>Variables:</b> <code>t</code> = time (year, or years since your first data point) and <code>G</code> = gap in years (non-Indigenous life expectancy minus Indigenous life expectancy).</li>
<li><b>Model:</b> <code>G = mt + c</code>, a line of best fit through the (t, G) points.</li>
<li><b>Meaning of the slope m:</b> negative means the gap is closing, near zero means constant, positive means growing. These match the three outcomes in the task sheet.</li>
<li><b>Target in maths:</b> G = 0 in 2031.</li>
<li><b>Decision rule:</b> state exactly what “on track” means. For example: the model predicts a gap of 0 by 2031, or the slope is at least as steep as the rate needed (latest gap divided by years remaining).</li></ul>
<div class="box ex"><b>Example wording</b><p>I translate “close the gap” as G = 0. The rate of change needed from the latest data point (2021) to reach this in 2031 is the latest gap divided by 10 years. I will compare this with the slope of my model. If the modelled slope is much smaller in size, the gap is not closing quickly enough to be on track.</p></div>`,
qs:[
Q("c","Q1","Write an observation, using “It is observed that … It is justified by …”, about the fact that the life expectancy values are given for 3-year periods.","Sample (use your own words):<br>It is observed that each life expectancy value covers a 3-year period, such as 2020–22. It is justified by the fact that the ABS averages deaths over three years to get a stable estimate, so each value represents the whole period, not one year."),
Q("c","Q2","Decide whether each statement is an observation or an assumption: (a) the two populations do not overlap; (b) the data come from the ABS; (c) the trend continues unchanged to 2031; (d) the data are given for the same periods for both groups.","(a) Assumption (stated by the task sheet, and accepted to make the model workable).<br>(b) Observation (you can see it from the source notes).<br>(c) Assumption (there are no data after 2022 to check it).<br>(d) Observation (you can see it in the spreadsheets)."),
Q("c","Q3","State what the slope m of the line G = mt + c means when (a) m < 0, (b) m is close to 0, (c) m > 0.","(a) The gap is decreasing, so it is closing.<br>(b) The gap is roughly constant.<br>(c) The gap is increasing, so it is widening."),
Q("h","Q4","Define your variables with units, write the model equation, and state the target “close the gap by 2031” in maths.","Let t = years since 2006 (so 2031 is t = 25) and G = gap in years (non-Indigenous minus Indigenous life expectancy). Model: G = mt + c. Target: G = 0 when t = 25."),
Q("h","Q5","Write a decision rule for “on track”. Include a comparison with the rate needed.","Sample: The statement is supported if the model predicts a gap of 0 or less in 2031. Equivalently, the size of the slope must be at least the rate needed, which is the latest gap ÷ (2031 − 2021) = latest gap ÷ 10. If the slope is much smaller in size than this, the gap is not closing fast enough to be on track."),
Q("h","Q6","Write two assumptions for your model. Give each a reason (“because”) and its effect on the model.","Sample (rewrite in your own words):<br>1. The gap changes at a constant rate. Because the scatterplot looks roughly straight. Effect: a straight line cannot show progress speeding up or slowing down.<br>2. A 3-year period can be treated as its midpoint year. Because each value is an average over the period. Effect: allows a time axis but adds an error of up to a year."),
Q("x","Q7","The top QCAA sample lost its only mark because its evaluation never judged results against its assumptions. This assumption is badly written: “The data are perfect.” Explain what is wrong with it and rewrite it so you could test it later.","It cannot be tested, gives no reason, and is untrue (the ABS data are estimates with uncertainty). A testable version: “The ABS estimates are accurate enough to model, because they come from death registrations and Census counts. Any error in the estimates carries into the trend, which I will compare with the 95% confidence intervals in Evaluate.”")
]},
{id:"3",wk:"Weeks 2–3",title:"3 The data",
th:`<p>Your two spreadsheets give two periods. The task sheet allows you to source more, and four points make a much better model than two.</p>
<div class="tw"><table><caption>Life expectancy at birth (years), male / female</caption><thead><tr><th>Period</th><th>Midpoint</th><th>Indigenous</th><th>Non-Indigenous</th><th>Published gap</th><th>Where from</th></tr></thead><tbody>
<tr><td>2005–07</td><td>2006</td><td>67.2 / 72.9</td><td>78.7 / 82.6</td><td>11.5 / 9.7</td><td>ABS (extra data)</td></tr>
<tr><td>2010–12</td><td>2011</td><td>69.1 / 73.7</td><td>79.7 / 83.1</td><td>10.6 / 9.5</td><td>ABS (extra data)</td></tr>
<tr><td>2015–17</td><td>2016</td><td>71.6 / 75.6</td><td>80.2 / 83.4</td><td>8.6 / 7.8</td><td>Your 2020 spreadsheet</td></tr>
<tr><td>2020–22</td><td>2021</td><td>71.9 / 75.6</td><td>80.6 / 83.8</td><td>8.8 / 8.1</td><td>Your 2024 spreadsheet</td></tr>
</tbody></table></div>
<div class="box"><b>⚠ Verify before you use</b><p>The 2015–17 and 2020–22 rows come from your spreadsheets. The 2005–07 and 2010–12 rows were gathered from search results, so check them against the ABS tables yourself and cite the ABS, not this hub. Sources differ slightly on the 2005–07 gap (the Productivity Commission uses 11.4 and 9.6).</p></div>
<h3>Comparability: a strength of your Evaluate section</h3>
<ul>
<li><b>Method change.</b> The ABS changed its estimation method for 2020–22 and recalculated 2015–17 with it. The recalculated 2015–17 gaps are 8.7 and 8.0, not 8.6 and 7.8. Check the ABS 2020–22 release, then say which version you use and why.</li>
<li><b>Population change.</b> The ABS cautioned that comparisons between older periods should be read carefully because of how the population was counted.</li>
<li><b>Rounding.</b> Subtracting rounded life expectancies sometimes differs by 0.1 from the published gap. Use the published gap and say so.</li>
<li><b>Estimates, not measurements.</b> Life expectancy is calculated from death registrations and Census counts, and adjusted for how Indigenous status is recorded. The 2024 file gives 95% confidence intervals you can use to discuss uncertainty.</li></ul>
<p>The topic is about real people and communities. Write respectfully, use the terms from the task sheet (First Nations, non-Indigenous), describe what the numbers show without blame or stereotypes, and only claim causes you can support with a source.</p>`,
qs:[
Q("c","Q1","Calculate the gap (non-Indigenous minus Indigenous) for 2005–07, for males and for females.","Males: 78.7 − 67.2 = 11.5 years.<br>Females: 82.6 − 72.9 = 9.7 years."),
Q("c","Q2","Give the midpoint year of each period, and then the number of years since 2006: 2005–07, 2010–12, 2015–17, 2020–22.","Midpoints: 2006, 2011, 2016, 2021.<br>Years since 2006: 0, 5, 10, 15."),
Q("c","Q3","Subtract the 2020–22 life expectancies for males (80.6 and 71.9) and for females (83.8 and 75.6). Compare with the published gaps of 8.8 and 8.1. Why do they differ?","Males: 80.6 − 71.9 = 8.7 (published 8.8). Females: 83.8 − 75.6 = 8.2 (published 8.1).<br>The published gaps are calculated from unrounded values, so subtracting the rounded figures can be 0.1 out. Use the published gaps and say so in the report."),
Q("h","Q4","The ABS recalculated 2015–17 with its new method, giving gaps of 8.7 (males) and 8.0 (females) instead of 8.6 and 7.8. Which version would you use, and how would you justify the choice?","Either choice can earn marks if it is justified. A strong choice: use the recalculated values because they use the same method as 2020–22, so the last two points are comparable. Then state that 2005–07 and 2010–12 used the older method, list this as a limitation, and test how much the prediction changes (a sensitivity check). Explaining the choice matters more than which you pick."),
Q("h","Q5","Why do we treat a 3-year period as its midpoint year? Name the assumption and the error it adds.","Each value is an average over the 3 years, so the midpoint is the fairest single time for it (2020–22 becomes 2021). The error is up to about a year in where each point sits on the time axis. It is small compared with a 15-year spread, but it should be stated as an assumption."),
Q("x","Q6","Males: Indigenous life expectancy rose from 67.2 (2005–07) to 71.9 (2020–22), and non-Indigenous rose from 78.7 to 80.6. Work out each increase and compare with the change in the published gap (11.5 to 8.8). Why can the gap close even though both groups improved?","Indigenous: 71.9 − 67.2 = 4.7 years. Non-Indigenous: 80.6 − 78.7 = 1.9 years.<br>Indigenous life expectancy rose by 2.8 years more (4.7 − 1.9). The published gap fell by 2.7 (11.5 − 8.8); the 0.1 difference is rounding.<br>The gap closes when the group with the lower life expectancy improves faster, even though both groups improve.")
]},
{id:"4",wk:"Week 3",title:"4 Solve (7 marks)",
th:`<p>The top band needs accurate maths, efficient use of technology and a complete solution, meaning you answer the question you set.</p>
<ol>
<li><b>Calculate the gap</b> for each period: gap = non-Indigenous minus Indigenous, for males and for females separately.</li>
<li><b>Choose your time variable.</b> Midpoint years (2006, 2011, 2016, 2021) or years since 2006 (0, 5, 10, 15). The second gives an intercept you can interpret.</li>
<li><b>Draw a scatterplot</b> of gap against time for each sex. Title it, label the axes with units, and say what you see (direction, strength, any outlier).</li>
<li><b>Fit a line of best fit with technology</b> and report the equation, <code>r</code> and <code>R²</code>.</li>
<li><b>Interpret the model in context.</b> Slope: “the gap changes by about … years each year”. Intercept: “the modelled gap in 2006 was …”.</li>
<li><b>Predict.</b> Use the line to find the gap in 2031, and the year the line reaches 0.</li>
<li><b>Compare with the rate needed.</b> Needed rate = latest gap ÷ (2031 − 2021). Is your slope close to it?</li>
<li><b>Answer the question.</b> State clearly, using your decision rule, whether Australia is on track.</li></ol>
<h3>The least-squares line by hand</h3>
<p>Use this to check technology. Find the mean of x and the mean of y, then:</p>
<ul><li>Sxy = the sum of (x − mean of x)(y − mean of y)</li><li>Sxx = the sum of (x − mean of x)²</li><li>Slope m = Sxy ÷ Sxx</li><li>Intercept c = mean of y − m × mean of x</li><li>r = Sxy ÷ √(Sxx × Syy), where Syy = the sum of (y − mean of y)²</li></ul>
<h3>Technology</h3>
<details><summary>Excel</summary><p>Put the years in column A and the gaps in column B. Then use:</p><ul>
<li><code>=SLOPE(B2:B5, A2:A5)</code> and <code>=INTERCEPT(B2:B5, A2:A5)</code></li>
<li><code>=CORREL(A2:A5, B2:B5)</code> for r, and <code>=RSQ(B2:B5, A2:A5)</code> for R²</li>
<li><code>=FORECAST.LINEAR(2031, B2:B5, A2:A5)</code> for the predicted gap in 2031</li>
<li>Or insert a scatter chart, add a linear trendline, and tick “display equation” and “display R-squared”.</li></ul><p>Screenshot the sheet and chart for the appendix.</p></details>
<details><summary>Desmos</summary><p>Add a table with columns x₁ and y₁ and enter your points. In a new line type <code>y₁ ~ mx₁ + b</code>. Desmos shows the best-fit values of m and b, and r and R² below. Add the line <code>x = 2031</code> to mark the target year.</p></details>
<details><summary>TI-Nspire CX</summary><p>In a Lists and Spreadsheet page, enter the time values in one column and the gaps in another, and name the columns. Then go to Menu, Statistics, Stat Calculations, Linear Regression (mx+b). Choose your X and Y lists. The output includes m, b, r and R².</p></details>
<div class="box turn"><b>Your turn</b><p>Do the same working for females, then compare with males. Use the 🧮 Calculator in the Learn tab to check your numbers. Then decide whether a straight line is a good model for your data, and what you would say to justify it.</p></div>`,
qs:[
Q("c","Q1","List what a scatterplot of gap against time must include for full marks, and what you should say about it in words.","Include: a title, both axes labelled with units (year or years since 2006; gap in years), a sensible scale, and the plotted points (with the line of best fit if you add it).<br>Say in words: the direction (negative: the gap decreases as time increases), the strength (how close the points are to a line), and whether there is any outlier."),
Q("c","Q2","Female gaps, with x = years since 2006: (0, 9.7), (5, 9.5), (10, 7.8), (15, 8.1). Find the mean of x and the mean of y, then Sxy and Sxx.","Mean of x = 7.5. Mean of y = (9.7 + 9.5 + 7.8 + 8.1) ÷ 4 = 35.1 ÷ 4 = 8.775.<br>Products (x − 7.5)(y − 8.775): −6.9375, −1.8125, −2.4375, −5.0625. So Sxy = −16.25.<br>Sxx = 56.25 + 6.25 + 6.25 + 56.25 = 125."),
Q("c","Q3","Use your answers to find the slope m and the intercept c for the female model.","m = Sxy ÷ Sxx = −16.25 ÷ 125 = −0.13.<br>c = 8.775 − (−0.13)(7.5) = 8.775 + 0.975 = 9.75.<br>The model is G = 9.75 − 0.13x."),
Q("c","Q4","Use G = 9.75 − 0.13x to predict the female gap in 2031. Take care with x.","x is years since 2006, so 2031 is x = 25 (not 2031).<br>G = 9.75 − 0.13 × 25 = 9.75 − 3.25 = 6.5 years."),
Q("h","Q5","For the female model, find the year the line reaches 0, the rate needed from 2021 to reach 0 by 2031, and how many times faster the gap would need to close. Is Australia on track for females?","Line reaches 0 when 9.75 − 0.13x = 0, so x = 75, which is 2081.<br>Rate needed = 8.1 ÷ 10 = 0.81 years per year. 0.81 ÷ 0.13 ≈ 6.2, so the gap would need to close about 6.2 times faster.<br>Conclusion: the trend is in the right direction but far too slow, so the model says the female gap is not on track to close by 2031."),
Q("h","Q6","Calculate r and R² for the female model. Syy (the sum of (y − 8.775)²) is 2.7875.","r = Sxy ÷ √(Sxx × Syy) = −16.25 ÷ √(125 × 2.7875) = −16.25 ÷ √(348.4375) ≈ −16.25 ÷ 18.667 ≈ −0.871.<br>R² = (−0.871)² ≈ 0.758.<br>A strong negative linear relationship, though with 4 points this is weak evidence."),
Q("h","Q7","Write one or two sentences interpreting the slope and intercept of the female model G = 9.75 − 0.13x.","Sample (use your own words): The slope of −0.13 means the model predicts the female gap shrinks by about 0.13 years each year. The intercept of 9.75 means the modelled gap in 2006 was about 9.75 years (the published value was 9.7)."),
Q("h","Q8","Compare the male model (G = 11.39 − 0.202x) with the female model. Which gap is closing faster, and do the two models reach the same conclusion about 2031?","The male slope (−0.202) is steeper than the female slope (−0.13), so the male gap is closing faster per year, though it started larger.<br>Predictions for 2031 are about 6.34 (males) and 6.5 (females), both far from 0. The needed rates (0.88 and 0.81) are far above the modelled rates. Both models reach the same conclusion: not on track."),
Q("x","Q9","Data are in Excel with years in A2:A5 and gaps in B2:B5. Write the formulas for the slope, intercept, r, R², and the predicted gap in 2031.","=SLOPE(B2:B5, A2:A5)<br>=INTERCEPT(B2:B5, A2:A5)<br>=CORREL(A2:A5, B2:B5)<br>=RSQ(B2:B5, A2:A5)<br>=FORECAST.LINEAR(2031, B2:B5, A2:A5)<br>Note: if column A holds midpoint years (2006 to 2021) then 2031 is correct in FORECAST. If column A holds years since 2006, use 25."),
Q("x","Q10","Fit a line through only the two male points (2016, 8.6) and (2021, 8.8). Find the slope, predict the 2031 gap, and explain what this shows about using two points.","Slope = (8.8 − 8.6) ÷ 5 = 0.04. With x = years since 2006 (10 and 15): c = 8.6 − 0.04 × 10 = 8.2, so G = 8.2 + 0.04x, and at x = 25: G = 9.2 years.<br>The slope is positive and the 2031 gap is bigger, the opposite of the four-point result. A line through two points always fits perfectly (r = 1), so r says nothing about quality. This is a good limitation to explain, and a reason to source more data.")
]}
,
{id:"5",wk:"Week 4",title:"5 Evaluate and verify (5 marks)",
th:`<p>The top band needs verified results, justified statements about reasonableness that consider your assumptions and your observations, and justified strengths and limitations.</p>
<h3>Verify your results</h3>
<ul>
<li><b>Check by two methods.</b> Recompute the slope by hand and with technology and show they agree.</li>
<li><b>Check the fit.</b> Compare each predicted value with the actual one. Residuals should be small and roughly balanced between positive and negative.</li>
<li><b>Test sensitivity.</b> Re-run the model with the revised 2015–17 value, or without one point, and report how much the prediction changes.</li>
<li><b>Check the sign and size.</b> Does a negative slope match the falling gaps in the table? Is a 2031 prediction between the latest gap and 0 sensible?</li></ul>
<h3>Justify the reasonableness of your answer</h3>
<p>Go back through your assumptions and observations one by one and say whether each held up.</p>
<div class="box ex"><b>Example wording</b>
<p><b>Assumption: linear trend.</b> The gap fell quickly from 2006 to 2016 but was almost flat from 2016 to 2021, so a straight line may overstate recent progress. My r value of −0.93 supports a linear fit, but with four points this is weak evidence. This makes the 2031 prediction an optimistic estimate.</p>
<p><b>Observation: estimates, not exact values.</b> The 2024 file gives 95% confidence intervals, and a change of 0.2 years between periods is small compared with this uncertainty. So I cannot be sure the gap changed at all between 2016 and 2021.</p></div>
<h3>Strengths and limitations</h3>
<p>Each statement needs an effect, and ideally an improvement.</p>
<div class="tw"><table><thead><tr><th>Strengths</th><th>Limitations</th></tr></thead><tbody>
<tr><td>Uses official ABS data that is consistent for both groups, so the gap is a fair comparison.</td><td>Only four points, so r and the line are fragile. A new data point could change the prediction a lot.</td></tr>
<tr><td>The model is simple to interpret: slope = years of gap closed per year.</td><td>2031 is 10 years beyond the data (extrapolation), so the prediction is uncertain.</td></tr>
<tr><td>Four time points, spanning 15 years, show a long-term pattern, not just one change.</td><td>The method changed between releases, so older and newer points may not be fully comparable.</td></tr>
<tr><td>Comparing the modelled slope with the rate needed gives a clear, testable answer.</td><td>The model ignores causes such as health programs and population changes.</td></tr>
</tbody></table></div>
<div class="box ex"><b>Example wording</b><p>A limitation is that the model uses only four data points. This means a single revised estimate could noticeably change the slope. To improve it, I could add data for more periods, or use the confidence intervals to give a range for the prediction.</p></div>`,
qs:[
Q("c","Q1","Residual = actual − predicted. Find the residuals for the female model G = 9.75 − 0.13x at x = 0, 5, 10, 15 (actual gaps 9.7, 9.5, 7.8, 8.1). Check their sum and name the largest.","Predicted: 9.75, 9.10, 8.45, 7.80.<br>Residuals: 9.7 − 9.75 = −0.05; 9.5 − 9.10 = +0.40; 7.8 − 8.45 = −0.65; 8.1 − 7.80 = +0.30.<br>Sum: −0.05 + 0.40 − 0.65 + 0.30 = 0, as it should be for a least-squares line.<br>The largest is −0.65 at x = 10 (2016), where the fit is weakest."),
Q("c","Q2","A student substitutes x = 2031 into G = 11.39 − 0.202x, where x is years since 2006. What do they get, and what went wrong?","G = 11.39 − 0.202 × 2031 = 11.39 − 410.262 = −398.9 years, which is nonsense.<br>x is years since 2006, so 2031 is x = 25. Then G = 11.39 − 5.05 = 6.34. Checking that a prediction is sensible catches this kind of error."),
Q("c","Q3","Rewrite this limitation so it has an effect and an improvement: “There are only four data points.”","Sample: There are only four data points, so one revised estimate could change the slope noticeably and r is weak evidence of a linear trend. To improve this, I could add data for more periods or use the confidence intervals to give a range for the prediction."),
Q("h","Q4","Sensitivity: the recalculated female gaps are 9.7, 9.5, 8.0, 8.1 (with 8.0 replacing 7.8 for 2015–17). Fit the line again and compare with the original (slope −0.13, 2031 prediction 6.5).","Mean of y = 35.3 ÷ 4 = 8.825. Sxy = −15.75 and Sxx = 125, so m = −0.126.<br>c = 8.825 + 0.126 × 7.5 = 9.77. The 2031 prediction is 9.77 − 0.126 × 25 = 6.62.<br>The slope changed from −0.130 to −0.126 and the prediction from 6.50 to 6.62 (about 0.12 years). The conclusion is unchanged: the model is not sensitive to this choice, and the gap is still far from 0 in 2031."),
Q("h","Q5","The male gap was 8.6 in 2015–17 and 8.8 in 2020–22. Explain why you cannot be sure the gap actually widened.","A rise of 0.2 years is small compared with the uncertainty in the estimates. The 2024 spreadsheet gives 95% confidence intervals, and the ABS also changed its method (the recalculated 2015–17 male gap is 8.7, so the change is only 0.1). The data do not show whether the gap really changed between 2016 and 2021."),
Q("h","Q6","Justify the reasonableness of the linear-trend assumption using the male gaps. Compare the average fall per year from 2006 to 2016 with the change from 2016 to 2021.","2006 to 2016: (11.5 − 8.6) ÷ 10 = 0.29 years per year (falling).<br>2016 to 2021: 8.6 to 8.8, a rise of 0.2 over 5 years.<br>The recent trend is not a steady fall, so a straight line (slope −0.202) may overstate recent progress. This makes the 2031 prediction an optimistic estimate, and the conclusion “not on track” is, if anything, stronger."),
Q("x","Q7","Take three of the assumptions from Formulate. For each, write one sentence judging whether it held up, using evidence from your results.","Sample (use your own evidence):<br>Linear trend: held up moderately (r ≈ −0.93) but the 2016 to 2021 flattening suggests it may overstate progress.<br>Midpoint years: held up, as the error of up to one year is small against a 15-year spread.<br>Trend continues to 2031: cannot be tested with the data, so the 2031 prediction is uncertain."),
Q("x","Q8","The data cover 15 years and the prediction is 10 years beyond the last point. Explain why this makes the prediction less reliable than predicting a value inside the data.","Interpolation (inside the data) is backed by points on both sides. Extrapolation (outside) assumes the trend continues unchanged, which cannot be checked. Here the prediction reaches two-thirds as far beyond the data as the data span (10 ÷ 15), and policies, population counts or methods could change in that time, so a small change in slope has a large effect on the 2031 gap.")
]},
{id:"6",wk:"Weeks 4–5",title:"6 Communicate (4 marks)",
th:`<p>Use correct mathematical language, organise the report logically, justify your decisions, and make sure it can be read without the task sheet. The oral presentation counts here, and you cannot earn all four marks without a complete one.</p>
<h3>Mathematical language to use correctly</h3>
<div class="tw"><table><thead><tr><th>Term</th><th>Use it like this</th></tr></thead><tbody>
<tr><td>Gap</td><td>Non-Indigenous life expectancy minus Indigenous life expectancy, in years.</td></tr>
<tr><td>Scatterplot, trend</td><td>“The scatterplot shows a negative trend: the gap decreases as time increases.”</td></tr>
<tr><td>Line of best fit, linear model</td><td>“I fitted a line of best fit using Excel’s linear regression.”</td></tr>
<tr><td>Gradient (slope), intercept</td><td>“The gradient of −0.202 means the gap decreases by about 0.2 years each year.”</td></tr>
<tr><td>Correlation coefficient, r</td><td>“r = −0.93 shows a strong negative linear correlation.”</td></tr>
<tr><td>Interpolation, extrapolation</td><td>“Predicting 2031 is extrapolation, because 2031 is outside my data.”</td></tr>
<tr><td>Residual</td><td>“The residual is the actual value minus the predicted value.”</td></tr>
<tr><td>Outlier</td><td>A point far from the pattern. Say whether you found one and what you did.</td></tr>
<tr><td>95% confidence interval</td><td>A range that is likely to contain the true value, which shows uncertainty in an estimate.</td></tr>
</tbody></table></div>
<p>Correlation does not mean causation. A trend in the gap does not on its own explain why the gap changed.</p>
<h3>Presentation of the report</h3>
<ul>
<li>Number and title every table and figure, label axes with units, refer to each in the text, and put the source under it.</li>
<li>Start the report with the context and the statement, so a reader with no task sheet knows what you are doing.</li>
<li>Define “on track” once, early, and use the same words each time.</li>
<li>Give each section a clear job and keep to the scaffold headings.</li>
<li>Use in-text citations such as (AIHW, 2024) that match your reference list.</li></ul>
<div class="box ex"><b>Reference list format (Harvard style; check your school’s preferred style)</b>
<p>Australian Bureau of Statistics (2023) <i>Aboriginal and Torres Strait Islander life expectancy, 2020–2022</i>. Available at: [URL from the spreadsheet source note] (Accessed: [the date you accessed it]).</p>
<p>Australian Institute of Health and Welfare (2024) <i>Measure 1.19 Life expectancy at birth</i>, Aboriginal and Torres Strait Islander Health Performance Framework. Available at: [URL] (Accessed: [date]).</p>
<p>Australian Bureau of Statistics (2018) <i>Life tables for Aboriginal and Torres Strait Islander Australians, 2015–2017</i>, Cat. no. 3302.0.55.003.</p></div>
<p>The 2024 spreadsheet’s source line has an “accessed [insert date]” placeholder. Fill in the real date you accessed it.</p>
<h3>The 12-slide presentation</h3>
<p>Use the REALM template if it differs, but a typical flow follows the report:</p>
<ol><li>Title and the statement</li><li>Context: what Closing the Gap is</li><li>Observations</li><li>Assumptions</li><li>Mathematical translation</li><li>The data</li><li>The model</li><li>Interpreting the model</li><li>The 2031 prediction and answer</li><li>Verification</li><li>Strengths and limitations</li><li>Conclusion and recommendations</li></ol>`,
qs:[
Q("c","Q1","Define interpolation and extrapolation. Which one is predicting the gap in 2031 from data for 2006 to 2021?","Interpolation is predicting inside the range of the data. Extrapolation is predicting outside it. Predicting 2031 is extrapolation, because 2031 is outside the data (2006 to 2021), so it is less reliable."),
Q("c","Q2","A student writes: “r = −0.93 proves that health programs closed the gap.” Correct the sentence.","Correct: “r = −0.93 shows a strong negative linear correlation between time and the gap.” Correlation does not mean causation, so the trend alone does not explain why the gap changed. A cause can only be claimed if a source supports it."),
Q("c","Q3","Write a good caption for a scatterplot of the male gap against year.","Sample: “Figure 1: Life expectancy gap (non-Indigenous minus Indigenous, years) for males against year, 2006 to 2021. Source: ABS (2018, 2023).” It is numbered, titled, says what is plotted with units, and gives the source."),
Q("h","Q4","Write the in-text citation and the reference-list entry for the AIHW life expectancy measure, using the Harvard format shown in this hub. Use placeholders for the URL and date.","In text: (AIHW, 2024).<br>Reference list: Australian Institute of Health and Welfare (2024) <i>Measure 1.19 Life expectancy at birth</i>, Aboriginal and Torres Strait Islander Health Performance Framework. Available at: [URL] (Accessed: [the date you accessed it]).<br>Fill in the real URL and the real access date."),
Q("h","Q5","Using the typical 12-slide flow in this hub, which slide introduces your decision rule, which one shows the 2031 prediction and answer, and what comes after the answer?","The decision rule belongs on slide 5 (Mathematical translation). The 2031 prediction and the answer are slide 9. After the answer come Verification (slide 10), Strengths and limitations (slide 11), then the Conclusion and recommendations (slide 12)."),
Q("h","Q6","Rewrite this sentence so it is respectful and does not claim a cause without evidence: “Indigenous people die younger because of their lifestyle.”","Sample: “The ABS estimates that life expectancy at birth for First Nations males was 71.9 years in 2020–22, compared with 80.6 years for non-Indigenous males.” State what the numbers show, use the terms from the task sheet, avoid blame or stereotypes, and only give causes that a cited source supports."),
Q("x","Q7","Describe what each of the three sentences of a short Introduction should do (about 100 words in total), without writing the introduction itself.","Sentence 1: the context (what Closing the Gap is and why life expectancy matters). Sentence 2: the statement you are evaluating (2031 target). Sentence 3: a one-line outline of your approach (calculate the gap, fit a linear model, compare the trend with the rate needed). Then write it in your own words so a reader with no task sheet understands.")
]},
{id:"7",wk:"Weeks 4–5",title:"7 What the QCAA samples show",
th:`<p>The QCAA publishes annotated sample responses to its senior Maths Methods problem-solving task. They are Year 11 and 12 work, but they use the same four criteria as your task, so they show what markers reward.</p>
<div class="tw"><table><thead><tr><th>High sample (19/20)</th><th>Mid sample (12/20)</th></tr></thead><tbody>
<tr><td>The introduction states the task, the approach and the finding.</td><td>Showed a data table with no source.</td></tr>
<tr><td>Each observation cites its source and explains how the data was collected.</td><td>Listed strengths and limitations without explaining their effect.</td></tr>
<tr><td>Assumptions are numbered, each with a reason and its effect on the model.</td><td>Did not fully connect the model’s results back to the question.</td></tr>
<tr><td>Models were compared with a measurable test, not just by eye.</td><td>Had a very brief conclusion.</td></tr>
<tr><td>Code and repeated calculations are in the appendix.</td><td>No in-text referencing or reference list.</td></tr>
<tr><td>Strengths and limitations each give an effect and a way to improve.</td><td></td></tr>
<tr><td>It lost one mark: its evaluation did not consider its assumptions.</td><td></td></tr>
</tbody></table></div>
<div class="box"><b>The pattern</b><p>The stronger report justifies, cites and links every decision. The weaker report states things without backing them up.</p></div>`,
qs:[
Q("c","Q1","Which sample would you expect each feature to come from, high or mid? (a) Data table with no source. (b) Numbered assumptions with reasons and effects. (c) Very brief conclusion. (d) Repeated calculations in the appendix.","(a) Mid. (b) High. (c) Mid. (d) High."),
Q("c","Q2","Why did the top sample lose its only mark, and how will you avoid the same loss?","Its evaluation never considered its assumptions. Avoid it by going back through each assumption in Evaluate and saying whether it held up, using evidence from your results (for example r, residuals and sensitivity checks)."),
Q("c","Q3","A report has a table of life expectancy figures with no source underneath. Which sample feature is this, and how do you fix it?","It matches the mid sample (a data table with no source). Fix it by putting the source under the table (for example, ABS, 2023), referring to the table in the text, and adding the full reference to the reference list."),
Q("h","Q4","Rewrite this weak strength so it matches the high sample: “The model is good.”","Sample: “The model is simple to interpret, because the slope is the number of years of gap closed per year. This makes it easy to compare with the rate needed, giving a clear, testable answer to the question.” A strength needs a reason and an effect."),
Q("h","Q5","Rewrite this weak conclusion so it links back to the question: “So the gap is closing.”","Sample structure: restate the problem (is Australia on track to close the gap by 2031?), give the key results (slope, 2031 prediction, rate needed), answer the question using your decision rule, then add one or two recommendations or next steps."),
Q("x","Q6","Audit your own draft against the high-sample list. Write down three things on that list your draft is still missing and what you will do about each.","Sample audit (use your own draft): No effect on a limitation: add the effect and an improvement. No reference to a source under Table 1: add the source and a reference-list entry. Assumptions not judged in Evaluate: add one sentence per assumption saying whether it held.")
]}
];

const EX={
"1":[["The marks are Formulate 4, Solve 7, Evaluate and verify 5, Communicate 4. What fraction of the 20 marks do Formulate and Evaluate together make up, and what does that tell you about where to spend time?","Formulate + Evaluate = 4 + 5 = 9 marks, so 9/20 = 45%, nearly half.<br>Solve has the single biggest share (7/20 = 35%), but a report that is strong only in Solve can still lose nearly half the marks. Give Formulate and Evaluate real time, not a rushed paragraph."],["A student plans 600 words on Formulate, 150 on Solve and 100 on Evaluate. Why is this a poor split, and what would be better?","Solve (7 marks) and Evaluate (5 marks) are worth more than Formulate (4 marks), but get far fewer words. A closer split follows the suggested budget: about 450 for Formulate, 550 for Solve and 500 for Evaluate, with about 100 for the Introduction and 150 for the Conclusion."]],
"2":[["Write an observation about the data with “It is observed that … It is justified by …”.","It is observed that the life expectancy gap is larger for males than for females in every period (for example 11.5 and 9.7 years in 2005–07). It is justified by the published gaps in the spreadsheets, so the model should treat males and females separately because they behave differently."],["Translate “Australia is on track to close the gap by 2031” into maths.","Variables: t = years since 2006 and G = gap in years (non-Indigenous minus Indigenous).<br>Model: G = mt + c from a line of best fit.<br>Target: G = 0 at t = 25 (2031).<br>Decision rule: the statement is supported if the model predicts G ≤ 0 in 2031, or if the size of the slope is at least the rate needed, which is the latest gap ÷ 10."]],
"3":[["Convert the period 2010–12 into a midpoint year and years since 2006, and find the male gap from the life expectancies 79.7 and 69.1.","Midpoint of 2010–12 is 2011, so years since 2006 is 5.<br>Gap = 79.7 − 69.1 = 10.6 years, which matches the published gap."],["For 2020–22 the male life expectancies are 80.6 and 71.9. Calculate the gap and compare with the published 8.8.","80.6 − 71.9 = 8.7, but the published gap is 8.8. The published value is calculated from unrounded figures, so use the published gap and say so in the report."]],
"4":[["Fit a line of best fit by hand to the male gaps (x = years since 2006): (0, 11.5), (5, 10.6), (10, 8.6), (15, 8.8). Then predict 2031 and compare with the rate needed.","Mean of x = 7.5 and mean of y = 9.875.<div class=\"tw\"><table><thead><tr><th>x</th><th>y</th><th>x − 7.5</th><th>y − 9.875</th><th>Product</th><th>(x − 7.5)²</th></tr></thead><tbody><tr><td>0</td><td>11.5</td><td>−7.5</td><td>1.625</td><td>−12.1875</td><td>56.25</td></tr><tr><td>5</td><td>10.6</td><td>−2.5</td><td>0.725</td><td>−1.8125</td><td>6.25</td></tr><tr><td>10</td><td>8.6</td><td>2.5</td><td>−1.275</td><td>−3.1875</td><td>6.25</td></tr><tr><td>15</td><td>8.8</td><td>7.5</td><td>−1.075</td><td>−8.0625</td><td>56.25</td></tr><tr><td><b>sum</b></td><td></td><td></td><td></td><td><b>−25.25</b></td><td><b>125</b></td></tr></tbody></table></div>Slope m = −25.25 ÷ 125 = −0.202 years per year.<br>Intercept c = 9.875 − (−0.202)(7.5) = 11.39, so G = 11.39 − 0.202x.<br>r ≈ −0.926 and R² ≈ 0.858 (a strong negative linear relationship).<br>Prediction for 2031 (x = 25): G = 11.39 − 0.202 × 25 = 6.34 years.<br>The line reaches 0 when x = 11.39 ÷ 0.202 ≈ 56.4, about the year 2062.<br>Rate needed from 2021: 8.8 ÷ 10 = 0.88 years per year. The model’s slope is 0.202, so the gap would need to close about 4.4 times faster."],["Write a sentence interpreting the male model G = 11.39 − 0.202x in context.","The slope of −0.202 means the model predicts the male gap shrinks by about 0.2 years each year. Closing the 8.8-year gap by 2031 would need about 0.88 years each year, so the trend is moving in the right direction but too slowly to reach 0 by 2031. The intercept of 11.39 is the modelled gap in 2006 (the published value was 11.5)."]],
"5":[["Find the residuals for the male model G = 11.39 − 0.202x and say what they show.","Predicted: 11.39, 10.38, 9.37, 8.36 at x = 0, 5, 10, 15.<br>Residuals (actual − predicted): +0.11, +0.22, −0.77, +0.44.<br>They add to 0 (as they should). The largest, −0.77 at 2016, shows the fit is weakest there. That is worth a sentence."],["Test sensitivity: refit the male line with the revised 2015–17 gap of 8.7 instead of 8.6.","Data: (0, 11.5), (5, 10.6), (10, 8.7), (15, 8.8). Mean of y = 9.9. Sxy = −25 and Sxx = 125, so m = −0.200 and c = 11.4.<br>2031 prediction: 11.4 − 0.2 × 25 = 6.4 (compared with 6.34).<br>The prediction changes by only 0.06 years, so the conclusion is not sensitive to this choice. That is a strong sentence for Evaluate."]],
"6":[["Rewrite this weak sentence using correct mathematical language: “The line goes down so the gap gets smaller.”","“The gradient of the line of best fit is −0.202, so the model predicts the gap decreases by about 0.2 years each year.” It names the gradient, gives its value with units, and says what it means in context."],["Build the reference-list entry for the ABS 2015–17 life tables, using the details in this hub.","Australian Bureau of Statistics (2018) <i>Life tables for Aboriginal and Torres Strait Islander Australians, 2015–2017</i>, Cat. no. 3302.0.55.003.<br>In text: (ABS, 2018). Always check the details against the real source and add the URL and access date if your style asks for them."]],
"7":[["Does this describe the high or mid sample? “It stated assumptions in a list but never said how each affects the model.”","Mid-type work. Strong work gives each assumption a reason and its effect on the model. Without the effect, a marker cannot see how the assumption changes the results."],["The high sample lost one mark. What is the lesson for your Evaluate section?","Its evaluation did not consider its assumptions, so the lesson is to go back through every assumption and judge whether it held up. A table with columns Assumption, Did it hold? and Evidence is a quick way to check you have covered each one."]]
};

function fr(t){
 for(let i=0;i<t.length;i++){
  if(t[i]!="/")continue;
  let l=i-1,r=i+1,l2=l,r2=r;
  while(t[l2]==" ")l2--;while(t[r2]==" ")r2++;
  if(")]".includes(t[l2]||"#")&&"([".includes(t[r2]||"#")){l=l2;r=r2}else if(t[l]==" "||t[r]==" ")continue;
  let ls,re;
  if(")]".includes(t[l])){ls=mt(t,l,-1);if(ls<0)continue}else{ls=l;while(ls>=0&&W.test(t[ls]))ls--;ls++}

  const A0=t.slice(ls,l+1),B0=t.slice(r,re+1),bad=x=>!/^[(\[]/.test(x)&&/[A-Za-z]{3,}/.test(x);if(bad(A0)||bad(B0))continue;

  t=t.slice(0,ls)+h+t.slice(re+1);i=ls+h.length-1}

  if(P["r:"+key]==v){delete P["r:"+key];delete P["rt:"+key]}
  else{P["r:"+key]=v;P["rt:"+key]=Date.now();if(v=="g")P[key]=true}
  save();return P["r:"+key]
}
const origQ=qCard;
qCard=function(s,q){
  const key=s.id+q.r,r=P["r:"+key];
  const row='<div class="rate"><span>How did it go?</span>'+["g","n","x"].map(k=>'<button class="rb'+(r==k?" on "+k:"")+'" data-rate="'+k+'" data-rk="'+key+'">'+IC[k]+" "+LB[k]+"</button>").join("")+"</div>";
  return origQ(s,q).replace("<details>",row+"<details>")
};
FL.push(["w","⚠ Needs work"]);
const origFill=fill;
fill=function(){
  const w=filt=="w";if(w)filt="all";
  origFill();
  if(w){filt="w";prune()}
};
function prune(){
  const res=$("res");if(!res)return;
  res.querySelectorAll(".q").forEach(el=>{const v=P["r:"+el.id.slice(2)];if(v!="n"&&v!="x")el.remove()});
  res.querySelectorAll("section").forEach(sec=>{
    if(!sec.querySelector(".q")){sec.remove();return}
    sec.querySelectorAll("h3").forEach(h=>{let n=h.nextElementSibling,c=0;while(n&&n.tagName!="H3"){if(n.classList.contains("q"))c++;n=n.nextElementSibling}
      if(!c)h.remove();else h.textContent=h.textContent.replace(/\(\d+\)\s*$/,"("+c+")")})
  });
  if(!res.querySelector(".q"))res.innerHTML='<p class="sub">Nothing is marked “Nearly” or “Not yet”. Rate questions after you try them and they will collect here.</p>'
}

/* ---------- Feature 1: spaced flashcards ---------- */
const INT=[0,1,3,7,14];          // days until the next review for boxes 1 to 5
const ck=i=>"c:"+hash(FC[i][0]);
const cst=i=>P[ck(i)]||null;
const isDue=i=>{const c=cst(i);return!c||c.d<=Date.now()};
const dueList=()=>FC.map((_,i)=>i).filter(isDue);
function gradeCard(i,v){
  const c=cst(i)||{b:0,d:0};let b=c.b,d;
  if(v=="a"){b=0;d=Date.now()+10*60e3}
  else if(v=="n"){d=Date.now()+Math.max(1,Math.round(INT[b]/2))*DAY}
  else{b=Math.min(4,b+1);d=Date.now()+INT[b]*DAY}
  P[ck(i)]={b:b,d:d,t:Date.now()};save();return P[ck(i)]
}
function nextDue(){
  let m=Infinity;FC.forEach((_,i)=>{const c=cst(i);if(c&&c.d<m)m=c.d});
  if(m===Infinity)return"";const h=Math.max(1,Math.round((m-Date.now())/36e5));
  return h<24?"in about "+h+" hour"+(h==1?"":"s"):"in about "+Math.round(h/24)+" day"+(Math.round(h/24)==1?"":"s")
}
const mode=()=>P["cmode"]||"due";
function syncFC(){fc.o=mode()=="due"?shuffle(dueList()):FC.map((_,i)=>i);fc.i=0;fc.f=false}
revP=function(){
  syncFC();const due=dueList().length,m=mode();
  return'<section id="FC"><span class="wk">Revision</span><h2>Flashcards &amp; cheat sheet</h2>'+
  '<div class="fcstat"><span><b id="fcdue">'+due+'</b> due today · '+(FC.length-due)+' not due</span><span class="acts"><button data-fcm="due" class="'+(m=="due"?"on":"")+'">Study due cards</button><button data-fcm="all" class="'+(m=="all"?"on":"")+'">All cards</button></span></div>'+
  '<div id="fcard" class="fcard" tabindex="0"></div>'+
  '<div id="fcr" class="acts" style="display:none"><button class="rb x" data-fcr="a">🔁 Again</button><button class="rb n" data-fcr="n">🟡 Almost</button><button class="rb g" data-fcr="g">✅ Got it</button></div>'+
  '<div class="acts"><button id="fp">◀ Prev</button><button id="fn">Next ▶</button><button id="fs">🔀 Shuffle</button><span class="sub" id="fcn"></span></div>'+
  '<p class="sub" style="margin:8px 0 0">Flip the card, then rate yourself. “Again” brings it back soon, “Got it” moves it to a longer gap (1, 3, 7, then 14 days).</p>'+
  '<details class="rs"><summary>Show all cards as a cheat sheet</summary><table>'+FC.map(x=>"<tr><td><b>"+fm(x[0])+"</b></td><td>"+fm(x[1])+"</td></tr>").join("")+"</table></details></section>"
};
drawFC=function(){
  const c=$("fcard");if(!c)return;
  const r=$("fcr"),n=$("fcn");
  if(!fc.o.length){c.className="fcard";c.innerHTML=(mode()=="due"?"🎉 All caught up!<br><small>No cards are due right now"+(nextDue()?". The next one is due "+nextDue():"")+".</small>":"No cards yet.");r.style.display="none";n.textContent="";return}
  const x=FC[fc.o[fc.i]];
  c.className="fcard"+(fc.f?" bk":"");c.innerHTML=fm(fc.f?x[1]:x[0]);
  r.style.display=fc.f?"flex":"none";
  n.textContent=(fc.i+1)+" / "+fc.o.length+(fc.f?"":" (tap card to flip)")
};

/* ---------- Feature 2: Quiz me (mixed, shuffled practice) ---------- */
let qz={step:"setup",sel:null,n:10,pri:true,list:[],i:0,show:false,res:[]};
const allQ=()=>{const a=[];D.forEach(s=>s.qs.forEach(q=>a.push({s:s,q:q,key:s.id+q.r})));return a};
function buildList(sel,n,pri,only){
  let pool=allQ().filter(x=>sel.has(x.s.id)&&(!only||only.has(x.key)));
  const w=x=>{if(!pri)return Math.random();const v=P["r:"+x.key];const base=v=="x"?3:v=="n"?2:!v?1.2:0.25;return base*(0.6+Math.random())};
  pool=pool.map(x=>({x:x,w:w(x)})).sort((a,b)=>b.w-a.w).slice(0,n).map(o=>o.x);
  return shuffle(pool)
}
function startQuiz(){
  const sel=qz.sel||new Set(D.map(s=>s.id));
  qz.list=buildList(sel,qz.n,qz.pri,null);qz.i=0;qz.show=false;qz.res=[];qz.step=qz.list.length?"run":"setup"
}
function quizP(){
  if(qz.step=="run")return qRun();
  if(qz.step=="end")return qEnd();
  const sel=qz.sel||(qz.sel=new Set(D.map(s=>s.id)));
  const rated=allQ().filter(x=>P["r:"+x.key]=="n"||P["r:"+x.key]=="x").length;
  return'<section><span class="wk">Mixed practice</span><h2>🎯 Quiz me</h2>'+
  '<p class="sub">A shuffled mix of questions from the topics you choose. Mixing topics trains you to decide <i>which</i> method to use, and trying an answer before looking is one of the best ways to learn. Work each one on paper, then check and rate yourself.</p>'+
  '<h3>Topics</h3><div class="acts">'+D.map(s=>'<button data-qt="'+s.id+'" class="'+(sel.has(s.id)?"on":"")+'">'+s.id+" "+nm(s)+"</button>").join("")+"</div>"+
  '<div class="acts"><button data-qall="1">Select all</button><button data-qnone="1">Clear</button></div>'+
  '<h3>Number of questions</h3><div class="acts">'+[5,10,15,20].map(n=>'<button data-qn="'+n+'" class="'+(qz.n==n?"on":"")+'">'+n+"</button>").join("")+"</div>"+
  '<label class="d" style="display:flex;gap:8px;align-items:center;margin:12px 0"><input type="checkbox" id="qpri" '+(qz.pri?"checked":"")+'> Prioritise questions I have not got yet'+(rated?" ("+rated+" marked to practise)":"")+"</label>"+
  '<div class="acts"><button class="on" data-qstart="1">Start quiz</button></div></section>'
}
function qRun(){
  const it=qz.list[qz.i],s=it.s,q=it.q;
  let h='<section><span class="wk">Question '+(qz.i+1)+" of "+qz.list.length+"</span> <span class=\"wk\">"+s.id+" "+nm(s)+"</span>"+
  '<div style="height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 10px"><i style="display:block;height:100%;width:'+Math.round(100*qz.i/qz.list.length)+'%;background:var(--ok,#1f8f55)"></i></div>'+
  '<div class="qzq"><b>'+q.r+"</b> "+fm(q.q)+(q.fig?'<div class="fig">'+q.fig+"</div>":"")+"</div>";
  if(!qz.show)h+='<p class="sub">Try it on paper first.</p><div class="acts"><button class="on" data-qshow="1">Show solution</button><button data-qstop="1">Stop quiz</button></div>';
  else h+='<div class="sol">'+fm(q.a)+(q.afig?'<div class="fig">'+q.afig+"</div>":"")+'</div><div class="rate"><span>How did it go?</span>'+["g","n","x"].map(k=>'<button class="rb" data-qr="'+k+'">'+IC[k]+" "+LB[k]+"</button>").join("")+"</div>";
  return h+"</section>"
}
function qEnd(){
  const c={g:0,n:0,x:0};qz.res.forEach(r=>c[r.v]++);const t=qz.res.length||1;
  const miss=qz.res.filter(r=>r.v!="g");
  let h='<section><span class="wk">Quiz finished</span><h2>🎉 '+c.g+" of "+qz.res.length+" got it</h2>"+
  '<p class="sub">✅ '+c.g+" got it · 🟡 "+c.n+" nearly · ❌ "+c.x+" not yet ("+Math.round(100*c.g/t)+"% got it). Your ratings were saved, so “Needs work” on the Questions page and the next quiz will use them.</p>";
  if(miss.length){h+="<h3>To revisit ("+miss.length+")</h3>"+miss.map(r=>{const it=qz.list.find(x=>x.key==r.key);return'<div class="q"><div class="h"><div><b>'+it.s.id+" "+it.q.r+"</b> "+fm(it.q.q)+'</div></div><div class="acts"><button data-qopen="'+r.key+'">Open in Questions</button></div></div>'}).join("")}
  h+='<div class="acts" style="margin-top:12px">'+(miss.length?'<button class="on" data-qretry="1">Retry the ones I missed</button>':"")+'<button data-qnew="1">New quiz</button></div></section>';
  return h
}
const origBk=bkP;
bkP=function(id){return id=="quiz"?quizP():origBk(id)};
const origNav=navR;
navR=function(){
  origNav();
  if(pg=="rev"){const c=nav.querySelector(".chips2");if(c){const b=document.createElement("button");b.setAttribute("data-go","rev/quiz");b.className=tp=="quiz"?"on":"";b.textContent="🎯 Quiz me";c.insertBefore(b,c.children[1]||null)}}
};
const origQP=qP;
qP=function(){return origQP().replace('<button id="rn">','<button data-go="rev/quiz">🎯 Quiz me</button><button id="rn">')};

/* ---------- click handling (runs before the page's own handler) ---------- */
function redrawQuiz(scroll){main.innerHTML=quizP();if(scroll)window.scrollTo(0,0)}
function handle(e){
  const t=e.target.closest?e.target.closest("button,#fcard"):null;if(!t)return;
  const d=t.dataset||{};
  const stop=()=>{e.stopPropagation();e.preventDefault()};
  if(d.rate){stop();const k=d.rk,v=setRating(k,d.rate),row=t.parentElement;
    row.querySelectorAll(".rb").forEach(x=>{x.className="rb"+(v==x.dataset.rate?" on "+x.dataset.rate:"")});
    if(v=="g"){const cb=document.querySelector('input[data-k="'+k+'"]');if(cb)cb.checked=true}
    stat();return}
  if(pg=="rev"&&tp=="fc"){
    if(t.id=="fcard"){stop();if(fc.o.length){fc.f=!fc.f;drawFC()}return}
    if(t.id=="fn"){stop();if(fc.o.length){fc.i=(fc.i+1)%fc.o.length;fc.f=false;drawFC()}return}
    if(t.id=="fp"){stop();if(fc.o.length){fc.i=(fc.i+fc.o.length-1)%fc.o.length;fc.f=false;drawFC()}return}
    if(t.id=="fs"){stop();fc.o=shuffle(fc.o);fc.i=0;fc.f=false;drawFC();return}
    if(d.fcm){stop();P["cmode"]=d.fcm;save();main.innerHTML=revP();drawFC();return}
    if(d.fcr){stop();if(!fc.o.length)return;const idx=fc.o[fc.i];gradeCard(idx,d.fcr);
      if(mode()=="due"){fc.o.splice(fc.i,1);if(d.fcr=="a")fc.o.push(idx);if(fc.i>=fc.o.length)fc.i=0}
      else fc.i=(fc.i+1)%fc.o.length;
      fc.f=false;const el=$("fcdue");if(el)el.textContent=dueList().length;drawFC();return}
  }
  if(pg=="rev"&&tp=="quiz"){
    if(d.qt){stop();const s=qz.sel||(qz.sel=new Set());s.has(d.qt)?s.delete(d.qt):s.add(d.qt);redrawQuiz();return}
    if(d.qall){stop();qz.sel=new Set(D.map(s=>s.id));redrawQuiz();return}
    if(d.qnone){stop();qz.sel=new Set();redrawQuiz();return}
    if(d.qn){stop();qz.n=+d.qn;redrawQuiz();return}
    if(d.qstart){stop();const cb=$("qpri");if(cb)qz.pri=cb.checked;if(!qz.sel||!qz.sel.size)qz.sel=new Set(D.map(s=>s.id));startQuiz();redrawQuiz(true);return}
    if(d.qshow){stop();qz.show=true;redrawQuiz();return}
    if(d.qstop){stop();qz.step="setup";redrawQuiz(true);return}
    if(d.qr){stop();const it=qz.list[qz.i];P["r:"+it.key]=d.qr;P["rt:"+it.key]=Date.now();if(d.qr=="g")P[it.key]=true;save();stat();
      qz.res.push({key:it.key,v:d.qr});qz.i++;qz.show=false;if(qz.i>=qz.list.length)qz.step="end";redrawQuiz(true);return}
    if(d.qretry){stop();const only=new Set(qz.res.filter(r=>r.v!="g").map(r=>r.key));qz.list=shuffle(allQ().filter(x=>only.has(x.key)));qz.i=0;qz.show=false;qz.res=[];qz.step="run";redrawQuiz(true);return}
    if(d.qnew){stop();qz.step="setup";redrawQuiz(true);return}
    if(d.qopen){stop();const key=d.qopen,s=D.find(x=>Qm[key]&&x.qs.indexOf(Qm[key])>-1);pg="q";tp=s?s.id:tp;filt="all";qry="";render();const el=$("q-"+key);if(el){el.scrollIntoView({block:"center"});el.style.outline="2px solid var(--ac)";setTimeout(()=>{el.style.outline=""},2500)}return}
  }
}
main.addEventListener("click",handle,true);
window.__yt={ck:ck,setRating:setRating,gradeCard:gradeCard,dueList:dueList,buildList:buildList,handle:handle,quiz:()=>qz,startQuiz:startQuiz,quizP:quizP,qRun:qRun,qEnd:qEnd,syncFC:syncFC,INT:INT};
render();
})();
</script>
<script>
/* ===== Methods pack: Closing the Gap calculator, final checklist, overview strip ===== */
(function(){
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";

/* ---------- Calculator ---------- */
const PRE={
 m:{label:"Males (4 points)",rows:[[2006,11.5],[2011,10.6],[2016,8.6],[2021,8.8]]},
 f:{label:"Females (4 points)",rows:[[2006,9.7],[2011,9.5],[2016,7.8],[2021,8.1]]},
 mr:{label:"Males, revised 2015–17",rows:[[2006,11.5],[2011,10.6],[2016,8.7],[2021,8.8]]},
 fr:{label:"Females, revised 2015–17",rows:[[2006,9.7],[2011,9.5],[2016,8.0],[2021,8.1]]},
 m2:{label:"Males, two points only",rows:[[2016,8.6],[2021,8.8]]}
};
let rows=PRE.m.rows.map(r=>r.slice()),cur="m";
const fx=(v,d)=>isFinite(v)?v.toFixed(d):"not available";

function calcP(){
 return '<section><span class="wk">Tool</span><h2>🧮 Check your working</h2>'+
 '<p class="sub">Edit the numbers or load a preset to see the line of best fit, the prediction and the rate needed. Use it to check your hand and Excel results, and to see how sensitive the answer is to your choices.</p>'+
 '<div class="cx"><div class="acts" id="cxp" role="group" aria-label="Load a data set"></div>'+
 '<div class="cxg"><div class="cxr"><table><thead><tr><th>Year</th><th>Gap</th><th></th></tr></thead><tbody id="cxrows"></tbody></table>'+
 '<div class="acts"><button id="cxadd" type="button">Add row</button></div></div>'+
 '<div><svg id="cxsvg" class="chart" viewBox="0 0 640 340" role="img" aria-label="Scatterplot of gap against year with line of best fit"></svg>'+
 '<div class="lg"><span><i class="l1"></i>Line of best fit</span><span><i class="l2"></i>Rate needed to reach 0 in 2031</span><span><i class="l3"></i>2031</span></div></div></div>'+
 '<div class="cxo" id="cxo" aria-live="polite"></div><p class="sub" id="cxm"></p></div>'+
 '<div class="box"><b>⚠ What the presets teach</b><p>Load “Males, two points only”. The line now slopes upwards and predicts a larger gap in 2031, the opposite of the four-point result. A line through two points always fits perfectly (r = 1 or −1), so r tells you nothing. This is a good limitation to explain in Evaluate, and a reason to source more data.</p></div>'+
 '<div class="acts"><button data-go="learn/4">📖 Back to Solve</button><button data-go="q/4">✏️ Solve questions</button></div></section>'
}

function el(name,attrs,text){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;return e}

function cxDraw(svg,pts,f){
 while(svg.firstChild)svg.removeChild(svg.firstChild);
 const nw=window.innerWidth<560,W=nw?380:640,H=nw?330:340,L=nw?44:52,R=nw?14:20,T=14,B=44;let xmin=2004,xmax=2034,ymax=12;
 svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.classList.toggle("nw",nw);
 if(pts.length)xmin=Math.min(xmin,Math.floor(pts[0][0]/5)*5-1);
 pts.forEach(p=>{ymax=Math.max(ymax,Math.ceil(p[1])+1)});
 if(f)ymax=Math.max(ymax,Math.ceil(f.c)+1);
 ymax=Math.ceil(ymax/2)*2;
 const X=v=>L+(v-xmin)/(xmax-xmin)*(W-L-R),Y=v=>H-B-(v/ymax)*(H-T-B);
 for(let yt=0;yt<=ymax;yt+=2){svg.appendChild(el("line",{x1:L,x2:W-R,y1:Y(yt),y2:Y(yt),"class":"tick"}));svg.appendChild(el("text",{x:L-8,y:Y(yt)+4,"text-anchor":"end"},String(yt)))}
 for(let xt=Math.ceil(xmin/5)*5;xt<=xmax;xt+=5){svg.appendChild(el("line",{x1:X(xt),x2:X(xt),y1:T,y2:H-B,"class":"tick"}));svg.appendChild(el("text",{x:X(xt),y:H-B+18,"text-anchor":"middle"},String(xt)))}
 svg.appendChild(el("line",{x1:L,x2:L,y1:T,y2:H-B,"class":"axis"}));
 svg.appendChild(el("line",{x1:L,x2:W-R,y1:H-B,y2:H-B,"class":"axis"}));
 svg.appendChild(el("text",{x:(L+W-R)/2,y:H-8,"text-anchor":"middle"},"Year (midpoint of period)"));
 svg.appendChild(el("text",{x:14,y:(T+H-B)/2,"text-anchor":"middle",transform:"rotate(-90 14 "+((T+H-B)/2)+")"},"Gap (years)"));
 svg.appendChild(el("line",{x1:X(2031),x2:X(2031),y1:T,y2:H-B,"class":"goal"}));
 svg.appendChild(el("text",{x:X(2031)-4,y:T+12,"text-anchor":"end"},"2031"));
 if(f){
  const xa=pts[0][0],xb=f.last[0];
  svg.appendChild(el("line",{x1:X(xa),y1:Y(f.c+f.m*(xa-f.y0)),x2:X(xb),y2:Y(f.c+f.m*(xb-f.y0)),"class":"fit"}));
  svg.appendChild(el("line",{x1:X(xb),y1:Y(f.c+f.m*(xb-f.y0)),x2:X(2031),y2:Y(Math.max(0,f.c+f.m*(2031-f.y0))),"class":"fitx"}));
  svg.appendChild(el("line",{x1:X(xb),y1:Y(f.last[1]),x2:X(2031),y2:Y(0),"class":"need"}))}
 pts.forEach(p=>svg.appendChild(el("circle",{cx:X(p[0]),cy:Y(p[1]),r:5,"class":"pt"})))
}

function cxUpdate(){
 const out=$("cxo"),msg=$("cxm"),svg=$("cxsvg");if(!out)return;
 const pts=rows.filter(r=>isFinite(r[0])&&isFinite(r[1])).sort((a,b)=>a[0]-b[0]);
 out.innerHTML="";msg.textContent="";
 if(pts.length<2){msg.textContent="Enter at least two rows with a year and a gap to fit a line.";cxDraw(svg,pts,null);return}
 const y0=pts[0][0],n=pts.length,xs=pts.map(p=>p[0]-y0),ys=pts.map(p=>p[1]);
 const xm=xs.reduce((a,b)=>a+b,0)/n,ym=ys.reduce((a,b)=>a+b,0)/n;
 let sxy=0,sxx=0,syy=0;
 for(let i=0;i<n;i++){sxy+=(xs[i]-xm)*(ys[i]-ym);sxx+=Math.pow(xs[i]-xm,2);syy+=Math.pow(ys[i]-ym,2)}
 if(sxx===0){msg.textContent="The years need to be different from each other.";cxDraw(svg,pts,null);return}
 const m=sxy/sxx,c=ym-m*xm,r=syy===0?NaN:sxy/Math.sqrt(sxx*syy),pred=c+m*(2031-y0),last=pts[n-1];
 const need=last[1]/(2031-last[0]),zero=m<0?y0-c/m:null;
 const items=[
  ["Equation (x = years since "+y0+")","G = "+fx(c,2)+(m<0?" − ":" + ")+fx(Math.abs(m),3)+"x"],
  ["Slope m (years per year)",fx(m,3)],
  ["r",fx(r,3)],
  ["R²",isFinite(r)?fx(r*r,3):"not available"],
  ["Predicted gap in 2031",fx(pred,2)+" years"],
  ["Year the line reaches 0",zero===null?"never (slope is not negative)":"about "+Math.round(zero)],
  ["Rate needed ("+last[0]+" to 2031)",fx(need,3)+" per year"],
  ["Needed rate ÷ model rate",m<0?fx(need/Math.abs(m),1)+" times":"not available"]
 ];
 items.forEach(it=>{const d=document.createElement("div"),s=document.createElement("span"),b=document.createElement("b");s.textContent=it[0];b.textContent=it[1];d.appendChild(s);d.appendChild(b);out.appendChild(d)});
 if(n===2)msg.textContent="With only two points a straight line always fits perfectly, so r = 1 or −1 tells you nothing about how good the model is.";
 else if(m>=0)msg.textContent="The slope is not negative, so this model says the gap is not closing.";
 else if(pred>0)msg.textContent="The model predicts a gap still above 0 in 2031, and the rate needed is larger than the model’s rate of change.";
 else msg.textContent="The model predicts the gap reaches 0 by 2031.";
 cxDraw(svg,pts,{m:m,c:c,y0:y0,last:last})
}

function cxRows(){
 const tb=$("cxrows");if(!tb)return;tb.innerHTML="";
 rows.forEach((r,i)=>{
  const tr=document.createElement("tr");
  tr.innerHTML='<td><input type="number" inputmode="decimal" step="1" aria-label="Year, row '+(i+1)+'" value="'+r[0]+'"></td><td><input type="number" inputmode="decimal" step="0.1" aria-label="Gap in years, row '+(i+1)+'" value="'+r[1]+'"></td><td><button type="button" aria-label="Remove row '+(i+1)+'">×</button></td>';

  tb.appendChild(tr)})
}

 cxRows();cxUpdate();cxMark()
}

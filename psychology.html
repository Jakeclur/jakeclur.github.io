<script>
const SITE={"key": "y10psych", "title": "Year 10 Psychology Study Hub", "sub": "Topic 1: Role of the brain · Topic 2: Intelligence · Emotion and wellbeing. Tick questions off as you go. Try each question first, then reveal the answer.", "foot": "Notes based on your class slides (lessons 5, 6, 7, 9, 10) and your Topic 1 and Topic 2 success criteria. Practice questions, worked examples and tests were written for this hub, so check details against your teacher's notes.", "link": "https://claude.ai/artifact/Cizieb5a3NjstqNbTBXu4i", "hi": "Hi! Ask me anything about the brain, intelligence or emotion: explain an idea, check your answer, or ask for a hint instead of the full answer.", "sys": "You are a friendly psychology tutor for an Australian Year 10 student. Course topics: Topic 1 Role of the brain (neuron structure, hindbrain/midbrain/forebrain, lobes and localisation of function, Broca's and Wernicke's areas, history of invasive brain research and ethics, nervous system) and Topic 2 Intelligence (IQ and the psychometric approach, Stanford-Binet, WAIS-IV, WISC-V, validity and reliability, twin/family/adoption studies including the Minnesota Study of Twins Reared Apart, nature versus nurture, IQ versus EQ), plus theories of emotion (two-factor, appraisal), coping, the limbic system and LeDoux, happiness and flow. Teach the idea, not just the answer: if asked for a hint, give a nudge first; if they paste an answer, give feedback on what is correct and what is missing against the question. Be concise and encouraging. Write in plain text with no markdown headings. If asked something outside psychology, briefly help or steer back.", "sug": ["Explain the three parts of the brain simply", "How do twin studies show heritability?", "Validity vs reliability with an example", "Check my answer (I'll paste it)"]};
const Q=(t,r,q,a)=>({t,r,q,a});
const D=[{"id": "B1", "wk": "Topic 1: Role of the brain", "title": "B1 The neuron", "th": "<div class=\"box\"><b>Success criterion:</b> I can label and explain the function of the dendrites, cell body, axon, myelin sheath and axon terminals.</div><p>Neurons are the nerve cells that carry information around the nervous system (the human brain has roughly 86 billion of them). Each neuron has the same five key parts.</p>\n<figure><svg viewBox=\"0 0 700 262\" role=\"img\" aria-label=\"Structure of a neuron\"><defs><marker id=\"m8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" style=\"fill:var(--a)\"/></marker></defs><g class=\"ln2\"><path d=\"M140 104 C115 90 100 70 75 58\" class=\"dn\"/><path d=\"M104 80 L72 86\" class=\"dn\"/><path d=\"M134 120 L62 120\" class=\"dn\"/><path d=\"M96 120 L70 100\" class=\"dn\"/><path d=\"M140 136 C115 150 100 170 75 182\" class=\"dn\"/><path d=\"M104 160 L72 154\" class=\"dn\"/></g><circle cx=\"170\" cy=\"120\" r=\"36\" class=\"n\"/><circle cx=\"170\" cy=\"120\" r=\"12\" style=\"fill:var(--a);fill-opacity:.55\"/><line x1=\"206\" y1=\"120\" x2=\"565\" y2=\"120\" class=\"dn\" style=\"stroke-width:5\"/><rect x=\"225\" y=\"106\" width=\"75\" height=\"28\" rx=\"14\" fill=\"#e8c06a\" stroke=\"#b8860b\" stroke-width=\"1.5\"/><rect x=\"308\" y=\"106\" width=\"75\" height=\"28\" rx=\"14\" fill=\"#e8c06a\" stroke=\"#b8860b\" stroke-width=\"1.5\"/><rect x=\"391\" y=\"106\" width=\"75\" height=\"28\" rx=\"14\" fill=\"#e8c06a\" stroke=\"#b8860b\" stroke-width=\"1.5\"/><rect x=\"474\" y=\"106\" width=\"66\" height=\"28\" rx=\"14\" fill=\"#e8c06a\" stroke=\"#b8860b\" stroke-width=\"1.5\"/><path d=\"M565 120 L605 82\" class=\"dn\"/><path d=\"M565 120 L616 120\" class=\"dn\"/><path d=\"M565 120 L605 158\" class=\"dn\"/><circle cx=\"609\" cy=\"78\" r=\"8\" class=\"n hi\"/><circle cx=\"622\" cy=\"120\" r=\"8\" class=\"n hi\"/><circle cx=\"609\" cy=\"162\" r=\"8\" class=\"n hi\"/><text class=\"b\" x=\"20\" y=\"22\" text-anchor=\"start\">Dendrites</text><text class=\"s\" x=\"20\" y=\"36\" text-anchor=\"start\">receive signals</text><path class=\"ln\" d=\"M60 40 L78 58\"/><text class=\"b\" x=\"215\" y=\"22\" text-anchor=\"middle\">Axon</text><text class=\"s\" x=\"215\" y=\"36\" text-anchor=\"middle\">carries the impulse</text><path class=\"ln\" d=\"M215 42 L215 114\"/><text class=\"b\" x=\"400\" y=\"22\" text-anchor=\"middle\">Myelin sheath</text><text class=\"s\" x=\"400\" y=\"36\" text-anchor=\"middle\">insulates and speeds the signal</text><path class=\"ln\" d=\"M420 42 L420 106\"/><text class=\"b\" x=\"150\" y=\"196\" text-anchor=\"middle\">Cell body (soma)</text><text class=\"s\" x=\"150\" y=\"210\" text-anchor=\"middle\">nucleus; keeps the cell alive,</text><text class=\"s\" x=\"150\" y=\"224\" text-anchor=\"middle\">combines incoming signals</text><path class=\"ln\" d=\"M160 160 L160 180\"/><text class=\"s\" x=\"335\" y=\"172\" text-anchor=\"middle\">Node of Ranvier (gap)</text><path class=\"ln\" d=\"M304 160 L304 134\"/><path class=\"ln\" d=\"M304 160 L330 162\"/><text class=\"b\" x=\"585\" y=\"196\" text-anchor=\"middle\">Axon terminals</text><text class=\"s\" x=\"585\" y=\"210\" text-anchor=\"middle\">release neurotransmitters</text><text class=\"s\" x=\"585\" y=\"224\" text-anchor=\"middle\">into the synapse</text><path class=\"ln\" d=\"M600 183 L608 172\"/><path class=\"ar\" d=\"M230 252 L520 252\" marker-end=\"url(#m8)\"/><text class=\"xs\" x=\"375\" y=\"246\" text-anchor=\"middle\">direction of the signal</text></svg><figcaption>Schematic neuron (not to scale). The signal travels dendrites → cell body → axon → axon terminals, then crosses the synapse to the next neuron.</figcaption></figure>\n\n<div class=\"tw\"><table>\n<tr><th>Part</th><th>Structure</th><th>Function</th></tr>\n<tr><td><b>Dendrites</b></td><td>Short, branching extensions from the cell body</td><td>Receive signals (neurotransmitters) from other neurons and pass them to the cell body</td></tr>\n<tr><td><b>Cell body (soma)</b></td><td>Contains the nucleus and organelles</td><td>Keeps the cell alive and combines incoming signals to \"decide\" whether the neuron will fire</td></tr>\n<tr><td><b>Axon</b></td><td>One long fibre leaving the cell body</td><td>Carries the electrical impulse away from the cell body toward other cells</td></tr>\n<tr><td><b>Myelin sheath</b></td><td>Fatty insulating layer wrapped around the axon in segments, with small gaps called nodes of Ranvier</td><td>Insulates and protects the axon and makes the impulse travel much faster (it \"jumps\" between the nodes). Damage to myelin slows or disrupts messages (as in multiple sclerosis)</td></tr>\n<tr><td><b>Axon terminals</b> (terminal buttons)</td><td>Branched ends of the axon containing vesicles of neurotransmitter</td><td>Release neurotransmitters into the synapse (the tiny gap) to pass the message to the next neuron</td></tr>\n</table></div>\n<div class=\"box\"><b>Relay analogy (from Lesson 7):</b> dendrites receive the baton, the cell body decides what to do, the axon runs the race, the terminal buttons hand over the baton, and neurotransmitters are the baton. <b>Direction:</b> dendrites → cell body → axon → axon terminals → synapse → next neuron.</div>\n<p><b>Types of neuron:</b> sensory neurons carry information from the body to the CNS; motor neurons carry commands from the CNS to muscles and glands; interneurons connect neurons within the brain and spinal cord.</p>", "qs": [{"t": "c", "r": "Q1", "q": "Label and explain the function of the parts of a neuron.", "a": "Dendrites receive signals; the cell body keeps the cell alive and combines signals; the axon carries the impulse away; the myelin sheath insulates the axon and speeds up transmission; axon terminals release neurotransmitters across the synapse to the next neuron."}, {"t": "x", "r": "Q2", "q": "Explain why damage to the myelin sheath causes problems with movement or sensation.", "a": "Myelin insulates the axon and lets the impulse travel quickly. If it is damaged, messages slow down or are disrupted, so signals reach muscles or the brain late or not at all, causing weakness, numbness or poor coordination."}, {"t": "c", "r": "Q3", "q": "Put these in the order a signal travels through one neuron: axon, dendrites, axon terminals, cell body.", "a": "Dendrites → cell body → axon → axon terminals (then across the synapse to the next neuron)."}]}, {"id": "B2", "wk": "Topic 1: Role of the brain", "title": "B2 Hindbrain, midbrain and forebrain", "th": "<div class=\"box\"><b>Success criterion:</b> I can describe the hindbrain, midbrain and forebrain and explain what types of behaviours each controls.</div><p>The brain can be viewed as discrete areas, each controlling different types of behaviour. In general, the lower, older areas control automatic survival functions and the higher areas control complex thinking and emotion.</p>\n<figure><svg viewBox=\"0 0 720 295\" role=\"img\" aria-label=\"Forebrain, midbrain and hindbrain\"><ellipse cx=\"340\" cy=\"205\" rx=\"65\" ry=\"28\" fill=\"#8e5bb5\" fill-opacity=\".4\" stroke=\"#8e5bb5\" stroke-width=\"2\"/><ellipse cx=\"247\" cy=\"218\" rx=\"28\" ry=\"17\" fill=\"#8e5bb5\" fill-opacity=\".4\" stroke=\"#8e5bb5\" stroke-width=\"2\"/><path d=\"M232 232 L262 232 L256 285 L240 285 Z\" fill=\"#8e5bb5\" fill-opacity=\".4\" stroke=\"#8e5bb5\" stroke-width=\"2\"/><rect x=\"228\" y=\"168\" width=\"38\" height=\"34\" rx=\"6\" fill=\"#e08a1e\" fill-opacity=\".45\" stroke=\"#e08a1e\" stroke-width=\"2\"/><path d=\"M60 140 C50 70 130 25 230 25 C330 22 400 55 410 115 C416 150 390 165 360 168 L300 170 L260 172 L180 170 C120 175 70 175 60 140Z\" fill=\"#3b82c4\" fill-opacity=\".35\" stroke=\"#3b82c4\" stroke-width=\"2\"/><text class=\"b\" x=\"235\" y=\"95\" text-anchor=\"middle\">FOREBRAIN</text><text class=\"s\" x=\"235\" y=\"111\" text-anchor=\"middle\">(cerebrum shown)</text><text class=\"s\" x=\"340\" y=\"209\" text-anchor=\"middle\">cerebellum</text><text class=\"s\" x=\"220\" y=\"189\" text-anchor=\"end\">midbrain</text><text class=\"s\" x=\"214\" y=\"222\" text-anchor=\"end\">pons</text><text class=\"s\" x=\"226\" y=\"262\" text-anchor=\"end\">medulla</text><rect x=\"440\" y=\"29\" width=\"13\" height=\"13\" rx=\"3\" fill=\"#3b82c4\" fill-opacity=\".5\" stroke=\"#3b82c4\" stroke-width=\"2\"/><text class=\"b\" x=\"460\" y=\"40\" text-anchor=\"start\">Forebrain</text><text class=\"s\" x=\"460\" y=\"55\" text-anchor=\"start\">cerebrum, thalamus, hypothalamus,</text><text class=\"s\" x=\"460\" y=\"69\" text-anchor=\"start\">limbic system, basal ganglia</text><text class=\"s\" x=\"460\" y=\"83\" text-anchor=\"start\">thought, emotion, memory, movement</text><rect x=\"440\" y=\"114\" width=\"13\" height=\"13\" rx=\"3\" fill=\"#e08a1e\" fill-opacity=\".5\" stroke=\"#e08a1e\" stroke-width=\"2\"/><text class=\"b\" x=\"460\" y=\"125\" text-anchor=\"start\">Midbrain</text><text class=\"s\" x=\"460\" y=\"140\" text-anchor=\"start\">superior/inferior colliculi,</text><text class=\"s\" x=\"460\" y=\"154\" text-anchor=\"start\">substantia nigra, reticular formation</text><text class=\"s\" x=\"460\" y=\"168\" text-anchor=\"start\">reflexes to sight and sound, arousal</text><rect x=\"440\" y=\"199\" width=\"13\" height=\"13\" rx=\"3\" fill=\"#8e5bb5\" fill-opacity=\".5\" stroke=\"#8e5bb5\" stroke-width=\"2\"/><text class=\"b\" x=\"460\" y=\"210\" text-anchor=\"start\">Hindbrain</text><text class=\"s\" x=\"460\" y=\"225\" text-anchor=\"start\">medulla, pons, cerebellum</text><text class=\"s\" x=\"460\" y=\"239\" text-anchor=\"start\">breathing, heart rate, balance,</text><text class=\"s\" x=\"460\" y=\"253\" text-anchor=\"start\">coordination</text></svg><figcaption>Schematic side view (not to scale). The brainstem (midbrain, pons, medulla) joins the forebrain to the spinal cord; the cerebellum sits at the back, under the cerebrum.</figcaption></figure>\n\n<div class=\"tw\"><table>\n<tr><th>Region</th><th>Structures</th><th>What it controls</th></tr>\n<tr><td rowspan=\"3\"><b>Hindbrain</b><br>(base of brain, joins the spinal cord; automatic survival and coordination)</td><td><b>Medulla</b></td><td>Heart rate, breathing, blood pressure, swallowing, vomiting. Damage can be life-threatening</td></tr>\n<tr><td><b>Pons</b></td><td>Relays messages between the cerebrum and cerebellum; involved in sleep and arousal, facial movement and sensation, and regulating breathing</td></tr>\n<tr><td><b>Cerebellum</b></td><td>Balance, posture, coordination of smooth voluntary movement, fine motor skills and motor learning (e.g. riding a bike, catching a ball)</td></tr>\n<tr><td><b>Midbrain</b><br>(small region above the pons)</td><td>Superior and inferior colliculi; substantia nigra; part of the reticular formation</td><td>Automatic reflex responses to sights and sounds (turning toward a loud noise), eye movement, alertness and arousal, and movement control (substantia nigra uses dopamine)</td></tr>\n<tr><td rowspan=\"5\"><b>Forebrain</b><br>(largest region; complex thought, emotion and voluntary behaviour)</td><td><b>Cerebrum</b> (cerebral cortex, four lobes, two hemispheres joined by the corpus callosum)</td><td>Perception, thinking, planning, language, memory, voluntary movement (see topic B3)</td></tr>\n<tr><td><b>Thalamus</b></td><td>Sensory relay station; sends incoming information (except smell) to the right brain areas</td></tr>\n<tr><td><b>Hypothalamus</b></td><td>Regulates body temperature, hunger, thirst and sleep; controls the stress response and hormones (through the pituitary gland)</td></tr>\n<tr><td><b>Limbic system</b> (amygdala, hippocampus, etc.)</td><td>Emotion, motivation, memory and learning (see topic E3)</td></tr>\n<tr><td><b>Basal ganglia</b></td><td>Smooth voluntary movement, habits, reward and decision-making</td></tr>\n</table></div>\n<p><b>Memory hook:</b> hindbrain = <i>keeps you alive and balanced</i>; midbrain = <i>quick reflexes and alertness</i>; forebrain = <i>think, feel, decide</i>. The <b>brainstem</b> is the stalk made of the midbrain, pons and medulla.</p>", "qs": [{"t": "c", "r": "Q1", "q": "Describe the hindbrain, midbrain and forebrain and the behaviours each controls.", "a": "Hindbrain (medulla, pons, cerebellum): breathing, heart rate, balance and coordination. Midbrain: reflex responses to sights and sounds, alertness and some movement control. Forebrain (cerebrum, thalamus, hypothalamus, limbic system): thinking, language, memory, emotion and voluntary movement."}, {"t": "h", "r": "Q2", "q": "A person has a stroke that damages the medulla. Why is this so dangerous?", "a": "The medulla controls breathing, heart rate and blood pressure. Damage can stop these automatic survival functions, so it can be life-threatening."}, {"t": "h", "r": "Q3", "q": "A person can move their muscles but cannot balance or coordinate smooth movements. Which brain region is most likely damaged? Explain.", "a": "The cerebellum (hindbrain). It coordinates balance, posture and smooth voluntary movement, so damage causes clumsy, unsteady movement."}]}, {"id": "B3", "wk": "Topic 1: Role of the brain", "title": "B3 Cortex and the four lobes (Lesson 5)", "th": "<div class=\"box\"><b>Success criterion:</b> I can use brain localisation to predict how damage to specific areas would affect cognition or behaviour.</div><h3>The cerebral cortex</h3>\n<ul>\n<li>Thin outer layer of the cerebrum (about 3 mm) containing billions of neurons.</li>\n<li>Humans have the largest, most complex cortex, which supports higher thinking (perception, memory, thinking, language, voluntary movement).</li>\n<li>It is folded to increase surface area. <b>Gyri</b> = raised folds. <b>Sulci</b> = grooves/valleys. Folds make room for more neurons and blood vessels (which deliver oxygen and glucose).</li>\n<li>Each hemisphere is divided into <b>four lobes</b>.</li>\n</ul>\n<div class=\"tw\"><table>\n<tr><th>Lobe</th><th>Memory hook</th><th>Functions</th><th>Primary area</th><th>If damaged</th></tr>\n<tr><td><b>Frontal</b></td><td>DO</td><td>Planning, decision-making, problem-solving, attention, impulse control, social behaviour, abstract thought, speech production (Broca's area), voluntary movement</td><td>Primary motor cortex</td><td>Poor decisions, repeats mistakes, acts without thinking, struggles to plan</td></tr>\n<tr><td><b>Parietal</b></td><td>FEEL</td><td>Touch, temperature, pressure, pain, spatial awareness/orientation, coordinating movement in the environment</td><td>Primary somatosensory cortex</td><td>Trouble processing sensations or judging where the body/objects are</td></tr>\n<tr><td><b>Temporal</b></td><td>HEAR and REMEMBER</td><td>Hearing, language, recognising voices/faces/objects, memory, linking sounds to emotions</td><td>Primary auditory cortex</td><td>Primary auditory damage: forms of deafness. Right auditory association cortex: trouble recognising non-verbal sounds or locating where a sound comes from</td></tr>\n<tr><td><b>Occipital</b></td><td>Occipital = Observe (SEE)</td><td>Vision: colour, shape, movement, interpreting what you see</td><td>Primary visual cortex</td><td>Vision problems</td></tr>\n</table></div>\n<figure><svg viewBox=\"0 0 700 272\" role=\"img\" aria-label=\"Side view of the left cerebral hemisphere with the four lobes\"><clipPath id=\"bc\"><path d=\"M70 170 C60 90 140 40 240 38 C340 34 420 70 430 140 C436 175 410 190 380 192 L330 195 C300 230 240 235 200 215 C170 205 150 200 120 200 C90 200 72 190 70 170 Z\"/></clipPath><g clip-path=\"url(#bc)\"><polygon points=\"0,0 250,0 238,157 140,172 100,300 0,300\" fill=\"#3b82c4\" fill-opacity=\".38\" stroke=\"#3b82c4\" stroke-width=\"2\"/><polygon points=\"250,0 360,0 350,140 238,157\" fill=\"#2e9e6b\" fill-opacity=\".38\" stroke=\"#2e9e6b\" stroke-width=\"2\"/><polygon points=\"140,172 238,157 350,140 350,300 100,300\" fill=\"#d98a1f\" fill-opacity=\".38\" stroke=\"#d98a1f\" stroke-width=\"2\"/><polygon points=\"360,0 700,0 700,300 350,300 350,140\" fill=\"#a855a8\" fill-opacity=\".38\" stroke=\"#a855a8\" stroke-width=\"2\"/></g><path d=\"M70 170 C60 90 140 40 240 38 C340 34 420 70 430 140 C436 175 410 190 380 192 L330 195 C300 230 240 235 200 215 C170 205 150 200 120 200 C90 200 72 190 70 170 Z\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"2\"/><line x1=\"243\" y1=\"40\" x2=\"231\" y2=\"150\" stroke=\"#1d4f8a\" stroke-width=\"7\" stroke-linecap=\"round\"/><line x1=\"257\" y1=\"40\" x2=\"245\" y2=\"150\" stroke=\"#14704a\" stroke-width=\"7\" stroke-linecap=\"round\"/><text class=\"xs\" x=\"238\" y=\"16\" text-anchor=\"end\">primary motor cortex</text><text class=\"xs\" x=\"262\" y=\"16\" text-anchor=\"start\">primary somatosensory cortex</text><path d=\"M240 20 L240 33\" class=\"ln\"/><path d=\"M260 20 L260 33\" class=\"ln\"/><text class=\"b\" x=\"150\" y=\"100\" text-anchor=\"middle\">Frontal</text><text class=\"s\" x=\"150\" y=\"116\" text-anchor=\"middle\">DO</text><text class=\"b\" x=\"305\" y=\"84\" text-anchor=\"middle\">Parietal</text><text class=\"s\" x=\"305\" y=\"100\" text-anchor=\"middle\">FEEL</text><text class=\"b\" x=\"392\" y=\"104\" text-anchor=\"middle\">Occipital</text><text class=\"s\" x=\"392\" y=\"120\" text-anchor=\"middle\">SEE</text><text class=\"b\" x=\"255\" y=\"188\" text-anchor=\"middle\">Temporal</text><text class=\"s\" x=\"255\" y=\"203\" text-anchor=\"middle\">HEAR + REMEMBER</text><text class=\"s\" x=\"60\" y=\"262\" text-anchor=\"start\">← front</text><text class=\"s\" x=\"440\" y=\"262\" text-anchor=\"end\">back →</text><rect x=\"450\" y=\"29\" width=\"13\" height=\"13\" rx=\"3\" fill=\"#3b82c4\" fill-opacity=\".5\" stroke=\"#3b82c4\" stroke-width=\"2\"/><text class=\"b\" x=\"470\" y=\"40\" text-anchor=\"start\">Frontal: DO</text><text class=\"s\" x=\"470\" y=\"55\" text-anchor=\"start\">planning, decisions, movement,</text><text class=\"s\" x=\"470\" y=\"69\" text-anchor=\"start\">speech production (Broca's area)</text><rect x=\"450\" y=\"87\" width=\"13\" height=\"13\" rx=\"3\" fill=\"#2e9e6b\" fill-opacity=\".5\" stroke=\"#2e9e6b\" stroke-width=\"2\"/><text class=\"b\" x=\"470\" y=\"98\" text-anchor=\"start\">Parietal: FEEL</text><text class=\"s\" x=\"470\" y=\"113\" text-anchor=\"start\">touch, pain, temperature,</text><text class=\"s\" x=\"470\" y=\"127\" text-anchor=\"start\">spatial awareness</text><rect x=\"450\" y=\"145\" width=\"13\" height=\"13\" rx=\"3\" fill=\"#d98a1f\" fill-opacity=\".5\" stroke=\"#d98a1f\" stroke-width=\"2\"/><text class=\"b\" x=\"470\" y=\"156\" text-anchor=\"start\">Temporal: HEAR + REMEMBER</text><text class=\"s\" x=\"470\" y=\"171\" text-anchor=\"start\">sound, language, memory,</text><text class=\"s\" x=\"470\" y=\"185\" text-anchor=\"start\">recognising voices and faces</text><rect x=\"450\" y=\"203\" width=\"13\" height=\"13\" rx=\"3\" fill=\"#a855a8\" fill-opacity=\".5\" stroke=\"#a855a8\" stroke-width=\"2\"/><text class=\"b\" x=\"470\" y=\"214\" text-anchor=\"start\">Occipital: SEE</text><text class=\"s\" x=\"470\" y=\"229\" text-anchor=\"start\">vision: colour, shape, movement</text></svg><figcaption>Schematic side view of one hemisphere (not to scale). Front of the brain is on the left. The motor and somatosensory strips sit either side of the central sulcus.</figcaption></figure>\n<div class=\"box\"><b>Frontal lobe extras:</b> largest lobe, last to fully develop, still developing through adolescence (\"the brain's CEO\"). Waving to a friend uses three areas: <b>Prefrontal</b> (plans) → <b>Premotor</b> (organises) → <b>Primary motor</b> (sends signals to muscles). Hook: Plan → Prepare → Perform.</div>\n<div class=\"box\"><b>Contralateral organisation:</b> each hemisphere controls the <i>opposite</i> side of the body. Left hemisphere → right body. Right hemisphere → left body. So damage to the right primary motor cortex affects the <b>left</b> side.</div>\n<p><b>Müller-Lyer illusion:</b> two lines look different but are the same length, showing the brain <i>interprets</i> what the eyes send it. <b>Temporal example:</b> hearing a song from primary school and instantly remembering a school camp. Electrical stimulation of the temporal lobe can make people hear sounds that are not there.</p>", "qs": [{"t": "c", "r": "Q1", "q": "Identify the four lobes and one key function of each.", "a": "Frontal: planning, decision-making, voluntary movement. Parietal: processes touch and spatial awareness. Temporal: processes sound; contributes to memory and recognition. Occipital: processes visual information."}, {"t": "c", "r": "Q2", "q": "Describe the cerebral cortex and why it matters.", "a": "The thin, folded outer layer of the cerebrum with billions of neurons. It handles perception, memory, thinking, language and voluntary movement. Folds increase surface area so more neurons fit in the skull."}, {"t": "h", "r": "Q3", "q": "Two functions each of the frontal and temporal lobes, with real-life examples.", "a": "Frontal: planning/decision-making (organising study time before an exam); voluntary movement (kicking a football). Temporal: auditory processing (recognising a favourite song); memory (remembering details of a birthday party)."}, {"t": "h", "r": "Q4", "q": "Explain contralateral organisation using an example.", "a": "Each hemisphere controls the opposite side of the body. For example, damage to the right primary motor cortex weakens or paralyses the left side of the body."}]}, {"id": "B4", "wk": "Topic 1: Role of the brain", "title": "B4 Language areas and localisation of function", "th": "<div class=\"box\"><b>Success criterion:</b> I can use brain localisation to predict how damage to specific areas would affect cognition or behaviour.</div><p><b>Localisation of function:</b> different brain areas perform different functions. Psychologists use it to predict the effects of damage (e.g. occipital damage → vision problems; frontal damage → planning, decision-making and impulse control problems).</p>\n<div class=\"tw\"><table>\n<tr><th></th><th>Broca's area</th><th>Wernicke's area</th><th>Geschwind's territory</th></tr>\n<tr><td><b>Location</b></td><td>Left frontal lobe, near motor cortex</td><td>Left temporal lobe, near auditory cortex</td><td>Inferior parietal lobule, between Broca's and Wernicke's</td></tr>\n<tr><td><b>Main function</b></td><td>Speech production</td><td>Language comprehension and interpretation</td><td>Links understanding and production of language</td></tr>\n<tr><td><b>Helps us</b></td><td>Form words and sentences; coordinate lips, tongue, vocal cords</td><td>Understand spoken/written language; produce grammatically correct speech</td><td>Connect sounds, meanings and symbols; link words to objects and concepts</td></tr>\n<tr><td><b>Processing</b></td><td>Motor planning for speech</td><td>Meaning and interpretation</td><td>Multimodal (auditory + visual together)</td></tr>\n<tr><td><b>If damaged</b></td><td><b>Broca's aphasia:</b> slow, effortful, halting speech; understanding mostly intact</td><td><b>Wernicke's aphasia:</b> fluent but meaningless speech; poor understanding</td><td><b>Conduction aphasia:</b> trouble repeating words; fluent with errors; understanding mostly intact</td></tr>\n<tr><td><b>Development</b></td><td>Present early</td><td>Present early</td><td>Develops around ages 5 to 7</td></tr>\n</table></div>\n<figure><svg viewBox=\"0 0 680 290\" role=\"img\" aria-label=\"How the language areas connect\"><defs><marker id=\"m2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" style=\"fill:var(--a)\"/></marker></defs><rect class=\"n\" x=\"20\" y=\"95\" width=\"190\" height=\"70\" rx=\"7\"/><text class=\"b\" x=\"115.0\" y=\"120.0\" text-anchor=\"middle\">Wernicke's area</text><text class=\"s\" x=\"115.0\" y=\"134.0\" text-anchor=\"middle\">left temporal lobe</text><text class=\"s\" x=\"115.0\" y=\"148.0\" text-anchor=\"middle\">understands language</text><rect class=\"n\" x=\"470\" y=\"95\" width=\"190\" height=\"70\" rx=\"7\"/><text class=\"b\" x=\"565.0\" y=\"120.0\" text-anchor=\"middle\">Broca's area</text><text class=\"s\" x=\"565.0\" y=\"134.0\" text-anchor=\"middle\">left frontal lobe</text><text class=\"s\" x=\"565.0\" y=\"148.0\" text-anchor=\"middle\">produces speech</text><rect class=\"n\" x=\"245\" y=\"180\" width=\"190\" height=\"62\" rx=\"7\"/><text class=\"b\" x=\"340.0\" y=\"201.0\" text-anchor=\"middle\">Geschwind's territory</text><text class=\"s\" x=\"340.0\" y=\"215.0\" text-anchor=\"middle\">inferior parietal lobule</text><text class=\"s\" x=\"340.0\" y=\"229.0\" text-anchor=\"middle\">multimodal link (ages 5-7)</text><path class=\"ar\" d=\"M115 95 C115 25 565 25 565 95\" marker-end=\"url(#m2)\"/><text class=\"s\" x=\"340\" y=\"40\" text-anchor=\"middle\">arcuate fasciculus (direct link)</text><path class=\"ar\" d=\"M115 165 L115 211 L245 211\" marker-end=\"url(#m2)\"/><path class=\"ar\" d=\"M435 211 L565 211 L565 165\" marker-end=\"url(#m2)\"/><text class=\"s\" x=\"340\" y=\"276\" text-anchor=\"middle\">Hear a word → understand its meaning → produce speech</text></svg><figcaption>Two routes link Wernicke's and Broca's areas: the arcuate fasciculus and Geschwind's territory (a parallel pathway). Arrows show the order: hear, understand, speak.</figcaption></figure>\n<h3>Key studies and facts</h3>\n<ul>\n<li><b>Broca (1861):</b> patient \"Tan\" understood language but could only say \"tan, tan\". He was intellectually normal, used gestures, and had right-side paralysis (so left-hemisphere damage). Autopsy found a lesion in the left frontal lobe. Broca later studied eight more patients with damage in the same area. This was the first strong evidence for localisation of function.</li>\n<li><b>Wernicke (1873):</b> studied a patient with a different language problem and linked it to a different region, supporting localisation (Broca's theory had been criticised at first).</li>\n<li><b>Geschwind:</b> neurologist who predicted the link between the two areas. Works alongside the <b>arcuate fasciculus</b>, a parallel pathway also linking Broca's and Wernicke's. Supports classification, interpretation, abstract thinking and complex language.</li>\n<li>Pathway idea: hear a sound → understand its meaning → produce speech.</li>\n</ul>\n\n<h3>Using localisation to predict the effects of damage</h3>\n<div class=\"tw\"><table>\n<tr><th>Area damaged</th><th>Function lost or changed</th><th>Predicted effect on cognition or behaviour</th></tr>\n<tr><td>Prefrontal cortex</td><td>Planning, judgement, impulse control</td><td>Poor decisions, acts without thinking, personality change (as in Phineas Gage)</td></tr>\n<tr><td>Primary motor cortex (e.g. right side)</td><td>Voluntary movement</td><td>Weakness or paralysis on the <b>opposite</b> side of the body (contralateral)</td></tr>\n<tr><td>Broca's area (left frontal)</td><td>Speech production</td><td>Slow, effortful speech, but understanding mostly intact</td></tr>\n<tr><td>Wernicke's area (left temporal)</td><td>Language comprehension</td><td>Fluent but meaningless speech; poor understanding</td></tr>\n<tr><td>Primary somatosensory cortex (parietal)</td><td>Touch, pain, temperature, body position</td><td>Reduced sensation on the opposite side; trouble judging where the body is in space</td></tr>\n<tr><td>Occipital lobe</td><td>Vision</td><td>Vision problems or loss, even though the eyes work</td></tr>\n<tr><td>Primary auditory cortex (temporal)</td><td>Hearing</td><td>Forms of deafness; right auditory association cortex: trouble recognising or locating non-verbal sounds</td></tr>\n<tr><td>Hippocampus</td><td>Forming new memories</td><td>Cannot form new long-term memories (as in patient H.M.)</td></tr>\n<tr><td>Amygdala</td><td>Detecting danger, fear</td><td>Reduced fear responses and trouble recognising fear in others</td></tr>\n<tr><td>Cerebellum</td><td>Balance and coordination</td><td>Clumsy, unsteady movement; trouble with fine motor tasks</td></tr>\n<tr><td>Medulla</td><td>Breathing and heart rate</td><td>Life-threatening</td></tr>\n</table></div>\n<p><b>How to answer a prediction question:</b> (1) name the area, (2) state its function, (3) predict the specific change to thinking, feeling or behaviour, and (4) give a short example. <b>Limits:</b> many behaviours involve several areas working together, damage is often spread across regions, and the brain can partly recover (plasticity), so predictions are likely effects rather than certainties.</p>", "qs": [{"t": "h", "r": "Q1", "q": "How can psychologists use localisation of function to predict the effects of brain damage?", "a": "Because different regions have different roles, knowing which area is damaged predicts the change. Occipital damage → vision problems. Frontal damage → planning, decision-making and impulse control problems."}, {"t": "h", "r": "Q2", "q": "A person has damage to Broca's area. Predict the effects.", "a": "Speech production is affected: speech would be slow, halting and effortful, but understanding of language is mostly intact (Broca's aphasia). This is predicted because language production is localised to the left frontal lobe."}, {"t": "h", "r": "Q3", "q": "Compare Broca's aphasia and Wernicke's aphasia.", "a": "Broca's aphasia (left frontal lobe): slow, effortful, halting speech but understanding mostly intact. Wernicke's aphasia (left temporal lobe): speech is fluent but meaningless and understanding is poor."}]}, {"id": "B5", "wk": "Topic 1: Role of the brain", "title": "B5 How we learned about the brain: risky and invasive practices", "th": "<div class=\"box\"><b>Success criterion:</b> I can explain how early knowledge about the brain came from risky or invasive practices and why this raises ethical concerns.</div><p>Much early knowledge about the brain came from accidents, disease, surgery and experiments on patients and animals. This gave major discoveries but often came at a serious cost to the people involved.</p>\n<div class=\"tw\"><table>\n<tr><th>Case or method</th><th>What happened</th><th>What it taught us</th><th>Ethical concern</th></tr>\n<tr><td><b>Phineas Gage</b> (1848)</td><td>An iron rod passed through his left frontal lobe in a railway accident. He survived</td><td>Frontal lobe damage changed personality, planning and impulse control</td><td>Single case with limited records; he was displayed publicly; no consent or protection for his privacy</td></tr>\n<tr><td><b>Broca's patient \"Tan\"</b> (1861) and <b>Wernicke</b> (1873)</td><td>Patients with language problems were studied; autopsies after death found brain lesions</td><td>Localisation of function (Broca's and Wernicke's areas)</td><td>Relied on patients suffering damage; research on a person who could not give meaningful consent</td></tr>\n<tr><td><b>Lobotomy</b> (Moniz 1935; Freeman 1940s)</td><td>Nerve fibres in the frontal lobes were cut or damaged to treat mental illness. Freeman's transorbital version went through the eye socket, often without an operating theatre</td><td>Showed the frontal lobes' role in personality and emotion</td><td>Little evidence it worked; often done on vulnerable patients (including children) without real consent; caused apathy, loss of personality, brain damage and death. Thousands of people were affected</td></tr>\n<tr><td><b>Electrical stimulation</b> (Penfield, 1930s onward)</td><td>Awake epilepsy patients had the cortex stimulated during surgery</td><td>Mapped motor and sensory areas of the cortex</td><td>Risky surgery; the research was done during treatment, so patients' consent and wellbeing had to come first</td></tr>\n<tr><td><b>H.M.</b> (1953)</td><td>Both hippocampi were removed to treat severe epilepsy; he could no longer form new memories</td><td>The hippocampus is essential for forming long-term memories</td><td>Irreversible harm from an experimental operation; questions about his ability to give informed consent as he kept being studied for decades</td></tr>\n<tr><td><b>Split-brain surgery</b> (Sperry and Gazzaniga, 1960s)</td><td>The corpus callosum was cut to treat severe epilepsy</td><td>Left and right hemispheres have different specialisations</td><td>Major surgery; research followed treatment</td></tr>\n<tr><td><b>Animal lesion studies</b></td><td>Parts of animal brains were removed or damaged to see what behaviour changed</td><td>Linked brain areas to functions</td><td>Animal suffering and welfare; results may not transfer fully to humans</td></tr>\n</table></div>\n<h3>Why these raise ethical concerns</h3>\n<ul>\n<li><b>Informed consent:</b> patients (especially children or those with mental illness or brain damage) may not understand risks or be able to agree.</li>\n<li><b>Harm versus benefit:</b> researchers must avoid or minimise harm, and benefits must justify the risks. Lobotomy caused great harm with little benefit.</li>\n<li><b>Vulnerable people:</b> patients in institutions or with serious illness were more easily pressured or exploited.</li>\n<li><b>Privacy and respect:</b> identifying details of patients such as Gage and H.M. became public.</li>\n<li><b>Animal welfare:</b> animals cannot consent and may suffer.</li>\n<li><b>Limits of the evidence:</b> case studies of one person are hard to generalise and have no control group.</li>\n</ul>\n<p><b>Today:</b> research follows ethical guidelines (e.g. the Nuremberg Code, Declaration of Helsinki, and in Australia the NHMRC National Statement) and is approved by ethics committees. Key principles: informed consent, the right to withdraw, minimising harm, confidentiality, and weighing risk against benefit. Non-invasive tools such as MRI, fMRI, CT, PET and EEG now let researchers study living brains safely.</p>", "qs": [{"t": "h", "r": "Q1", "q": "Explain why some early brain research raises ethical concerns.", "a": "Much early knowledge came from accidents, surgery on patients and animal experiments (e.g. lobotomies, H.M.'s surgery). Concerns include lack of informed consent, serious and permanent harm, use of vulnerable patients, loss of privacy and animal suffering. Modern research requires ethics approval, informed consent and minimising harm."}, {"t": "c", "r": "Q2", "q": "What did the case of Phineas Gage suggest about the frontal lobe?", "a": "After an iron rod damaged his left frontal lobe, his personality, planning and impulse control changed, suggesting the frontal lobe is involved in these functions."}]}, {"id": "B6", "wk": "Topic 1: Role of the brain", "title": "B6 The nervous system (Lesson 6)", "th": "<p><b>Basic flow:</b> sensory input → processing → response. Receptors (eyes, ears, skin, nose, tongue) send information in; the nervous system sends signals out to <b>muscles</b> (movement) and <b>glands</b> (hormones). Example: touching a hot pan, where skin receptors detect heat, the CNS processes it, and signals tell muscles to pull away.</p>\n<div class=\"sc\"><b>Structure at a glance</b>\n<ul>\n<li><b>Central Nervous System (CNS):</b> brain + spinal cord</li>\n<li><b>Peripheral Nervous System (PNS):</b> all nerves outside the brain and spinal cord\n<ul><li><b>Somatic</b> (voluntary)</li><li><b>Autonomic</b> (automatic)\n<ul><li><b>Sympathetic</b> (\"go\")</li><li><b>Parasympathetic</b> (\"rest and digest\")</li></ul></li></ul></li>\n</ul></div>\n<figure><svg viewBox=\"0 0 745 322\" role=\"img\" aria-label=\"Divisions of the nervous system\"><rect class=\"n\" x=\"200\" y=\"8\" width=\"150\" height=\"42\" rx=\"7\"/><text class=\"b\" x=\"275.0\" y=\"26.0\" text-anchor=\"middle\">Nervous system</text><text class=\"s\" x=\"275.0\" y=\"40.0\" text-anchor=\"middle\">two main divisions</text><rect class=\"n\" x=\"55\" y=\"90\" width=\"150\" height=\"44\" rx=\"7\"/><text class=\"b\" x=\"130.0\" y=\"109.0\" text-anchor=\"middle\">CNS</text><text class=\"s\" x=\"130.0\" y=\"123.0\" text-anchor=\"middle\">brain + spinal cord</text><rect class=\"n\" x=\"335\" y=\"90\" width=\"190\" height=\"44\" rx=\"7\"/><text class=\"b\" x=\"430.0\" y=\"109.0\" text-anchor=\"middle\">PNS</text><text class=\"s\" x=\"430.0\" y=\"123.0\" text-anchor=\"middle\">all nerves outside the CNS</text><rect class=\"n\" x=\"5\" y=\"175\" width=\"125\" height=\"44\" rx=\"7\"/><text class=\"b\" x=\"67.5\" y=\"194.0\" text-anchor=\"middle\">Brain</text><text class=\"s\" x=\"67.5\" y=\"208.0\" text-anchor=\"middle\">thoughts, emotions</text><rect class=\"n\" x=\"140\" y=\"175\" width=\"125\" height=\"44\" rx=\"7\"/><text class=\"b\" x=\"202.5\" y=\"194.0\" text-anchor=\"middle\">Spinal cord</text><text class=\"s\" x=\"202.5\" y=\"208.0\" text-anchor=\"middle\">messages + reflexes</text><rect class=\"n\" x=\"280\" y=\"175\" width=\"170\" height=\"44\" rx=\"7\"/><text class=\"b\" x=\"365.0\" y=\"194.0\" text-anchor=\"middle\">Somatic</text><text class=\"s\" x=\"365.0\" y=\"208.0\" text-anchor=\"middle\">voluntary, skeletal muscle</text><rect class=\"n\" x=\"470\" y=\"175\" width=\"170\" height=\"44\" rx=\"7\"/><text class=\"b\" x=\"555.0\" y=\"194.0\" text-anchor=\"middle\">Autonomic</text><text class=\"s\" x=\"555.0\" y=\"208.0\" text-anchor=\"middle\">automatic, involuntary</text><rect class=\"n sy\" x=\"380\" y=\"262\" width=\"170\" height=\"48\" rx=\"7\"/><text class=\"b\" x=\"465.0\" y=\"283.0\" text-anchor=\"middle\">Sympathetic</text><text class=\"s\" x=\"465.0\" y=\"297.0\" text-anchor=\"middle\">speeds up: fight/flight</text><rect class=\"n pa\" x=\"565\" y=\"262\" width=\"170\" height=\"48\" rx=\"7\"/><text class=\"b\" x=\"650.0\" y=\"283.0\" text-anchor=\"middle\">Parasympathetic</text><text class=\"s\" x=\"650.0\" y=\"297.0\" text-anchor=\"middle\">calms: rest + digest</text><path class=\"ln\" d=\"M275 50 L275 70 L130 70 L130 90\"/><path class=\"ln\" d=\"M275 50 L275 70 L430 70 L430 90\"/><path class=\"ln\" d=\"M130 134 L130 152 L67 152 L67 175\"/><path class=\"ln\" d=\"M130 134 L130 152 L202 152 L202 175\"/><path class=\"ln\" d=\"M430 134 L430 152 L365 152 L365 175\"/><path class=\"ln\" d=\"M430 134 L430 152 L555 152 L555 175\"/><path class=\"ln\" d=\"M555 219 L555 240 L465 240 L465 262\"/><path class=\"ln\" d=\"M555 219 L555 240 L650 240 L650 262\"/></svg><figcaption>The nervous system splits into the CNS and PNS. The PNS has somatic and autonomic parts, and the autonomic system has two opposing branches.</figcaption></figure>\n<h3>CNS: the control centre</h3>\n<ul>\n<li><b>Brain:</b> processes sensory information; controls thoughts, emotions and behaviour; regulates survival functions (breathing, heart rate, body temperature). The <b>brainstem</b> connects brain to spinal cord.</li>\n<li><b>Spinal cord:</b> thick bundle of nerve fibres that (1) carries sensory information up to the brain, (2) carries motor commands down to the body, and (3) controls <b>reflexes</b>.</li>\n<li><b>Reflexes:</b> fast protective responses controlled by the spinal cord without the brain (hand from hot stove, knee-jerk, stepping back from something sharp).</li>\n<li>Example: you step on a Lego. Sensory info travels up the spinal cord, the brain interprets pain, motor signals travel back down, you move your foot.</li>\n</ul>\n<figure><svg viewBox=\"0 0 680 228\" role=\"img\" aria-label=\"Touching a hot stove: reflex pathway\"><defs><marker id=\"m4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" style=\"fill:var(--a)\"/></marker></defs><rect class=\"n\" x=\"10\" y=\"120\" width=\"118\" height=\"66\" rx=\"7\"/><text class=\"b\" x=\"69.0\" y=\"143.0\" text-anchor=\"middle\">Hand</text><text class=\"s\" x=\"69.0\" y=\"157.0\" text-anchor=\"middle\">skin receptors</text><text class=\"s\" x=\"69.0\" y=\"171.0\" text-anchor=\"middle\">detect heat/pain</text><rect class=\"n\" x=\"150\" y=\"120\" width=\"118\" height=\"66\" rx=\"7\"/><text class=\"b\" x=\"209.0\" y=\"143.0\" text-anchor=\"middle\">PNS</text><text class=\"s\" x=\"209.0\" y=\"157.0\" text-anchor=\"middle\">sensory neurons</text><text class=\"s\" x=\"209.0\" y=\"171.0\" text-anchor=\"middle\">carry the signal</text><rect class=\"n hi\" x=\"290\" y=\"120\" width=\"118\" height=\"66\" rx=\"7\"/><text class=\"b\" x=\"349.0\" y=\"143.0\" text-anchor=\"middle\">Spinal cord</text><text class=\"s\" x=\"349.0\" y=\"157.0\" text-anchor=\"middle\">triggers the</text><text class=\"s\" x=\"349.0\" y=\"171.0\" text-anchor=\"middle\">reflex</text><rect class=\"n\" x=\"430\" y=\"120\" width=\"118\" height=\"66\" rx=\"7\"/><text class=\"b\" x=\"489.0\" y=\"143.0\" text-anchor=\"middle\">PNS</text><text class=\"s\" x=\"489.0\" y=\"157.0\" text-anchor=\"middle\">motor neurons</text><text class=\"s\" x=\"489.0\" y=\"171.0\" text-anchor=\"middle\">send the command</text><rect class=\"n\" x=\"570\" y=\"120\" width=\"100\" height=\"66\" rx=\"7\"/><text class=\"b\" x=\"620.0\" y=\"143.0\" text-anchor=\"middle\">Muscles</text><text class=\"s\" x=\"620.0\" y=\"157.0\" text-anchor=\"middle\">pull hand</text><text class=\"s\" x=\"620.0\" y=\"171.0\" text-anchor=\"middle\">away</text><rect class=\"n\" x=\"270\" y=\"18\" width=\"158\" height=\"56\" rx=\"7\"/><text class=\"b\" x=\"349.0\" y=\"36.0\" text-anchor=\"middle\">Brain</text><text class=\"s\" x=\"349.0\" y=\"50.0\" text-anchor=\"middle\">processes the signal,</text><text class=\"s\" x=\"349.0\" y=\"64.0\" text-anchor=\"middle\">recognises it as pain</text><path class=\"ar\" d=\"M128 153 L150 153\" marker-end=\"url(#m4)\"/><path class=\"ar\" d=\"M268 153 L290 153\" marker-end=\"url(#m4)\"/><path class=\"ar\" d=\"M408 153 L430 153\" marker-end=\"url(#m4)\"/><path class=\"ar\" d=\"M548 153 L570 153\" marker-end=\"url(#m4)\"/><path class=\"ar\" d=\"M349 120 L349 74\" marker-end=\"url(#m4)\"/><text class=\"xs\" x=\"358\" y=\"100\" text-anchor=\"start\">also up to the brain</text><text class=\"s\" x=\"340\" y=\"214\" text-anchor=\"middle\">Reflexes are controlled by the spinal cord, so the response is very quick.</text></svg><figcaption>Sensory information travels in through the PNS, the spinal cord triggers the withdrawal reflex, and the brain interprets the sensation as pain.</figcaption></figure>\n<h3>PNS: connects the body to the CNS</h3>\n<p>Two jobs: send <b>sensory</b> information from the body (outside world and inside the body) to the CNS, and send <b>motor</b> information from the CNS to organs, glands and muscles.</p>\n<div class=\"tw\"><table>\n<tr><th></th><th>Somatic nervous system</th><th>Autonomic nervous system (ANS)</th></tr>\n<tr><td><b>Control</b></td><td>Voluntary</td><td>Involuntary/automatic, no conscious effort</td></tr>\n<tr><td><b>Works with</b></td><td>Skeletal (striped) muscles</td><td>Smooth (visceral) muscles, cardiac muscle, glands</td></tr>\n<tr><td><b>Neurons</b></td><td>Sensory neurons: body → CNS. Motor neurons: CNS → muscles</td><td>Communicates between CNS and internal organs</td></tr>\n<tr><td><b>Regulates</b></td><td>Movement you choose</td><td>Heart rate, breathing, digestion, blood vessels, glands, liver, pupil size, adrenal glands</td></tr>\n<tr><td><b>Examples</b></td><td>Taking notes, kicking a ball, raising your hand</td><td>Breathing while asleep, heartbeat, digestion; heart jumping at a loud dog bark</td></tr>\n</table></div>\n<h3>Two branches of the ANS (opposite effects, work together)</h3>\n<div class=\"tw\"><table>\n<tr><th></th><th>Sympathetic</th><th>Parasympathetic</th></tr>\n<tr><td><b>Role</b></td><td>Emergency response; speeds the body up</td><td>Calm and restore; returns body to normal (homeostasis)</td></tr>\n<tr><td><b>Active when</b></td><td>Stressed, perceiving danger or threat</td><td>Relaxed, no immediate danger</td></tr>\n<tr><td><b>Effects</b></td><td>Heart rate ↑, breathing ↑, pupils dilate, digestion stops, blood redirected to muscles, more oxygen</td><td>Heart rate ↓, breathing normalises, digestion resumes</td></tr>\n<tr><td><b>Response</b></td><td>Fight (confront) and Flight (escape)</td><td>Freeze is largely parasympathetic-dominated</td></tr>\n</table></div>", "qs": [{"t": "c", "r": "Q1", "q": "Name the two parts of the CNS and the role of each.", "a": "Brain: processes information; controls thoughts, emotions, behaviour. Spinal cord: carries messages between brain and body and controls some reflexes."}, {"t": "c", "r": "Q2", "q": "Describe the PNS and how it helps the body communicate with the CNS.", "a": "All nerves outside the brain and spinal cord, made of the somatic and autonomic systems. It carries sensory information to the CNS and motor commands from the CNS to the body."}, {"t": "h", "r": "Q3", "q": "Two functions of the spinal cord with examples.", "a": "Carries sensory information to the brain (pain from touching something hot). Carries motor commands from the brain to muscles (moving your hand to pick up a pencil). It also controls reflexes such as the withdrawal reflex."}, {"t": "c", "r": "Q4", "q": "Role of the somatic nervous system (everyday example).", "a": "Controls voluntary movement and carries sensory information to the CNS. Raising your hand in class: signals go from the brain to the arm muscles."}, {"t": "h", "r": "Q5", "q": "Student touches a hot stove and pulls away: roles of spinal cord, brain and PNS.", "a": "The PNS carries pain information from the hand to the spinal cord. The spinal cord triggers a reflex that pulls the hand away. The brain then processes the information and recognises the sensation as pain."}, {"t": "h", "r": "Q6", "q": "Compare the sympathetic and parasympathetic nervous systems.", "a": "Sympathetic: active under stress or danger; speeds up heart rate and breathing, stops digestion (fight or flight). Parasympathetic: active when relaxed; slows heart rate, restores normal breathing and digestion (rest and digest)."}]}, {"id": "I1", "wk": "Topic 2: Intelligence", "title": "I1 What is intelligence? The psychometric approach and IQ", "th": "<div class=\"box\"><b>Success criterion:</b> I can describe what IQ is and explain how intelligence is measured and compared.</div><ul>\n<li><b>Intelligence</b> is generally described as the ability to learn from experience, reason, solve problems and adapt to the environment. Psychologists do not all agree on one definition.</li>\n<li>The <b>psychometric approach</b> treats intelligence as a quantity that can be <b>measured by standardised tests</b> and <b>compared between people</b>. It assumes intelligence is a trait that varies in degree and is relatively stable.</li>\n<li><b>Spearman (1904)</b> noticed that people who do well on one mental test tend to do well on others, and proposed a <b>general intelligence factor (g)</b> plus specific abilities (s). Later models separate <b>fluid intelligence</b> (reasoning with new problems) from <b>crystallised intelligence</b> (knowledge and skills learned over time).</li>\n</ul>\n<h3>History of IQ</h3>\n<ul>\n<li><b>Binet and Simon (1905):</b> developed the first practical test in France to identify children needing extra help at school. Results gave a <b>mental age</b> (the age level a child performs at).</li>\n<li><b>Stern (1912)</b> introduced the <b>intelligence quotient</b>: IQ = (mental age ÷ chronological age) × 100. A 10-year-old performing like a 12-year-old: (12 ÷ 10) × 100 = 120.</li>\n<li><b>Terman (1916)</b> adapted the test at Stanford University (the Stanford-Binet).</li>\n<li><b>Wechsler (1939)</b> introduced <b>deviation IQ</b>: a score shows how far a person is from the average of their own age group. Modern tests use this method.</li>\n</ul>\n<div class=\"box\"><b>How IQ is scored today:</b> scores are compared to a <b>standardisation sample</b> (norms) of people the same age. The average is set at <b>100</b> with a <b>standard deviation of 15</b>, producing a normal (bell) curve. Tests are re-normed every so often because average raw scores rise over time (the <b>Flynn effect</b>, about 3 IQ points per decade through much of the 20th century).</div>\n<figure><svg viewBox=\"0 0 700 258\" role=\"img\" aria-label=\"IQ normal distribution\"><path d=\

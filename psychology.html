 L524.0 186.3 L533.7 191.2 L543.3 195.4 L553.0 199.0 L562.7 202.1 L572.3 204.7 L582.0 206.9 L591.7 208.6 L601.3 210.1 L611.0 211.2 L620.7 212.1 L630.3 212.8 L640.0 213.4\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"2\"/><line x1=\"60\" y1=\"215\" x2=\"640\" y2=\"215\" class=\"ln\"/><text class=\"s\" x=\"60.0\" y=\"232\" text-anchor=\"middle\">55</text><line x1=\"60.0\" y1=\"215\" x2=\"60.0\" y2=\"220\" class=\"ln\"/><text class=\"s\" x=\"156.66666666666669\" y=\"232\" text-anchor=\"middle\">70</text><line x1=\"156.66666666666669\" y1=\"215\" x2=\"156.66666666666669\" y2=\"220\" class=\"ln\"/><text class=\"s\" x=\"253.33333333333334\" y=\"232\" text-anchor=\"middle\">85</text><line x1=\"253.33333333333334\" y1=\"215\" x2=\"253.33333333333334\" y2=\"220\" class=\"ln\"/><text class=\"s\" x=\"350.0\" y=\"232\" text-anchor=\"middle\">100</text><line x1=\"350.0\" y1=\"215\" x2=\"350.0\" y2=\"220\" class=\"ln\"/><text class=\"s\" x=\"446.6666666666667\" y=\"232\" text-anchor=\"middle\">115</text><line x1=\"446.6666666666667\" y1=\"215\" x2=\"446.6666666666667\" y2=\"220\" class=\"ln\"/><text class=\"s\" x=\"543.3333333333334\" y=\"232\" text-anchor=\"middle\">130</text><line x1=\"543.3333333333334\" y1=\"215\" x2=\"543.3333333333334\" y2=\"220\" class=\"ln\"/><text class=\"s\" x=\"640.0\" y=\"232\" text-anchor=\"middle\">145</text><line x1=\"640.0\" y1=\"215\" x2=\"640.0\" y2=\"220\" class=\"ln\"/><text class=\"xs\" x=\"108.33333333333334\" y=\"250\" text-anchor=\"middle\">2.1%</text><text class=\"xs\" x=\"205.0\" y=\"250\" text-anchor=\"middle\">13.6%</text><text class=\"xs\" x=\"301.6666666666667\" y=\"250\" text-anchor=\"middle\">34.1%</text><text class=\"xs\" x=\"398.33333333333337\" y=\"250\" text-anchor=\"middle\">34.1%</text><text class=\"xs\" x=\"495.0\" y=\"250\" text-anchor=\"middle\">13.6%</text><text class=\"xs\" x=\"591.6666666666666\" y=\"250\" text-anchor=\"middle\">2.1%</text><line x1=\"156.66666666666669\" y1=\"20\" x2=\"543.3333333333334\" y2=\"20\" class=\"ln\"/><text class=\"s\" x=\"350.0\" y=\"14\" text-anchor=\"middle\">about 95% of people score 70–130</text><line x1=\"253.33333333333334\" y1=\"46\" x2=\"446.6666666666667\" y2=\"46\" class=\"ln\"/><text class=\"s\" x=\"350.0\" y=\"40\" text-anchor=\"middle\">about 68% score 85–115</text><text class=\"s\" x=\"350.0\" y=\"205\" text-anchor=\"middle\">mean = 100</text></svg><figcaption>IQ scores follow a normal (bell) curve with mean 100 and standard deviation 15. The percentages under the axis show the share of people in each band.</figcaption></figure>\n\n<div class=\"tw\"><table>\n<tr><th>IQ range</th><th>Wechsler classification</th></tr>\n<tr><td>130 and above</td><td>Very superior</td></tr><tr><td>120–129</td><td>Superior</td></tr><tr><td>110–119</td><td>High average</td></tr><tr><td>90–109</td><td>Average</td></tr><tr><td>80–89</td><td>Low average</td></tr><tr><td>70–79</td><td>Borderline</td></tr><tr><td>69 and below</td><td>Extremely low (a diagnosis of intellectual disability also requires difficulty with everyday adaptive skills)</td></tr>\n</table></div>\n<p><b>Standardisation</b> means the test is given and scored the same way for everyone, so scores can be compared fairly.</p>", "qs": [{"t": "c", "r": "Q1", "q": "What is IQ and how is it measured and compared?", "a": "IQ (intelligence quotient) is a score from a standardised test that compares a person's performance to others of the same age. It is set so the average is 100 with a standard deviation of 15, which allows intelligence to be measured and compared."}, {"t": "h", "r": "Q2", "q": "A child has a mental age of 12 and a chronological age of 10. Calculate the ratio IQ.", "a": "IQ = (mental age ÷ chronological age) × 100 = (12 ÷ 10) × 100 = 120."}, {"t": "c", "r": "Q3", "q": "About what percentage of people score between 85 and 115 on an IQ test, and why?", "a": "About 68%. IQ scores follow a normal curve with mean 100 and standard deviation 15, so 85 to 115 is within one standard deviation of the mean."}]}, {"id": "I2", "wk": "Topic 2: Intelligence", "title": "I2 How intelligence is measured: Stanford-Binet, WAIS-IV and WISC-V", "th": "<div class=\"box\"><b>Success criterion:</b> I can describe how the Stanford-Binet, WAIS-IV and WISC-V assess intelligence.</div><div class=\"tw\"><table>\n<tr><th></th><th>Stanford-Binet (5th ed., SB5)</th><th>WAIS-IV</th><th>WISC-V</th></tr>\n<tr><td><b>Full name</b></td><td>Stanford-Binet Intelligence Scales</td><td>Wechsler Adult Intelligence Scale, 4th ed.</td><td>Wechsler Intelligence Scale for Children, 5th ed.</td></tr>\n<tr><td><b>Origin</b></td><td>Binet-Simon (1905) → Terman at Stanford (1916); current edition 2003</td><td>Wechsler (1939 original); WAIS-IV published 2008</td><td>Wechsler; WISC-V published 2014</td></tr>\n<tr><td><b>Ages</b></td><td>About 2 to 85+ years</td><td>16 to 90 years</td><td>6 to 16 years</td></tr>\n<tr><td><b>What it measures</b></td><td>Five factors: fluid reasoning, knowledge, quantitative reasoning, visual-spatial processing, working memory. Each is tested with verbal and nonverbal tasks</td><td>Four index scores: Verbal Comprehension, Perceptual Reasoning, Working Memory, Processing Speed</td><td>Five primary index scores: Verbal Comprehension, Visual Spatial, Fluid Reasoning, Working Memory, Processing Speed</td></tr>\n<tr><td><b>Subtests</b></td><td>10 subtests (5 verbal, 5 nonverbal)</td><td>10 core subtests (15 in total)</td><td>16 subtests; 10 primary subtests; 7 of them give the Full Scale IQ</td></tr>\n<tr><td><b>Scores</b></td><td>Full Scale IQ plus Verbal and Nonverbal IQ</td><td>Full Scale IQ plus four index scores</td><td>Full Scale IQ plus five index scores</td></tr>\n</table></div>\n<p><b>Features common to all three:</b> individually administered by a trained psychologist; standardised instructions and scoring; scores compared with age-group norms (mean 100, SD 15); a mix of verbal and non-verbal tasks.</p>\n<div class=\"tw\"><table>\n<tr><th>Index</th><th>Example tasks</th></tr>\n<tr><td><b>Verbal comprehension</b></td><td>Similarities (how are a cat and a mouse alike?); Vocabulary (define words); Information (general knowledge)</td></tr>\n<tr><td><b>Perceptual reasoning / visual-spatial / fluid reasoning</b></td><td>Block Design (build a pattern with blocks); Matrix Reasoning (choose the missing piece in a pattern); Visual Puzzles; Figure Weights</td></tr>\n<tr><td><b>Working memory</b></td><td>Digit Span (repeat numbers forwards or backwards); Arithmetic (mental maths); Picture Span</td></tr>\n<tr><td><b>Processing speed</b></td><td>Coding (match symbols to numbers quickly); Symbol Search</td></tr>\n</table></div>", "qs": [{"t": "h", "r": "Q1", "q": "Compare the Stanford-Binet, WAIS-IV and WISC-V.", "a": "All are individually administered, standardised IQ tests with a mean of 100 and SD 15. The Stanford-Binet (from Binet and Simon, 1905) covers ages about 2 to 85+ and measures five factors. The WAIS-IV is for ages 16 to 90 and gives four index scores. The WISC-V is for ages 6 to 16 and gives five index scores."}, {"t": "h", "r": "Q2", "q": "Which Wechsler test suits a 12-year-old and what index scores does it give?", "a": "The WISC-V (ages 6 to 16). Its five primary index scores are Verbal Comprehension, Visual Spatial, Fluid Reasoning, Working Memory and Processing Speed, plus a Full Scale IQ."}]}, {"id": "I3", "wk": "Topic 2: Intelligence", "title": "I3 Validity and reliability of intelligence tests", "th": "<div class=\"box\"><b>Success criterion:</b> I can explain validity and reliability and apply them to IQ tests.</div><div class=\"g2\">\n<div class=\"sc\"><h3>Reliability = consistency</h3><p>Would the test give the same result each time?</p><ul>\n<li><b>Test-retest:</b> same person, same test, later date</li>\n<li><b>Split-half / internal consistency:</b> two halves of the test give similar scores</li>\n<li><b>Inter-rater:</b> different examiners score the same answers the same way</li></ul>\n<p>Modern IQ tests are <b>highly reliable</b> (reliability coefficients of Full Scale IQ are typically around .90 or higher). Scores are also fairly stable across life: in a Scottish study, IQ at age 11 correlated roughly .6 to .7 with IQ in old age.</p></div>\n<div class=\"sc\"><h3>Validity = measures what it claims to</h3><p>Does the test really measure intelligence?</p><ul>\n<li><b>Content:</b> covers a wide range of mental abilities</li>\n<li><b>Construct:</b> fits the theory of intelligence (e.g. g); correlates with other IQ tests</li>\n<li><b>Predictive/criterion:</b> predicts outcomes such as school results (correlation around .5) and, more moderately, job performance</li></ul>\n<p>IQ tests are reasonably valid for predicting <b>academic achievement</b>, but a correlation of about .5 means IQ explains only around a quarter of the differences in results.</p></div>\n</div>\n<div class=\"box\">A test can be reliable without being valid (a faulty scale that always shows the same wrong weight is consistent but inaccurate). A test cannot be valid unless it is reliable.</div>\n<h3>Limits to validity and reliability</h3>\n<ul>\n<li><b>Cultural bias:</b> items depend on language, schooling and cultural knowledge, so people from different backgrounds (including Aboriginal and Torres Strait Islander children, or people who speak English as an additional language) may score lower for reasons unrelated to ability. \"Culture-fair\" tests such as Raven's Progressive Matrices reduce, but do not remove, this.</li>\n<li><b>Testing conditions:</b> anxiety, motivation, tiredness, illness and the examiner can change a score. Scores have a margin of error of several points.</li>\n<li><b>Stereotype threat</b> (Steele and Aronson, 1995): fear of confirming a negative stereotype lowers performance.</li>\n<li><b>Narrow definition:</b> tests miss creativity, practical skills and emotional skills (Gardner's multiple intelligences; Sternberg's triarchic theory).</li>\n<li><b>Flynn effect:</b> rising scores mean old norms become inaccurate, so tests must be re-normed.</li>\n<li><b>Misuse:</b> early IQ tests were used to label people and support discrimination (e.g. U.S. immigration restrictions in the 1920s). A single score can unfairly label a child.</li>\n</ul>", "qs": [{"t": "h", "r": "Q1", "q": "Explain validity and reliability and apply them to IQ tests.", "a": "Reliability is consistency (similar results on retest); IQ tests are highly reliable. Validity is whether a test measures what it claims; IQ tests predict school achievement reasonably well, but cultural bias, test anxiety and a narrow definition of intelligence limit their validity."}, {"t": "h", "r": "Q2", "q": "Give one way to check the reliability and one way to check the validity of an IQ test.", "a": "Reliability: test-retest (same person gets a similar score on a later occasion). Validity: predictive validity, such as checking how well scores predict school achievement."}]}, {"id": "I4", "wk": "Topic 2: Intelligence", "title": "I4 Is intelligence inherited? Twin, family and adoption studies", "th": "<div class=\"box\"><b>Success criterion:</b> I can summarise twin, family and adoption evidence (e.g. the Minnesota Twin Study) on the heritability of intelligence.</div><p><b>Heritability</b> is the proportion of the <i>differences</i> in a trait within a population that is associated with genetic differences. Heritability of .50 does <b>not</b> mean 50% of one person's intelligence is genetic. It also does not mean a trait cannot change, and it varies between groups and environments.</p>\n<div class=\"tw\"><table>\n<tr><th>Method</th><th>How it works</th><th>Key logic and limits</th></tr>\n<tr><td><b>Twin studies</b></td><td>Compare <b>identical (MZ)</b> twins (about 100% of genes shared) with <b>fraternal (DZ)</b> twins (about 50%, like other siblings)</td><td>If genes matter, MZ twins should be more alike than DZ twins. Limit: MZ twins are often treated more alike (equal-environments assumption)</td></tr>\n<tr><td><b>Family studies</b></td><td>Compare IQ of relatives with different degrees of genetic relatedness (parent-child, siblings, cousins)</td><td>IQ similarity rises with relatedness. Limit: relatives usually share an environment too</td></tr>\n<tr><td><b>Adoption studies</b></td><td>Compare adopted children with their biological relatives (shared genes, different home) and adoptive relatives (shared home, no shared genes)</td><td>Separates genes from environment. Limit: adoptive homes are often similar and selected, and are not a full range of environments</td></tr>\n</table></div>\n<figure><svg viewBox=\"0 0 700 272\" role=\"img\" aria-label=\"IQ correlations by relationship\"><text class=\"s\" x=\"255\" y=\"28\" text-anchor=\"end\">Identical twins, reared together</text><rect x=\"265\" y=\"14\" width=\"344\" height=\"20\" rx=\"3\" fill=\"#0f6b73\" fill-opacity=\".75\"/><text class=\"b\" x=\"615.0\" y=\"28\" text-anchor=\"start\">.86</text><text class=\"s\" x=\"255\" y=\"58\" text-anchor=\"end\">Identical twins, reared apart</text><rect x=\"265\" y=\"44\" width=\"288\" height=\"20\" rx=\"3\" fill=\"#0f6b73\" fill-opacity=\".75\"/><text class=\"b\" x=\"559.0\" y=\"58\" text-anchor=\"start\">.72</text><text class=\"s\" x=\"255\" y=\"88\" text-anchor=\"end\">Fraternal twins, reared together</text><rect x=\"265\" y=\"74\" width=\"240\" height=\"20\" rx=\"3\" fill=\"#3b82c4\" fill-opacity=\".75\"/><text class=\"b\" x=\"511.0\" y=\"88\" text-anchor=\"start\">.60</text><text class=\"s\" x=\"255\" y=\"118\" text-anchor=\"end\">Siblings, reared together</text><rect x=\"265\" y=\"104\" width=\"188\" height=\"20\" rx=\"3\" fill=\"#3b82c4\" fill-opacity=\".75\"/><text class=\"b\" x=\"459.0\" y=\"118\" text-anchor=\"start\">.47</text><text class=\"s\" x=\"255\" y=\"148\" text-anchor=\"end\">Parent and child</text><rect x=\"265\" y=\"134\" width=\"168\" height=\"20\" rx=\"3\" fill=\"#3b82c4\" fill-opacity=\".75\"/><text class=\"b\" x=\"439.0\" y=\"148\" text-anchor=\"start\">.42</text><text class=\"s\" x=\"255\" y=\"178\" text-anchor=\"end\">Siblings, reared apart</text><rect x=\"265\" y=\"164\" width=\"96\" height=\"20\" rx=\"3\" fill=\"#3b82c4\" fill-opacity=\".75\"/><text class=\"b\" x=\"367.0\" y=\"178\" text-anchor=\"start\">.24</text><text class=\"s\" x=\"255\" y=\"208\" text-anchor=\"end\">Adoptive parent and adopted child</text><rect x=\"265\" y=\"194\" width=\"76\" height=\"20\" rx=\"3\" fill=\"#d98a1f\" fill-opacity=\".75\"/><text class=\"b\" x=\"347.0\" y=\"208\" text-anchor=\"start\">.19</text><text class=\"s\" x=\"255\" y=\"238\" text-anchor=\"end\">Cousins</text><rect x=\"265\" y=\"224\" width=\"60\" height=\"20\" rx=\"3\" fill=\"#8e5bb5\" fill-opacity=\".75\"/><text class=\"b\" x=\"331.0\" y=\"238\" text-anchor=\"start\">.15</text><line x1=\"265\" y1=\"8\" x2=\"265\" y2=\"252\" class=\"ln\"/><text class=\"xs\" x=\"665\" y=\"262\" text-anchor=\"end\">Teal = 100% shared genes · Blue = about 50% · Purple = about 12.5% · Orange = no shared genes</text></svg><figcaption>Approximate average IQ correlations (r) from Bouchard and McGue's 1981 review of familial studies; exact values differ slightly between sources. The closer the genetic relationship, the more similar the IQ scores.</figcaption></figure>\n\n<h3>Key studies</h3>\n<div class=\"sc\"><b>Minnesota Study of Twins Reared Apart (Bouchard, Lykken, McGue, Segal and Tellegen, 1990)</b>\n<ul>\n<li><b>Aim:</b> to find how much of the similarity in intelligence and personality is due to genes and how much to environment.</li>\n<li><b>Method:</b> ongoing since 1979 at the University of Minnesota; more than 100 sets of reared-apart twins or triplets. The 1990 IQ report focused on <b>56 pairs of identical twins reared apart (MZA)</b>, recruited through publicity and word of mouth and tested for around 50 hours with intelligence tests (including the Wechsler scale), personality and other measures. They were compared with identical and fraternal twins reared together.</li>\n<li><b>Results:</b> the IQ correlation for identical twins reared apart was about <b>.70</b>, suggesting about <b>70% of the variation in IQ</b> was associated with genetic differences. The twins also showed striking similarities in personality, interests and attitudes.</li>\n<li><b>Conclusion:</b> genes have a strong influence on intelligence.</li>\n<li><b>Evaluation:</b> a strength is that it studied the rare case of twins separated early, using standardised, extensive testing. <b>Criticisms:</b> small, self-selected sample; many twins had some contact before testing and were not fully separated from birth; adoptive homes were often similar (selective placement); the control group of fraternal twins reared apart was small; correlation in adulthood may not match childhood.</li>\n</ul></div>\n<div class=\"sc\"><b>Bouchard and McGue (1981)</b> reviewed 111 studies of familial IQ correlations. Averages: identical twins together about .86, fraternal twins about .60, siblings about .47, identical twins apart about .72, siblings apart about .24. Overall, <b>the more genes people share, the more similar their IQ</b>.</div>\n<div class=\"sc\"><b>Adoption studies:</b>\n<ul>\n<li>Adopted children's IQ tends to resemble their <b>biological</b> parents more as they grow older, and adopted siblings raised together become less alike by adolescence (e.g. the Colorado Adoption Project).</li>\n<li><b>Capron and Duyme (1989, France):</b> children adopted into high-socioeconomic-status homes scored about 12 IQ points higher than similar children adopted into low-status homes, and children born to high-status parents scored higher than children born to low-status parents in the same type of home. <b>Both genes and environment mattered.</b></li>\n<li>Children severely deprived in Romanian orphanages scored lower on average and improved after adoption into good homes, with the best recovery for those adopted earliest (Rutter's studies).</li>\n</ul></div>\n<p><b>Overall estimate:</b> twin studies suggest heritability of IQ around .50 to .70 in adults. It tends to be lower in childhood (roughly 20% in infancy) and increases with age (60–80% in adulthood), as people choose and shape environments that match their genes.</p>", "qs": [{"t": "h", "r": "Q1", "q": "Summarise the Minnesota Study of Twins Reared Apart.", "a": "Bouchard et al. (1990) studied identical twins separated early and reared apart (56 pairs in the IQ report). Their IQ correlation was about .70, suggesting about 70% of the variation in IQ was linked to genes. Criticisms include a small, self-selected sample, contact between twins before testing and similar adoptive homes."}, {"t": "x", "r": "Q2", "q": "What does a heritability of .70 for IQ mean, and what does it NOT mean?", "a": "It means about 70% of the differences in IQ within the group studied are associated with genetic differences. It does not mean 70% of any one person's intelligence is genetic, and it does not mean IQ cannot change."}]}, {"id": "I5", "wk": "Topic 2: Intelligence", "title": "I5 Nature versus nurture: genes and environment", "th": "<div class=\"box\"><b>Success criterion:</b> I can explain how intelligence is influenced by both genetics and environment (nature and nurture).</div><div class=\"g2\">\n<div class=\"sc\"><h3>Evidence for nature (genes)</h3><ul><li>MZ twins are more alike than DZ twins, even when reared apart</li><li>IQ similarity rises with genetic relatedness</li><li>Adopted children's IQ comes to resemble their biological parents</li></ul></div>\n<div class=\"sc\"><h3>Evidence for nurture (environment)</h3><ul><li><b>Schooling:</b> each extra year of education is linked to a few IQ points</li><li><b>Nutrition and health:</b> prenatal and early malnutrition, lead exposure and alcohol exposure lower IQ</li><li><b>Enrichment and deprivation:</b> good early stimulation and quality early-childhood programs raise scores; neglect lowers them (Romanian orphans)</li><li><b>Flynn effect:</b> scores rose about 3 points per decade, far too fast for genes to explain</li><li>Even MZ twins reared apart are not identical in IQ (r about .7, not 1.0)</li></ul></div>\n</div>\n<div class=\"box\"><b>Interaction view (the current consensus):</b> intelligence results from genes and environment working together.\n<ul><li><b>Reaction range:</b> genes set a range of possible outcomes; the environment decides where in that range a person ends up.</li>\n<li><b>Gene-environment correlation:</b> people with certain genes seek out or create certain environments (a curious child chooses books, which builds skills).</li>\n<li><b>Gene expression:</b> the environment can switch genes on or off (epigenetics).</li>\n<li>Some studies find heritability of IQ is lower in deprived environments and higher in enriched ones.</li></ul></div>\n<p><b>Careful thinking:</b> heritability describes differences within a group in a given environment. It does not explain differences <i>between</i> groups. Example: seeds from the same bag planted in rich and poor soil can differ in height because of soil, even if height within each plot is mostly genetic. High heritability also does not mean an ability cannot be improved.</p>", "qs": [{"t": "h", "r": "Q1", "q": "Explain how genetics and environment both influence intelligence.", "a": "Twin, family and adoption studies show IQ similarity increases with genetic relatedness (genes). Schooling, nutrition, enrichment and the Flynn effect show the environment also matters. Genes and environment interact: genes set a range of possible outcomes and the environment affects where a person ends up."}, {"t": "h", "r": "Q2", "q": "Why does the Flynn effect support the influence of environment on intelligence?", "a": "Average IQ scores rose about 3 points per decade, which is too fast to be caused by genetic change, so changes in environment (nutrition, schooling, stimulation) are likely involved."}]}, {"id": "I6", "wk": "Topic 2: Intelligence", "title": "I6 IQ and EQ: accurate, misleading, or both?", "th": "<div class=\"box\"><b>Success criterion:</b> I can discuss whether IQ and EQ tests are accurate, misleading, or both.</div><p><b>Emotional intelligence (EQ)</b> is the ability to perceive, understand, use and manage emotions in yourself and others. The idea was developed by Salovey and Mayer (1990) and popularised by Goleman (1995), who described self-awareness, self-regulation, motivation, empathy and social skills. EQ is measured by <b>ability tests</b> (e.g. MSCEIT, which asks people to solve emotion-based problems) and <b>self-report questionnaires</b> (e.g. Bar-On EQ-i).</p>\n<div class=\"tw\"><table>\n<tr><th></th><th>IQ tests</th><th>EQ tests</th></tr>\n<tr><td><b>Measures</b></td><td>Reasoning, knowledge, memory and speed</td><td>Recognising, understanding and managing emotions</td></tr>\n<tr><td><b>Reliability</b></td><td>High; scores are stable and consistent</td><td>Lower and varies by test; self-report scores can change with mood</td></tr>\n<tr><td><b>Validity</b></td><td>Good predictor of school achievement; moderate for work success</td><td>Weaker evidence; moderate links to wellbeing, relationships and some job performance</td></tr>\n<tr><td><b>Strengths</b></td><td>Standardised, objective, well researched</td><td>Captures social and emotional skills IQ ignores</td></tr>\n<tr><td><b>Problems</b></td><td>Cultural bias, test anxiety and stereotype threat, narrow focus, risk of labelling, Flynn effect</td><td>No agreed definition; self-report is easy to fake or inflate (social desirability); overlaps with personality; \"correct\" emotional answers are subjective; claims that EQ matters more than IQ are not well supported</td></tr>\n</table></div>\n<div class=\"box\"><b>Verdict: both.</b> IQ tests are accurate and reliable for what they measure (mainly academic-type reasoning) but misleading if treated as a total measure of a person's worth or potential. EQ tests capture useful skills but have weaker reliability and validity and are more open to bias. Neither should be judged from a single score; they are most useful alongside other information.</div>", "qs": [{"t": "x", "r": "Q1", "q": "Are IQ and EQ tests accurate, misleading, or both?", "a": "Both. IQ tests are reliable and predict academic success but are narrow, can be culturally biased and are affected by anxiety and stereotype threat. EQ tests measure useful emotional skills but have weaker reliability and validity, rely on self-report that can be faked, and overlap with personality."}, {"t": "h", "r": "Q2", "q": "Give two reasons EQ tests may be less valid than IQ tests.", "a": "There is no agreed definition of emotional intelligence; self-report tests can be faked or inflated; scores overlap with personality; and 'correct' emotional answers are subjective."}]}, {"id": "E1", "wk": "Emotion and wellbeing (Lessons 7, 9 and 10)", "title": "E1 Theories of emotion (Lessons 7 and 9)", "th": "<h3>What is emotion?</h3>\n<ul>\n<li>Strong, short-lasting reactions to events, thoughts or memories, from external situations (a scary movie) or internal processes (remembering something embarrassing).</li>\n<li><b>Valence:</b> emotions are positive (joy, love) or negative (fear, anger).</li>\n</ul>\n<div class=\"tw\"><table>\n<tr><th>Three components</th><th>Meaning</th><th>Example (snake near your foot)</th></tr>\n<tr><td><b>Physiological</b></td><td>Body changes (heart rate, sweating, butterflies, alertness)</td><td>Heart rate increases</td></tr>\n<tr><td><b>Subjective feeling</b></td><td>What you feel inside; same situation can feel different to different people</td><td>\"I feel scared\"</td></tr>\n<tr><td><b>Behavioural/expressive</b></td><td>Observable actions or expressions (smiling, crying, hugging, avoiding)</td><td>Jump backwards</td></tr>\n</table></div>\n<h3>Schachter and Singer's Two-Factor Theory (1962)</h3>\n<div class=\"box\"><b>Emotion = physiological arousal + cognitive interpretation (label).</b> Arousal alone is not enough; we must work out <i>why</i> we feel aroused. Same racing heart: rollercoaster → excitement; public speaking → nervousness; horror movie → fear.</div>\n<ul>\n<li><b>Aim:</b> investigate whether emotion results from physiological arousal and cognitive interpretation of that arousal.</li>\n<li><b>Participants:</b> 184 male university students.</li>\n<li><b>Step 1, injection:</b> told it was a vitamin (\"Suproxin\"). Actually <b>epinephrine (adrenaline)</b>, which causes arousal (shaky hands, fast heart rate), or a <b>placebo</b>.</li>\n<li><b>Step 2, information:</b> <i>correctly informed</i> (real side effects), <i>misinformed</i> (wrong side effects), or <i>not informed</i>.</li>\n<li><b>Step 3, situation:</b> waited with a <b>confederate</b> (actor) who acted either euphoric/happy or angry.</li>\n<li><b>Step 4, measurement:</b> observed behaviour and a self-report questionnaire.</li>\n<li><b>Results:</b> uninformed/misinformed participants adopted the confederate's emotion. Informed participants did not copy it and blamed their feelings on the injection.</li>\n<li><b>Conclusion:</b> same body reaction can produce different emotions depending on the explanation. A racing heart does not automatically mean fear.</li>\n</ul>\n<p><b>Criticisms:</b> repeated studies found the confederate had only a small impact; the theory focuses on the autonomic nervous system and ignores emotional processes in the central nervous system.</p>\n<p><b>Evaluating results (from the Lesson 7 activity):</b> results support the theory if arousal was similar (e.g. heart rate), emotional ratings differed, and context appeared to influence emotion. They do not fully support it if everyone reported the same emotion, context made little difference, or arousal alone predicted emotion.</p>\n<p><b>Rationale formula:</b> Theory says… → Therefore… → In this experiment… → We predict…</p>\n<h3>Appraisal theory (Arnold and Lazarus)</h3>\n<div class=\"box\"><b>Appraisal = evaluating the situation <i>before</i> the emotion.</b> The evaluation triggers body reactions and the emotion itself. Emotion starts with interpretation, not just body reaction. (Magda Arnold introduced appraisal; Richard Lazarus expanded it.)</div>\n<div class=\"tw\"><table>\n<tr><th></th><th>Primary appraisal: \"Is this a problem for me?\"</th><th>Secondary appraisal: \"Can I cope with this?\"</th></tr>\n<tr><td><b>Judges</b></td><td>How important the situation is</td><td>Skills, resources, support, past experience, personality</td></tr>\n<tr><td><b>Categories</b></td><td><b>Harm/loss</b> (damage already done: \"I failed the test\"); <b>Threat</b> (possible future damage: \"I might fail the next one\"); <b>Positive</b> (opportunity or improvement: \"I can study harder and improve\"); <b>Neutral/irrelevant</b> (\"My neighbour failed, not me\")</td><td>Determines how stressed or calm we feel</td></tr>\n</table></div>\n<p>Primary and secondary appraisal happen almost at the same time. Emotion depends on both the situation and coping ability.</p>\n<p><b>Jamie's speech example:</b> heart races, sees speech as a threat (fear of negative judgment) → anxiety (primary). Then he considers his preparation, rehearsal and notes → anxiety stays but is less intense (secondary).</p>\n<figure><svg viewBox=\"0 0 680 232\" role=\"img\" aria-label=\"Comparing the two theories of emotion\"><defs><marker id=\"m5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" style=\"fill:var(--a)\"/></marker></defs><text class=\"b\" x=\"10\" y=\"28\" text-anchor=\"start\">Schachter and Singer: two-factor theory</text><rect class=\"n\" x=\"10\" y=\"40\" width=\"150\" height=\"56\" rx=\"7\"/><text class=\"b\" x=\"85.0\" y=\"58.0\" text-anchor=\"middle\">Event</text><text class=\"s\" x=\"85.0\" y=\"72.0\" text-anchor=\"middle\">e.g. racing heart</text><text class=\"s\" x=\"85.0\" y=\"86.0\" text-anchor=\"middle\">on a rollercoaster</text><rect class=\"n\" x=\"186\" y=\"40\" width=\"150\" height=\"56\" rx=\"7\"/><text class=\"b\" x=\"261.0\" y=\"58.0\" text-anchor=\"middle\">Physiological</text><text class=\"s\" x=\"261.0\" y=\"72.0\" text-anchor=\"middle\">arousal</text><text class=\"s\" x=\"261.0\" y=\"86.0\" text-anchor=\"middle\">(body reacts first)</text><rect class=\"n\" x=\"362\" y=\"40\" width=\"150\" height=\"56\" rx=\"7\"/><text class=\"b\" x=\"437.0\" y=\"58.0\" text-anchor=\"middle\">Cognitive</text><text class=\"s\" x=\"437.0\" y=\"72.0\" text-anchor=\"middle\">interpretation</text><text class=\"s\" x=\"437.0\" y=\"86.0\" text-anchor=\"middle\">(label the cause)</text><rect class=\"n hi\" x=\"538\" y=\"40\" width=\"132\" height=\"56\" rx=\"7\"/><text class=\"b\" x=\"604.0\" y=\"65.0\" text-anchor=\"middle\">Emotion</text><text class=\"s\" x=\"604.0\" y=\"79.0\" text-anchor=\"middle\">excitement</text><path class=\"ar\" d=\"M160 68 L186 68\" marker-end=\"url(#m5)\"/><path class=\"ar\" d=\"M336 68 L362 68\" marker-end=\"url(#m5)\"/><path class=\"ar\" d=\"M512 68 L538 68\" marker-end=\"url(#m5)\"/><text class=\"b\" x=\"10\" y=\"148\" text-anchor=\"start\">Lazarus: appraisal theory</text><rect class=\"n\" x=\"10\" y=\"160\" width=\"150\" height=\"56\" rx=\"7\"/><text class=\"b\" x=\"85.0\" y=\"178.0\" text-anchor=\"middle\">Event</text><text class=\"s\" x=\"85.0\" y=\"192.0\" text-anchor=\"middle\">e.g. a speech</text><text class=\"s\" x=\"85.0\" y=\"206.0\" text-anchor=\"middle\">in front of the class</text><rect class=\"n\" x=\"186\" y=\"160\" width=\"290\" height=\"56\" rx=\"7\"/><text class=\"b\" x=\"331.0\" y=\"178.0\" text-anchor=\"middle\">Appraisal (evaluate first)</text><text class=\"s\" x=\"331.0\" y=\"192.0\" text-anchor=\"middle\">Primary: is this important to me?</text><text class=\"s\" x=\"331.0\" y=\"206.0\" text-anchor=\"middle\">Secondary: can I cope with it?</text><rect class=\"n hi\" x=\"502\" y=\"160\" width=\"168\" height=\"56\" rx=\"7\"/><text class=\"b\" x=\"586.0\" y=\"185.0\" text-anchor=\"middle\">Arousal + emotion</text><text class=\"s\" x=\"586.0\" y=\"199.0\" text-anchor=\"middle\">e.g. anxiety</text><path class=\"ar\" d=\"M160 188 L186 188\" marker-end=\"url(#m5)\"/><path class=\"ar\" d=\"M476 188 L502 188\" marker-end=\"url(#m5)\"/></svg><figcaption>The key difference is the order. Two-factor: body arousal comes first, then we interpret it. Appraisal: we evaluate the situation first, and that triggers arousal and emotion.</figcaption></figure>\n<div class=\"tw\"><table>\n<tr><th>Two-factor theory (Schachter and Singer)</th><th>Appraisal theory (Lazarus)</th></tr>\n<tr><td>Body arousal comes first, then we interpret it to produce emotion</td><td>We evaluate the situation first, which triggers arousal and emotion</td></tr>\n<tr><td>Physiological reaction + cognitive label</td><td>Primary appraisal + secondary appraisal</td></tr>\n</table></div>", "qs": [{"t": "c", "r": "Q1", "q": "Identify the three components of emotion.", "a": "Physiological changes, subjective feelings, and behavioural/expressive responses."}, {"t": "h", "r": "Q2", "q": "Explain the two-factor theory with an example.", "a": "Emotion needs physiological arousal plus a cognitive interpretation of its cause. Walking alone in the dark with a racing heart and sweating, you label it fear; the same arousal at a concert you label excitement."}, {"t": "c", "r": "Q3", "q": "Explain the two components of appraisal theory.", "a": "Primary appraisal judges whether the situation is harmful, threatening, positive or irrelevant to you. Secondary appraisal judges whether you can cope, using your skills, resources and support."}, {"t": "h", "r": "Q4", "q": "Distinguish physiological reaction from cognitive assessment (Schachter and Singer).", "a": "The physiological reaction is the body's arousal (racing heart, sweating). The cognitive assessment is the mind's explanation of what caused it. The label given decides which emotion is felt."}, {"t": "h", "r": "Q5", "q": "Compare primary and secondary appraisal.", "a": "Primary: \"Is this important or a problem for me?\" (judges the situation). Secondary: \"Can I handle this?\" (judges coping resources). Both happen almost together and together determine the emotion and its intensity."}, {"t": "x", "r": "Q6", "q": "A student's heart races before an exam. Explain the emotion they feel using BOTH the two-factor theory and appraisal theory.", "a": "Two-factor: the racing heart (arousal) comes first, then the student interprets it as nervousness because of the exam. Appraisal: the student first judges the exam (primary appraisal: a threat?) and whether they can cope (secondary appraisal), and that evaluation triggers the arousal and the emotion."}]}, {"id": "E2", "wk": "Emotion and wellbeing (Lessons 7, 9 and 10)", "title": "E2 Coping and reappraisal", "th": "<p><b>Coping potential</b> (part of secondary appraisal) is the ability to use problem-focused or emotion-focused coping.</p>\n<div class=\"g2\">\n<div class=\"sc\"><h3>Problem-focused</h3><p>Deals with the <b>cause</b> practically to reduce stress.</p><ul>\n<li><b>Take control:</b> lost your job → update resume, search online</li>\n<li><b>Seek information:</b> diagnosed with an illness → get a second opinion</li>\n<li><b>Evaluate pros and cons:</b> list positives and negatives to clarify a decision</li></ul></div>\n<div class=\"sc\"><h3>Emotion-focused</h3><p>Reduces the negative <b>feelings</b> (embarrassment, fear, anxiety, frustration).</p><ul>\n<li>Meditation, relaxation</li><li>Talking to friends and family</li><li>Physical exercise</li>\n<li>Distraction (TV, reading, games)</li><li>Denial or ignoring the problem</li><li>Expecting the worst-case scenario</li></ul></div>\n</div>\n<div class=\"box\"><b>Reappraisal:</b> a continual process of re-evaluating the situation and coping potential as new information arrives, which can change the emotion. It is a regulation strategy and a key mechanism in adaptive emotion regulation. Jamie lists the positives (sharing a topic, practising skills), recalls past successes, and reframes nerves as enthusiasm, so anxiety becomes a composed, motivated state.</div>", "qs": [{"t": "h", "r": "Q1", "q": "Classify each as problem-focused or emotion-focused coping: (a) making a study timetable after a poor result (b) going for a run to calm down (c) asking a teacher for feedback (d) ignoring the result.", "a": "(a) Problem-focused (taking control). (b) Emotion-focused (reducing feelings). (c) Problem-focused (seeking information). (d) Emotion-focused (denial or avoidance)."}, {"t": "c", "r": "Q2", "q": "What is reappraisal?", "a": "A continual process of re-evaluating the situation and your ability to cope as new information arrives, which can change the emotion felt (for example, reframing nerves as enthusiasm)."}]}, {"id": "E3", "wk": "Emotion and wellbeing (Lessons 7, 9 and 10)", "title": "E3 Physiology of emotion: limbic system and LeDoux (Lesson 10)", "th": "<ul>\n<li>Emotions involve the autonomic nervous system (heart rate, breathing, blood pressure changes) and limbic system structures.</li>\n<li><b>Limbic system:</b> interconnected brain areas, one of the oldest parts of the brain. Involved in recognising, expressing and regulating emotion, plus motivation, memory and learning.</li>\n<li>Knowledge comes from brain injury (lesion) studies, behavioural experiments and brain imaging. Key researchers: <b>Papez, MacLean, LeDoux</b>.</li>\n</ul>\n<div class=\"tw\"><table>\n<tr><th>Structure</th><th>Basic job</th><th>Role in emotion</th></tr>\n<tr><td><b>Thalamus</b></td><td>Sensory relay station</td><td>Sends incoming sensory information (except smell) to the right brain areas</td></tr>\n<tr><td><b>Hypothalamus</b></td><td>Body regulation (\"body reaction\")</td><td>Controls fight-flight-freeze and body reactions (heart rate, sweating, temperature)</td></tr>\n<tr><td><b>Amygdala</b></td><td>Emotion alarm system</td><td>Detects danger and fear, triggers strong reactions, helps recognise emotions in others</td></tr>\n<tr><td><b>Hippocampus</b></td><td>Memory and context</td><td>Stores emotional memories; remembers where and when events happened</td></tr>\n<tr><td><b>Cingulate gyrus</b></td><td>Emotional awareness and attention</td><td>Lets you consciously feel emotions and focus on them (including physical or social pain)</td></tr>\n<tr><td><b>Basal ganglia</b></td><td>Reward, habits, decisions</td><td>Recognises emotions in others, processes rewards (dopamine), influences emotional decisions</td></tr>\n</table></div>\n<h3>LeDoux's biological model (two pathways, especially for fear)</h3>\n<div class=\"tw\"><table>\n<tr><th></th><th>Short route (unconscious)</th><th>Long route (conscious)</th></tr>\n<tr><td><b>Path</b></td><td>Thalamus → Amygdala → Hypothalamus → ANS (bypasses sensory cortex and hippocampus)</td><td>Thalamus → Cortex and Hippocampus → Amygdala → Hypothalamus</td></tr>\n<tr><td><b>Speed</b></td><td>Fast but can be inaccurate</td><td>Slower but accurate</td></tr>\n<tr><td><b>Response</b></td><td>\"Thoughtless\", automatic; prepares for fight-flight-freeze; useful for survival</td><td>\"Thoughtful\" appraisal; more appropriate response</td></tr>\n<tr><td><b>Example</b></td><td>Jump at a stick you think is a snake</td><td>Realise it is a stick, calm down</td></tr>\n</table></div>\n<figure><svg viewBox=\"0 90 720 185\" role=\"img\" aria-label=\"LeDoux's short and long pathways for emotion\"><defs><marker id=\"m6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" style=\"fill:var(--a)\"/></marker></defs><rect class=\"n\" x=\"8\" y=\"110\" width=\"84\" height=\"44\" rx=\"7\"/><text class=\"b\" x=\"50.0\" y=\"129.0\" text-anchor=\"middle\">Emotional</text><text class=\"s\" x=\"50.0\" y=\"143.0\" text-anchor=\"middle\">stimulus</text><rect class=\"n\" x=\"120\" y=\"110\" width=\"92\" height=\"44\" rx=\"7\"/><text class=\"b\" x=\"166.0\" y=\"129.0\" text-anchor=\"middle\">Thalamus</text><text class=\"s\" x=\"166.0\" y=\"143.0\" text-anchor=\"middle\">sensory relay</text><rect class=\"n hi\" x=\"395\" y=\"110\" width=\"100\" height=\"44\" rx=\"7\"/><text class=\"b\" x=\"445.0\" y=\"129.0\" text-anchor=\"middle\">Amygdala</text><text class=\"s\" x=\"445.0\" y=\"143.0\" text-anchor=\"middle\">alarm system</text><rect class=\"n\" x=\"520\" y=\"110\" width=\"120\" height=\"44\" rx=\"7\"/><text class=\"b\" x=\"580.0\" y=\"129.0\" text-anchor=\"middle\">Hypothalamus</text><text class=\"s\" x=\"580.0\" y=\"143.0\" text-anchor=\"middle\">body reaction</text><rect class=\"n\" x=\"650\" y=\"176\" width=\"62\" height=\"44\" rx=\"7\"/><text class=\"b\" x=\"681.0\" y=\"195.0\" text-anchor=\"middle\">ANS</text><text class=\"s\" x=\"681.0\" y=\"209.0\" text-anchor=\"middle\">body</text><rect class=\"n\" x=\"250\" y=\"196\" width=\"140\" height=\"48\" rx=\"7\"/><text class=\"b\" x=\"320.0\" y=\"217.0\" text-anchor=\"middle\">Cortex +</text><text class=\"s\" x=\"320.0\" y=\"231.0\" text-anchor=\"middle\">Hippocampus</text><path class=\"ar\" d=\"M92 132 L120 132\" marker-end=\"url(#m6)\"/><path class=\"ar\" d=\"M212 132 L395 132\" marker-end=\"url(#m6)\"/><text class=\"b\" x=\"303\" y=\"122\" text-anchor=\"middle\">SHORT route</text><text class=\"xs\" x=\"303\" y=\"106\" text-anchor=\"middle\">fast, unconscious, can be wrong</text><path class=\"ar\" d=\"M166 154 L166 220 L250 220\" marker-end=\"url(#m6)\"/><path class=\"ar\" d=\"M390 220 L445 220 L445 154\" marker-end=\"url(#m6)\"/><text class=\"b\" x=\"205\" y=\"262\" text-anchor=\"start\">LONG route: slower, conscious, accurate</text><path class=\"ar\" d=\"M495 132 L520 132\" marker-end=\"url(#m6)\"/><path class=\"ar\" d=\"M580 154 L580 198 L650 198\" marker-end=\"url(#m6)\"/></svg><figcaption>Short route: thalamus to amygdala, bypassing the cortex and hippocampus (a quick 'thoughtless' reaction). Long route: thalamus to cortex and hippocampus, then amygdala, allowing a thoughtful appraisal. The hypothalamus and ANS produce the body response.</figcaption></figure>\n<p><b>ANS role:</b> the sympathetic system turns the body ON (heart rate and breathing up); the parasympathetic calms it AFTER danger passes.</p>", "qs": [{"t": "h", "r": "Q1", "q": "Compare LeDoux's short and long pathways.", "a": "Short: thalamus straight to amygdala; fast, unconscious, can be wrong, aids survival. Long: thalamus to cortex and hippocampus then amygdala; slower, conscious, accurate, allows a planned response."}, {"t": "c", "r": "Q2", "q": "State the role of the amygdala and the hippocampus in emotion.", "a": "Amygdala: the emotion alarm system that detects danger and triggers fear responses. Hippocampus: stores emotional memories and remembers where and when events happened."}]}, {"id": "E4", "wk": "Emotion and wellbeing (Lessons 7, 9 and 10)", "title": "E4 Happiness and flow (Lesson 10)", "th": "<ul>\n<li>Happiness is a complex, multifaceted construct: <b>wellbeing + positive emotions + life satisfaction</b>. It is not constant pleasure and often includes challenges.</li>\n<li>Studied because it is linked to better mental and physical health, stronger relationships, success at work and longer life. (About 6% of all books are about happiness.)</li>\n<li><b>Measured</b> by self-reports or reports from family/friends. Not always accurate, since people may present as happier than they feel.</li>\n<li>These factors <b>do not simply cause happiness</b>: they both affect it AND are affected by it.</li>\n</ul>\n<div class=\"tw\"><table>\n<tr><th>Factor</th><th>Key point</th></tr>\n<tr><td><b>Age</b></td><td>Younger people may feel more intense happiness; older people experience wider contentment</td></tr>\n<tr><td><b>Physical health</b></td><td>Generally strongest from adolescence to middle age; lower illness risk and less age-related decline link to higher happiness</td></tr>\n<tr><td><b>Culture</b></td><td>Cultural values shape what people think brings happiness. Bhutan shows strong social expectations and lower stress can support high happiness without high wealth</td></tr>\n<tr><td><b>Religion</b></td><td>Active practitioners often report higher happiness, likely from regular social interaction, community and belonging</td></tr>\n<tr><td><b>Income and employment</b></td><td>Employment and enough income for basic needs raise happiness; beyond that, more money adds little</td></tr>\n<tr><td><b>Intentional activities</b></td><td>Deliberate behaviours chosen to boost happiness: mindfulness, flow activities, gratitude, acts of kindness</td></tr>\n</table></div>\n<h3>The flow experience (Csikszentmihalyi, 1975)</h3>\n<div class=\"box\"><b>Flow</b> = a mental state of complete focus and immersion in an activity. It occurs when <b>skill level matches challenge</b>. Seen in artists and musicians absorbed in creating. People are often happiest in flow.</div>\n<figure><svg viewBox=\"0 0 620 272\" role=\"img\" aria-label=\"Flow occurs when skill matches challenge\"><polygon points=\"70,230 70,200 250,20 280,20 280,50 100,230\" fill=\"#2e9e6b\" fill-opacity=\".35\" stroke=\"#2e9e6b\" stroke-width=\"2\"/><line x1=\"60\" y1=\"240\" x2=\"360\" y2=\"240\" class=\"ln\"/><line x1=\"60\" y1=\"240\" x2=\"60\" y2=\"10\" class=\"ln\"/><text class=\"s\" x=\"210\" y=\"262\" text-anchor=\"middle\">Skill level →</text><text class=\"s\" transform=\"translate(22 130) rotate(-90)\" text-anchor=\"middle\">Challenge →</text><text class=\"b\" transform=\"translate(150 140) rotate(-45)\" text-anchor=\"middle\">FLOW</text><text class=\"s\" x=\"120\" y=\"42\" text-anchor=\"middle\">Challenge higher</text><text class=\"s\" x=\"120\" y=\"56\" text-anchor=\"middle\">than skill</text><text class=\"s\" x=\"300\" y=\"208\" text-anchor=\"middle\">Challenge lower</text><text class=\"s\" x=\"300\" y=\"222\" text-anchor=\"middle\">than skill</text><text class=\"b\" x=\"400\" y=\"70\" text-anchor=\"start\">Flow happens when</text><text class=\"b\" x=\"400\" y=\"88\" text-anchor=\"start\">skill matches challenge.</text><text class=\"s\" x=\"400\" y=\"114\" text-anchor=\"start\">To stay in flow, the</text><text class=\"s\" x=\"400\" y=\"128\" text-anchor=\"start\">challenge must keep</text><text class=\"s\" x=\"400\" y=\"142\" text-anchor=\"start\">rising as skill grows.</text></svg><figcaption>Flow (Csikszentmihalyi, 1975) sits in the band where skill level and challenge are balanced.</figcaption></figure>\n<p><b>Six features:</b></p>\n<ul>\n<li>Intense, focused concentration on the present moment</li>\n<li>Merging of action and awareness</li>\n<li>Loss of reflective self-consciousness</li>\n<li>A sense of personal control over the situation/activity</li>\n<li>An altered experience of time</li>\n<li>Experiencing the activity as rewarding</li>\n</ul>\n<div class=\"g2\">\n<div class=\"sc\"><h3>Benefits</h3><ul><li>More positive affect and life satisfaction (Diener's subjective wellbeing)</li><li>Greater happiness and success; sense of accomplishment</li><li>Develops skills and expertise (needs increasing challenge); builds confidence</li><li>Higher intrinsic motivation, self-directed learning, better performance, lower anxiety, higher self-esteem</li><li>Practice improves performance, which makes flow more likely again</li></ul></div>\n<div class=\"sc\"><h3>Criticisms and concerns</h3><ul><li>Can become addictive for frequent experiencers</li><li>Everyday life may feel boring or less rewarding by comparison</li><li>Can make coping with normal activities harder</li></ul><p>Flow is a key concept in <b>positive psychology</b> (focus on wellbeing, not illness).</p></div>\n</div>", "qs": [{"t": "c", "r": "Q1", "q": "List the six features of the flow experience.", "a": "Intense focused concentration on the present; merging of action and awareness; loss of self-consciousness; a sense of personal control; an altered sense of time; the activity feels rewarding."}, {"t": "h", "r": "Q2", "q": "Explain why age, health or culture are not simple causes of happiness.", "a": "These factors both affect happiness and are affected by it (for example, happier people may stay healthier), and happiness is measured by self-report that is not always accurate, so the relationship is two-way and not simply cause and effect."}]}];
const GR=[["Topic 1: Role of the brain", ["B1", "B2", "B3", "B4", "B5", "B6"]], ["Topic 2: Intelligence", ["I1", "I2", "I3", "I4", "I5", "I6"]], ["Emotion and wellbeing", ["E1", "E2", "E3", "E4"]]];
const SH={"B1": "Neuron", "B2": "Brain regions", "B3": "Lobes", "B4": "Localisation", "B5": "History & ethics", "B6": "Nervous system", "I1": "IQ", "I2": "IQ tests", "I3": "Validity & reliability", "I4": "Heritability", "I5": "Nature & nurture", "I6": "IQ vs EQ", "E1": "Emotion theories", "E2": "Coping", "E3": "Limbic system", "E4": "Happiness & flow"};
const BL={"B1": "The five parts of a neuron and how a signal travels from dendrites to axon terminals.", "B2": "Hindbrain, midbrain and forebrain: structures and the behaviours each controls.", "B3": "The cortex, four lobes, primary areas and contralateral organisation.", "B4": "Broca's, Wernicke's and Geschwind's areas, and predicting the effects of damage.", "B5": "Gage, lobotomy, H.M. and more: how knowledge was gained and the ethics involved.", "B6": "CNS, PNS, somatic and autonomic systems, sympathetic and parasympathetic.", "I1": "What IQ is, the psychometric approach, the bell curve and how scores are compared.", "I2": "How the Stanford-Binet, WAIS-IV and WISC-V measure intelligence.", "I3": "Validity and reliability applied to IQ tests, and where they fall short.", "I4": "Twin, family and adoption studies, including the Minnesota study.", "I5": "How genes and environment interact to shape intelligence.", "I6": "Are IQ and EQ tests accurate, misleading or both?", "E1": "Components of emotion, two-factor theory and appraisal theory.", "E2": "Problem-focused and emotion-focused coping, and reappraisal.", "E3": "Limbic system structures and LeDoux's short and long pathways.", "E4": "What happiness is, what affects it, and the flow experience."};
const EX={"B1": [["Trace what happens when a neuron receives a message from another neuron and passes it on.", "1. Neurotransmitters from the previous neuron reach the <b>dendrites</b>.<br>2. The <b>cell body</b> combines the incoming signals and decides whether to fire.<br>3. The impulse travels along the <b>axon</b>, sped up by the <b>myelin sheath</b>.<br>4. At the <b>axon terminals</b>, neurotransmitters are released into the synapse.<br>5. They pass the message on to the next neuron's dendrites."], ["A disease strips the myelin from motor neurons. Predict the effect on movement.", "Myelin insulates the axon and speeds up the impulse. Without it, messages slow down or are disrupted, so muscles receive commands late or not at all. Expect weakness and slow or poorly coordinated movement."]], "B2": [["Name the structure and region for each: (a) controlling breathing during sleep (b) learning to ride a bike smoothly (c) planning tomorrow's study (d) turning your head toward a sudden noise.", "(a) Medulla, hindbrain: breathing and heart rate.<br>(b) Cerebellum, hindbrain: coordination and motor learning.<br>(c) Frontal cortex of the cerebrum, forebrain: planning.<br>(d) Midbrain (colliculi): reflex responses to sights and sounds."], ["Why is damage to the brainstem often more life-threatening than damage to part of the forebrain?", "The brainstem includes the medulla and pons, which control breathing and heart rate. If these stop, survival is at risk. Forebrain damage usually changes thinking, movement or emotion rather than stopping vital functions."]], "B3": [["After an accident, a person can see and hear normally but cannot recognise familiar voices or faces. Which lobe is most likely affected?", "The <b>temporal lobe</b>, which is involved in recognising voices, faces and objects, as well as hearing and memory."], ["A stroke damages the left primary motor cortex. Which side of the body is affected and why?", "The <b>right</b> side. Each hemisphere controls the opposite side of the body (contralateral organisation)."]], "B4": [["Sam understands everything said to him but speaks slowly in short, halting phrases. Predict the damaged area and explain.", "<b>Broca's area</b> (left frontal lobe), which controls speech production. This is Broca's aphasia: understanding is mostly intact but speech is slow and effortful. This is localisation of function: damage to one area affects one function."], ["Explain how Broca's work with the patient 'Tan' supports localisation of function.", "Tan understood language but could only say 'tan'. After his death, an autopsy found damage in the left frontal lobe. Matching a specific loss (speech) to a specific damaged area, and finding the same pattern in later patients, showed that speech production is localised."]], "B5": [["Evaluate the ethics of lobotomy using three ethical ideas.", "<b>Informed consent:</b> many patients were vulnerable (including children and people in institutions) and could not truly consent.<br><b>Harm and benefit:</b> there was little evidence it helped, yet it caused apathy, loss of personality, brain damage and death.<br><b>Vulnerable people:</b> patients with serious illness were easily pressured.<br>Overall the harms outweighed the benefits, so it is seen as unethical by modern standards."], ["What can and what can't we conclude from one case such as Phineas Gage?", "We can say the frontal lobe is likely involved in personality, planning and impulse control. We cannot generalise to everyone: it is a single case, there was no control group or brain scan, and details came from second-hand reports."]], "B6": [["Describe the pathway when you touch a hot pan and pull your hand away.", "Skin receptors detect the heat. <b>Sensory neurons</b> (PNS) carry the signal to the <b>spinal cord</b>. The spinal cord triggers a <b>reflex</b> and <b>motor neurons</b> (PNS) tell the muscles to pull the hand away. The signal also goes up to the <b>brain</b>, which recognises the sensation as pain."], ["A loud bang makes your heart race. Which parts of the nervous system are involved?", "The perceived threat activates the <b>sympathetic</b> branch of the <b>autonomic</b> nervous system (part of the PNS), which speeds up heart rate and breathing automatically. Afterwards the <b>parasympathetic</b> branch calms the body and restores normal function."]], "I1": [["A child aged 8 performs like an average 10-year-old. Calculate the ratio IQ.", "IQ = (mental age ÷ chronological age) × 100 = (10 ÷ 8) × 100 = 125."], ["With a mean of 100 and standard deviation of 15, about what percentage of people score above 115?", "About 68% score between 85 and 115, so about 32% score outside that range. Half of these (about 16%) score above 115."]], "I2": [["Choose the right Wechsler test for (a) a 14-year-old and (b) a 35-year-old, and name the index scores.", "(a) <b>WISC-V</b> (ages 6 to 16): Verbal Comprehension, Visual Spatial, Fluid Reasoning, Working Memory, Processing Speed.<br>(b) <b>WAIS-IV</b> (ages 16 to 90): Verbal Comprehension, Perceptual Reasoning, Working Memory, Processing Speed."], ["A child has a high Verbal Comprehension score but a low Processing Speed score. What does this show?", "The child is strong at verbal reasoning and knowledge but slower at quick tasks such as Coding. The index scores give a profile of strengths and weaknesses that a single IQ number hides."]], "I3": [["A person scores 98 on an IQ test and 99 on the same test a week later. Which concept does this show?", "<b>Reliability</b> (test-retest): the test gives consistent results. It does not by itself show the test is valid."], ["A test written with English idioms is given to a student who has just learned English. Which concept is threatened?", "<b>Validity.</b> A low score may reflect language difficulty rather than low intelligence, so the test is not measuring what it claims to (cultural and language bias)."]], "I4": [["Interpret the Minnesota result of about .70 for identical twins reared apart.", "These twins share about 100% of their genes but grew up in different homes. A correlation of about .70 means their IQs were very similar despite different environments, suggesting about 70% of the variation in IQ is associated with genetic differences."], ["Give two criticisms of the Minnesota study.", "1. Small, self-selected sample (twins recruited through publicity).<br>2. Many twins had contact before testing and were not separated at birth, and adoptive homes were often similar, so environment may not have been fully different."]], "I5": [["Explain how the Flynn effect supports the role of environment.", "Average IQ scores rose about 3 points per decade. Genes cannot change that fast across a population, so improvements in nutrition, schooling and stimulation are likely causes."], ["A child has genes for high ability but grows up with very little stimulation. Predict the outcome using reaction range.", "Genes set a range of possible outcomes. In a poor environment the child is likely to end up at the lower end of that range; in an enriched environment they would reach the upper end."]], "I6": [["Evaluate whether a self-report EQ questionnaire is a valid measure of emotional intelligence.", "Concerns: answers can be faked or inflated; it measures how people see themselves rather than their actual ability; scores overlap with personality; there is no agreed definition of EQ. So its validity is weaker than IQ tests, although it may still capture useful information about emotional skills."], ["Should a school use only an IQ test to judge a student's potential?", "No. IQ tests are reliable and predict school results moderately well (correlation about .5), but they are narrow, can be culturally biased, are affected by anxiety and conditions, and ignore creativity and emotional skills. Use IQ alongside other evidence."]], "E1": [["You hear a noise at night and your heart races. You then realise it is your cat. Explain the emotion using two-factor theory.", "Physiological arousal (racing heart) comes first. Then you interpret the cause. If you label it as an intruder you feel fear; once you label it as the cat you feel relief. The same arousal gives different emotions depending on the cognitive label."], ["Use appraisal theory to explain Jamie's anxiety before a speech and why it eases.", "<b>Primary appraisal:</b> Jamie sees the speech as a threat (fear of being judged), producing anxiety.<br><b>Secondary appraisal:</b> Jamie considers preparation, rehearsal and notes, so the coping potential is high and the anxiety becomes less intense."]], "E2": [["After failing a test, give one problem-focused and one emotion-focused response.", "Problem-focused: make a study plan or ask the teacher for feedback (dealing with the cause).<br>Emotion-focused: go for a run or talk to a friend to reduce the stress (dealing with the feelings)."], ["A student is nervous before a presentation. Show how reappraisal could change the emotion.", "The student lists positives (they know the topic, they have practised), recalls past successes and reframes nervous energy as enthusiasm. Re-evaluating the situation and coping ability reduces anxiety and turns it into a more motivated state."]], "E3": [["A stick on a walking track looks like a snake and you jump. Explain using LeDoux's pathways.", "<b>Short route:</b> thalamus → amygdala → hypothalamus. It is fast and unconscious, so you jump before thinking.<br><b>Long route:</b> thalamus → cortex and hippocampus → amygdala. This slower route identifies it as a stick and you calm down."], ["Why is it useful to have a fast route even though it can be wrong?", "If the object were a real snake, reacting quickly could save you. A false alarm costs little, but being too slow could cost a lot, so the fast route has a survival advantage."]], "E4": [["A guitarist loses track of time while practising a song slightly beyond their current skill. Which flow features appear?", "Intense concentration on the present, altered experience of time, loss of self-consciousness, a sense of control, and the activity feeling rewarding. This fits flow because the challenge matches their skill."], ["Explain why more money does not keep increasing happiness.", "Employment and enough income for basic needs raise happiness, but beyond that more money adds little. Other factors such as relationships, health and meaningful activities matter more."]]};
const FC=[["Neuron: dendrites", "Receive signals from other neurons and pass them to the cell body."], ["Neuron: cell body (soma)", "Contains the nucleus; keeps the cell alive and combines incoming signals."], ["Neuron: axon", "Long fibre that carries the electrical impulse away from the cell body."], ["Neuron: myelin sheath", "Fatty insulating layer around the axon that speeds up the signal."], ["Neuron: axon terminals", "Release neurotransmitters into the synapse to pass the message on."], ["Hindbrain", "Medulla, pons, cerebellum: breathing, heart rate, balance, coordination."], ["Midbrain", "Reflexes to sights and sounds, alertness and movement control."], ["Forebrain", "Cerebrum, thalamus, hypothalamus, limbic system: thought, emotion, memory, movement."], ["Cerebellum", "Balance, posture and smooth, coordinated movement."], ["Hypothalamus", "Regulates temperature, hunger, thirst; controls body reactions and hormones."], ["Frontal lobe", "Planning, decisions, impulse control, voluntary movement, speech production."], ["Parietal lobe", "Touch, temperature, pain and spatial awareness."], ["Temporal lobe", "Hearing, language, memory, recognising voices and faces."], ["Occipital lobe", "Vision."], ["Contralateral organisation", "Each hemisphere controls the opposite side of the body."], ["Localisation of function", "Different brain areas perform different functions, so damage effects can be predicted."], ["Broca's area", "Left frontal lobe; speech production. Damage: Broca's aphasia (halting speech)."], ["Wernicke's area", "Left temporal lobe; language comprehension. Damage: fluent but meaningless speech."], ["Why is lobotomy ethically concerning?", "Little evidence it worked, often no real consent, vulnerable patients, serious permanent harm."], ["Who was H.M.?", "Patient whose hippocampi were removed (1953); could no longer form new memories."], ["Somatic vs autonomic", "Somatic: voluntary movement. Autonomic: automatic body functions."], ["Sympathetic vs parasympathetic", "Sympathetic speeds up (fight/flight). Parasympathetic calms (rest and digest)."], ["Psychometric approach", "Intelligence is measured with standardised tests and compared between people."], ["IQ scale", "Mean 100, standard deviation 15; about 68% score 85 to 115."], ["Ratio IQ formula", "(mental age ÷ chronological age) × 100 (Stern)."], ["Spearman's g", "General intelligence factor behind performance on many different mental tasks."], ["Stanford-Binet", "From Binet-Simon (1905) and Terman (1916); ages about 2 to 85+; five factors."], ["WAIS-IV", "Adults aged 16 to 90; four index scores plus Full Scale IQ."], ["WISC-V", "Children aged 6 to 16; five primary index scores plus Full Scale IQ."], ["Reliability", "Consistency: similar results on retest, split-half or between scorers."], ["Validity", "Whether a test measures what it claims to measure."], ["Heritability", "Proportion of differences in a trait within a population associated with genetic differences."], ["Minnesota Twins Reared Apart (1990)", "Bouchard et al.; 56 pairs of identical twins reared apart; IQ correlation about .70."], ["Twin study logic", "If genes matter, identical twins should be more alike than fraternal twins."], ["Adoption study logic", "Compare adopted children with biological relatives (genes) and adoptive relatives (environment)."], ["Flynn effect", "Average IQ scores rose about 3 points per decade, too fast for genetic change."], ["Reaction range", "Genes set a range of possible outcomes; environment decides where within it."], ["EQ (emotional intelligence)", "Ability to perceive, understand, use and manage emotions (Salovey and Mayer; Goleman)."], ["Three components of emotion", "Physiological, subjective feeling, behavioural/expressive."], ["Two-factor theory", "Emotion = physiological arousal + cognitive interpretation (Schachter and Singer, 1962)."], ["Appraisal theory", "Evaluate the situation first (primary: is it a problem? secondary: can I cope?), then emotion follows."], ["Problem-focused coping", "Deals with the cause: take control, seek information, weigh pros and cons."], ["Emotion-focused coping", "Reduces feelings: relaxation, talking, exercise, distraction, denial."], ["Reappraisal", "Re-evaluating the situation and coping ability as new information arrives."], ["LeDoux short route", "Thalamus → amygdala → hypothalamus: fast, unconscious, can be wrong."], ["LeDoux long route", "Thalamus → cortex and hippocampus → amygdala: slower, conscious, accurate."], ["Amygdala", "Emotion alarm system; detects danger and fear."], ["Flow", "Complete absorption when skill matches challenge (Csikszentmihalyi, 1975)."], ["Happiness (psychology)", "Wellbeing + positive emotions + life satisfaction."]];
const BK={"t1": {"t": "Topic 1: Role of the brain", "sh": "Topic 1 test", "tag": "Topic 1", "parts": [{"n": "Test", "mc": [{"q": "Which part of a neuron receives signals from other neurons?", "o": ["Axon", "Dendrites", "Axon terminals", "Myelin sheath"], "a": 1, "e": "Dendrites receive incoming signals and pass them to the cell body."}, {"q": "What is the main function of the myelin sheath?", "o": ["To produce neurotransmitters", "To receive signals", "To insulate the axon and speed up the impulse", "To store DNA"], "a": 2, "e": "Myelin insulates the axon so the impulse travels faster."}, {"q": "Which part of a neuron releases neurotransmitters into the synapse?", "o": ["Dendrites", "Cell body", "Axon terminals", "Myelin sheath"], "a": 2, "e": "The axon terminals release neurotransmitters to pass the message on."}, {"q": "The medulla is part of which region, and what does it control?", "o": ["Forebrain; thinking", "Hindbrain; breathing and heart rate", "Midbrain; reflexes", "Forebrain; emotion"], "a": 1, "e": "The medulla is in the hindbrain and controls vital automatic functions."}, {"q": "Which structure coordinates balance and smooth movement?", "o": ["Thalamus", "Hypothalamus", "Cerebellum", "Amygdala"], "a": 2, "e": "The cerebellum (hindbrain) coordinates balance and movement."}, {"q": "Which lobe contains the primary visual cortex?", "o": ["Frontal", "Parietal", "Temporal", "Occipital"], "a": 3, "e": "Vision is processed in the occipital lobe."}, {"q": "Damage to the right primary motor cortex most likely causes weakness on which side?", "o": ["The right side of the body", "The left side of the body", "Both sides equally", "Neither side"], "a": 1, "e": "Each hemisphere controls the opposite side of the body (contralateral)."}, {"q": "A patient speaks slowly and with effort but understands language well. Which area is most likely damaged?", "o": ["Wernicke's area", "Broca's area", "Geschwind's territory", "Primary visual cortex"], "a": 1, "e": "Broca's area controls speech production; damage causes Broca's aphasia."}, {"q": "What is a main ethical concern about lobotomies?", "o": ["They were too expensive", "They caused serious harm to vulnerable patients, often without real informed consent", "They were done only on animals", "They took too long"], "a": 1, "e": "Lobotomies often caused severe harm with little evidence of benefit and weak consent."}, {"q": "Which system controls voluntary movement of skeletal muscles?", "o": ["Somatic nervous system", "Autonomic nervous system", "Sympathetic nervous system", "Parasympathetic nervous system"], "a": 0, "e": "The somatic system controls voluntary movement."}, {"q": "When you are frightened, which branch speeds up your heart rate?", "o": ["Parasympathetic", "Sympathetic", "Somatic", "Spinal cord"], "a": 1, "e": "The sympathetic branch prepares the body for fight or flight."}, {"q": "What is the main role of the thalamus?", "o": ["Sensory relay station", "Balance", "Producing speech", "Storing memories"], "a": 0, "e": "The thalamus relays incoming sensory information to the right brain areas."}], "sr": [{"q": "Describe the path of a signal through one neuron, using all five parts.", "a": "Dendrites receive neurotransmitters from the previous neuron; the cell body combines the signals and decides whether to fire; the impulse travels along the axon, sped up by the myelin sheath; the axon terminals release neurotransmitters into the synapse to pass the message on."}, {"q": "A person has damage to Broca's area. Predict the effects and explain using localisation of function.", "a": "Speech would be slow, halting and effortful, but understanding mostly intact (Broca's aphasia). Localisation of function means different areas perform specific functions: Broca's area in the left frontal lobe controls speech production, so damage mainly affects speaking."}, {"q": "Explain two ethical concerns about how early knowledge of the brain was gained.", "a": "(1) Lack of informed consent: patients such as those given lobotomies were often vulnerable and could not truly agree. (2) Harm outweighing benefit: procedures caused permanent damage (e.g. loss of personality, H.M.'s memory loss) with little evidence of benefit. Others: privacy, animal welfare."}, {"q": "Describe what the hindbrain, midbrain and forebrain control, with one structure for each.", "a": "Hindbrain (e.g. medulla): breathing, heart rate, balance and coordination. Midbrain (e.g. colliculi): reflex responses to sights and sounds and alertness. Forebrain (e.g. cerebrum): thinking, language, memory, emotion and voluntary movement."}]}]}, "t2": {"t": "Topic 2: Intelligence", "sh": "Topic 2 test", "tag": "Topic 2", "parts": [{"n": "Test", "mc": [{"q": "On modern IQ tests the average score and standard deviation are:", "o": ["50 and 10", "100 and 15", "100 and 10", "150 and 15"], "a": 1, "e": "Modern tests are set to a mean of 100 and a standard deviation of 15."}, {"q": "Which test is a Wechsler scale designed for children aged 6 to 16?", "o": ["WAIS-IV", "WISC-V", "MSCEIT", "EQ-i"], "a": 1, "e": "The WISC-V is the Wechsler Intelligence Scale for Children."}, {"q": "A person gets very similar scores when they take the same test twice. This shows the test is:", "o": ["Valid", "Reliable", "Culturally fair", "Biased"], "a": 1, "e": "Consistency over time is reliability (test-retest)."}, {"q": "A test that measures what it claims to measure has good:", "o": ["Validity", "Reliability", "Standardisation", "Heritability"], "a": 0, "e": "That is the definition of validity."}, {"q": "A child has a mental age of 9 and a chronological age of 6. Their ratio IQ is:", "o": ["67", "100", "150", "54"], "a": 2, "e": "(9 ÷ 6) × 100 = 150."}, {"q": "About what percentage of people score between 85 and 115?", "o": ["34%", "50%", "68%", "95%"], "a": 2, "e": "That is within one standard deviation of the mean: about 68%."}, {"q": "If genes influence intelligence, which pair should be MORE alike in IQ?", "o": ["Fraternal twins", "Identical twins", "Unrelated people", "Adoptive siblings"], "a": 1, "e": "Identical twins share about 100% of their genes."}, {"q": "In the Minnesota study (1990), the IQ correlation for identical twins reared apart was about:", "o": [".15", ".30", ".70", "1.00"], "a": 2, "e": "About .70, suggesting about 70% of IQ variation is linked to genetic differences."}, {"q": "Which is a criticism of the Minnesota study?", "o": ["It had too many participants", "Many twins had contact before testing and similar adoptive homes", "It used no IQ tests", "It only tested children"], "a": 1, "e": "Contact before testing and similar placements weaken the claim that environments were fully different."}, {"q": "The Flynn effect refers to:", "o": ["Heritability increasing with age", "Average IQ scores rising over time", "IQ falling with age", "Twins being separated"], "a": 1, "e": "Average IQ scores rose about 3 points per decade through much of the 20th century."}, {"q": "Which idea says genes set a range of possible outcomes and the environment decides where in that range a person ends up?", "o": ["Reaction range", "Flynn effect", "Standardisation", "Construct validity"], "a": 0, "e": "That is reaction range."}, {"q": "Why are self-report EQ tests criticised?", "o": ["They take too long", "Answers can be faked or inflated", "They need twins", "They cannot be scored"], "a": 1, "e": "People can present themselves as more emotionally skilled than they are."}], "sr": [{"q": "Compare the Stanford-Binet, WAIS-IV and WISC-V.", "a": "All are individually administered, standardised tests with deviation IQ scores (mean 100, SD 15). The Stanford-Binet (from Binet-Simon 1905 and Terman 1916) covers ages about 2 to 85+ and measures five factors. The WAIS-IV is for ages 16 to 90 with four index scores. The WISC-V is for ages 6 to 16 with five primary index scores."}, {"q": "Explain validity and reliability and give one threat to the validity of IQ tests.", "a": "Reliability is consistency (e.g. similar scores on retest); validity is whether the test measures what it claims to. IQ tests are highly reliable. A threat to validity is cultural or language bias, where scores reflect background rather than intelligence (also stereotype threat and test anxiety)."}, {"q": "Using twin, family and adoption evidence, explain the extent to which intelligence is inherited.", "a": "Twin studies: identical twins are more alike than fraternal twins, and those reared apart (Minnesota, about .70) are still similar. Family studies: IQ similarity rises with genetic relatedness. Adoption studies: adopted children's IQ comes to resemble their biological parents. Together they suggest heritability of about .50 to .70 in adults, but not 100%, so environment matters too."}, {"q": "Discuss whether IQ and EQ tests are accurate, misleading, or both.", "a": "IQ tests are reliable and predict school achievement moderately well, but are narrow and can be biased or affected by anxiety. EQ tests capture emotional skills but have weaker reliability and validity, rely on self-report that can be faked and overlap with personality. So both are useful but limited: accurate for what they measure and misleading if used alone."}, {"q": "Explain how genes and environment interact to influence intelligence.", "a": "Genes set a reaction range of possible outcomes and the environment (nutrition, schooling, stimulation) decides where in that range a person ends up. People with certain genes also seek out particular environments, and the environment can change gene expression. Evidence: heritability of IQ rises with age while the Flynn effect and adoption studies show environment matters."}]}]}, "t3": {"t": "Emotion and wellbeing", "sh": "Emotion test", "tag": "Emotion", "parts": [{"n": "Test", "mc": [{"q": "Which is NOT one of the three components of emotion?", "o": ["Physiological changes", "Subjective feeling", "Behavioural expression", "Standardised scoring"], "a": 3, "e": "The three compo function mt(t,i,dir){let d=0;for(let k=i;k>=0&&k<t.length;k+=dir){const c=t[k];if("([".includes(c))d+=dir==-1?-1:1;else if(")]".includes(c))d+=dir==-1?1:-1;if(d==0)return k}return -1}

function fr(t){
 for(let i=0;i<t.length;i++){
  if(t[i]!="/")continue;
  let l=i-1,r=i+1,l2=l,r2=r;
  while(t[l2]==" ")l2--;while(t[r2]==" ")r2++;
  if(")]".includes(t[l2]||"#")&&"([".includes(t[r2]||"#")){l=l2;r=r2}else if(t[l]==" "||t[r]==" ")continue;
  let ls,re;
  if(")]".includes(t[l])){ls=mt(t,l,-1);if(ls<0)continue}else{ls=l;while(ls>=0&&W.test(t[ls]))ls--;ls++}
  if("([".includes(t[r])){re=mt(t,r,1);if(re<0)continue}else{re=r;while(re<t.length){if(W.test(t[re]))re++;else if(t[re]=="("&&t[re-1]=="^"){const j=mt(t,re,1);if(j<0)break;re=j+1}else break}re--;while(t[re]==".")re--}
  if(ls>l||re<r)continue;
  const A0=t.slice(ls,l+1),B0=t.slice(r,re+1),bad=x=>!/^[(\[]/.test(x)&&/[A-Za-z]{3,}/.test(x);if(bad(A0)||bad(B0))continue;
  const h='<span class=fr><span class=nu>'+fr(st(t.slice(ls,l+1)))+'</span><span class=de>'+fr(st(t.slice(r,re+1)))+'</span></span>';
  t=t.slice(0,ls)+h+t.slice(re+1);i=ls+h.length-1}
 return t}

async function viaKey(m){const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL,max_tokens:1000,system:SYS,messages:m})});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(r.status==401?"badkey":(d.error&&d.error.message)||"HTTP "+r.status);return d.content.filter(c=>c.type=="text").map(c=>c.text).join("")}

function noAI(){if(ready)kp.style.display="block";add("a",ready?"This copy is open outside Claude. Either paste your own API key in the box below, or use the published page where the tutor works without a key:\n"+LINK:"Still connecting to the tutor. Try again in a moment.")}
tut.onclick=()=>{dr.classList.add("open");if(!smp&&!key&&ready&&!warned){warned=true;noAI()}};document.getElementById("tx").onclick=()=>dr.classList.remove("open");
const SUG=SITE.sug;
document.getElementById("ch").innerHTML=SUG.map(t=>`<button class="chip">${t}</button>`).join("");
document.querySelectorAll("#ch .chip").forEach(b=>b.onclick=()=>{ti.value=b.textContent;ti.focus()});
function add(c,t){const d=document.createElement("div");d.className="m "+c;d.textContent=t;ms.appendChild(d);ms.scrollTop=ms.scrollHeight;return d}
async function send(){
 const q=ti.value.trim();if(!q||busy)return;if(!smp&&!key){noAI();return}busy=true;ti.value="";add("u",q);hist.push({role:"user",content:q});
 const b=add("a","Thinking…");let m=hist.slice(-12);while(m.length&&m[0].role!="user")m.shift();
 const raw=m;m=m.map((x,i)=>i==0?{role:"user",content:SYS+"\n\nStudent: "+x.content}:x);
 try{let tx;if(smp){const r=await smp(m,{cache:false,onText:o=>{b.textContent=o.text;ms.scrollTop=ms.scrollHeight}});tx=r.text}else tx=await viaKey(raw);b.textContent=tx;hist.push({role:"assistant",content:tx})}
 catch(e){hist.pop();b.textContent=e&&e.message=="badkey"?"Anthropic rejected that API key. Check it with the 🔑 Key button.":e&&e.name=="TypeError"&&!smp?"Couldn’t reach Anthropic. Check your internet connection (and that nothing is blocking api.anthropic.com).":e&&e.code=="not_granted"?"The tutor needs your permission to run. Reload and allow it when asked.":e&&e.code=="rate_limited"?"Too many questions too quickly. Wait a moment and try again.":"Sorry, something went wrong. Try again."}
 busy=false}
document.getElementById("ts").onclick=send;
ti.addEventListener("keydown",e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();send()}});

</script></body></html>

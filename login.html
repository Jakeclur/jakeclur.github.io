<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · Year Ten</title>
<script>try{var t=localStorage.getItem("yt-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5b6578;--ac:#5b3fd0;--bd:#dde1ea;--er:#c0392b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa3b8;--ac:#a58bff;--bd:#2d3243;--er:#ff7b6b}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa3b8;--ac:#a58bff;--bd:#2d3243;--er:#ff7b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px}
h1{margin:0 0 4px;font-size:26px}h1 span{color:var(--ac)}
p{color:var(--mu);margin:0 0 16px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:999px;background:var(--ac);color:#fff;font:600 16px system-ui,sans-serif;cursor:pointer}
button.l{background:none;color:var(--ac);margin-top:8px;font-size:14px}
button:disabled{opacity:.6}
#msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--er)}#msg.ok{color:var(--mu)}
a{color:var(--ac)}
</style></head><body>
<form id="f">
<h1>Year <span>Ten</span></h1>
<p id="sub">Log in to open the study hubs.</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="email" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="8" required>
<div id="msg" role="alert"></div>
<button id="go" type="submit">Log in</button>
<button id="sw" class="l" type="button">New here? Make an account</button>
<p style="margin:14px 0 0;text-align:center"><a href="index.html">← Back to home</a></p>
</form>
<script>
var mode="login",$=function(i){return document.getElementById(i)};
var next=new URLSearchParams(location.search).get("next")||"";
if(!/^\/[A-Za-z0-9._-]+$/.test(next))next="/account.html";
function setMode(m){mode=m;$("go").textContent=m==="login"?"Log in":"Make account";
 $("sw").textContent=m==="login"?"New here? Make an account":"Have an account? Log in";
 $("sub").textContent=m==="login"?"Log in to open the study hubs.":"Make an account, then subscribe to unlock everything.";
 $("pw").autocomplete=m==="login"?"current-password":"new-password";$("msg").textContent=""}
$("sw").onclick=function(){setMode(mode==="login"?"signup":"login")};
$("f").onsubmit=function(e){
 e.preventDefault();$("go").disabled=true;$("msg").className="";$("msg").textContent="";
 fetch("/api/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})})
 .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})})
 .then(function(x){
  if(!x.ok){$("msg").textContent=x.d.error||"Something went wrong.";return}
  if(x.d.confirm){$("msg").className="ok";$("msg").textContent="Check your email and click the link, then log in.";setMode("login");return}
  location.href=next;
 }).catch(function(){$("msg").textContent="Network problem. Try again."})
 .then(function(){$("go").disabled=false});
};
</script></body></html>

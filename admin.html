<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Year Ten</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5b6578;--ac:#5b3fd0;--ac2:#e9e4ff;--bd:#dde1ea;--er:#c0392b;--ok:#1e8e4e;--wn:#b9770e}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa3b8;--ac:#a58bff;--ac2:#2b2552;--bd:#2d3243;--er:#ff7b6b;--ok:#4cd08a;--wn:#f0b45a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:16px 16px 80px}
.w{max-width:760px;margin:0 auto}
h1{margin:8px 0 2px;font-size:28px}h1 span{color:var(--ac)}
h2{margin:0 0 10px;font-size:19px}
.sub{color:var(--mu);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
input[type=text],input[type=password],input[type=file]{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:600 14px system-ui,sans-serif;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:999px;padding:8px 15px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border-color:var(--bd)}
button.d{background:transparent;color:var(--er);border-color:var(--er)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.it{padding:11px 0;border-top:1px solid var(--bd)}.it:first-of-type{border-top:0}
.b{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid}
.b.on{color:var(--ok);border-color:var(--ok)}.b.off{color:var(--er);border-color:var(--er)}
.mu{color:var(--mu);font-size:13px}
#msg{position:sticky;top:8px;z-index:5;margin:10px 0;padding:10px 14px;border-radius:10px;font-size:14px;display:none;border:1px solid var(--bd);background:var(--card)}
#msg.er{display:block;color:var(--er);border-color:var(--er)}#msg.ok{display:block;color:var(--ok);border-color:var(--ok)}#msg.wn{display:block;color:var(--wn);border-color:var(--wn)}
#dirty{display:none;color:var(--wn);font-weight:700;font-size:13px}
.pg{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.pg button{min-width:92px}
.lk{color:var(--er)}.ul{color:var(--ok)}
.grid2{display:grid;grid-template-columns:70px 1fr;gap:8px}
code{background:var(--ac2);padding:1px 6px;border-radius:6px}
select{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.yh{margin:16px 0 0;font-size:15px;color:var(--ac)}
.b.ad{color:var(--ac);border-color:var(--ac)}
.ck{display:flex;align-items:center;gap:8px;font-weight:400;font-size:15px;margin:8px 0}.ck input{width:20px;height:20px}
</style></head><body><div class="w">
<h1>Year <span>Ten</span> admin</h1>
<p class="sub">This page works on your device only. Nothing you type here is sent to anyone.</p>
<div id="msg" role="status"></div>
<div id="app"></div>
</div>
<script src="lock.js"></script>
<script src="ghpub.js"></script>
<script>
var L = YTLock, P = YTPub, S = null, $app = document.getElementById("app");
var YEARS = [["10", "Year 10"], ["11", "Year 11"]];

/* ---------- tiny helpers ---------- */
function h(tag, props, kids) {
  var e = document.createElement(tag);
  for (var k in props || {}) { if (k === "on") for (var ev in props.on) e.addEventListener(ev, props.on[ev]); else if (k === "text") e.textContent = props[k]; else e.setAttribute(k, props[k]); }
  (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function say(text, kind) { var m = document.getElementById("msg"); m.className = text ? kind || "ok" : ""; m.textContent = text || ""; if (text) m.scrollIntoView({ block: "nearest" }); }
function mark() { S.dirty = true; var d = document.getElementById("dirty"); if (d) d.style.display = "inline"; }
function genPass() {
  var a = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = crypto.getRandomValues(new Uint8Array(14)), s = "";
  for (var i = 0; i < r.length; i++) s += a[r[i] % a.length];
  return s;
}
function slug(s) { return s.toLowerCase().replace(/\.html?$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
function topPages() { return S.vault.pages.filter(function (p) { return !p.parent; }); }
function kids(id) { return S.vault.pages.filter(function (p) { return p.parent === id; }); }
function yearOf(p) { return p.year || "10"; }
function findUser(name) { return S.vault.users.filter(function (u) { return u.name.toLowerCase() === name.trim().toLowerCase(); })[0]; }
function roleText(u) { if (!L.isAdmin(u)) return ""; return "Account admin: " + [u.admin.create ? "can create accounts" : "", u.admin.manage ? "can manage accounts" : ""].filter(Boolean).join(" and "); }
addEventListener("beforeunload", function (e) { if (S && S.dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- start: setup or unlock ---------- */
function start() {
  say("");
  P.fresh("vault.enc").catch(function () { return null; }).then(function (t) { t ? unlockScreen(t) : setupScreen(); });
}

function setupScreen() {
  var p1 = h("input", { type: "password", autocomplete: "new-password" }), p2 = h("input", { type: "password", autocomplete: "new-password" });
  var go = h("button", { text: "Create admin vault" });
  go.onclick = async function () {
    if (p1.value.length < 12) return say("Use at least 12 characters. This one password protects everything.", "er");
    if (p1.value !== p2.value) return say("The two passwords do not match.", "er");
    go.disabled = true; say("Working…", "wn");
    var a = await L.newAdminKey(p1.value);
    S = { vault: { pages: [], users: [], owner: await L.newOwnerKeys(), rev: 0 }, admin: a, dirty: true, sel: null, loaded: { "vault.enc": null, "accounts.enc": null } };
    say("");
    main();
  };
  $app.replaceChildren(h("div", { class: "card" }, [
    h("h2", { text: "First-time setup" }),
    h("p", { class: "mu", text: "No vault found. Choose an admin password. If you lose it nobody can recover your pages or accounts, so keep it somewhere safe." }),
    h("label", { text: "Admin password (12+ characters)" }), p1,
    h("label", { text: "Repeat it" }), p2,
    h("div", { class: "row", style: "margin-top:14px" }, [go])]));
}

function unlockScreen(text) {
  var pw = h("input", { type: "password", autocomplete: "current-password" }), go = h("button", { text: "Unlock" });
  async function run() {
    go.disabled = true; say("Unlocking…", "wn");
    var o;
    try { o = await L.openVault(text, pw.value); } catch (e) { say("Wrong admin password.", "er"); go.disabled = false; return; }
    try {
      var v = o.vault, owner = v.owner, users = v.users || [], rev = 0, upgraded = false;
      var acc = await P.fresh("accounts.enc");
      if (!owner) { owner = await L.newOwnerKeys(); upgraded = true; }
      if (acc && v.owner) { var d = await L.openDirectory(acc, { priv: owner.priv }); users = d.dir.users; rev = d.dir.rev || 0; }
      else upgraded = true;
      v.pages.forEach(function (p) { if (!p.year) p.year = "10"; });
      S = { vault: { pages: v.pages, users: users, owner: owner, rev: rev }, admin: { key: o.key, salt: o.salt, iter: o.iter }, dirty: upgraded, sel: null,
        loaded: { "vault.enc": await L.gitSha(text), "accounts.enc": acc ? await L.gitSha(acc) : null } };
      say(upgraded ? "Your site was upgraded to the new account system (account admins and Year 10 / Year 11). Publish once to finish." : "", upgraded ? "wn" : "ok");
      main();
    } catch (e) { say("The account file could not be opened (" + e.message + "). If you published a moment ago, wait a minute and reload.", "er"); go.disabled = false; }
  }
  go.onclick = run; pw.onkeydown = function (e) { if (e.key === "Enter") run(); };
  $app.replaceChildren(h("div", { class: "card" }, [h("h2", { text: "Admin login" }), h("label", { text: "Admin password" }), pw, h("div", { class: "row", style: "margin-top:14px" }, [go]),
    h("p", { class: "mu", text: "Account admins sign in at accountadmin.html instead." })]));
  pw.focus();
}

/* ---------- main screen ---------- */
function main() {
  var k = [h("div", { class: "row sp" }, [h("span", { id: "dirty", text: "● Changes not published yet" }),
    h("button", { class: "g", text: "Log out", on: { click: function () { if (!S.dirty || confirm("You have unpublished changes. Log out anyway?")) { S.dirty = false; S = null; start(); } } } })])];
  k.push(S.sel ? settingsCard() : accountsCard());
  if (!S.sel) { k.push(newAccountCard(), pagesCard(), publishCard(), adminPwCard()); }
  $app.replaceChildren.apply($app, k);
  document.getElementById("dirty").style.display = S.dirty ? "inline" : "none";
}
function change() { mark(); main(); }

function accountsCard() {
  var c = h("div", { class: "card" }, [h("h2", { text: "Accounts (" + S.vault.users.length + ")" })]);
  if (!S.vault.users.length) c.appendChild(h("p", { class: "mu", text: "No accounts yet. Add one below." }));
  S.vault.users.forEach(function (u) {
    var counts = YEARS.map(function (y) { var t = topPages().filter(function (p) { return yearOf(p) === y[0]; }); return y[1] + ": " + t.filter(function (p) { return u.pages.indexOf(p.id) >= 0; }).length + " of " + t.length; }).join(" · ");
    c.appendChild(h("div", { class: "it" }, [
      h("div", { class: "row sp" }, [
        h("div", {}, [h("b", { text: u.name }), " ", h("span", { class: "b " + (u.disabled ? "off" : "on"), text: u.disabled ? "Disabled" : "Active" }),
          L.isAdmin(u) ? h("span", {}, [" ", h("span", { class: "b ad", text: "Account admin" })]) : null,
          h("div", { class: "mu", text: counts + " subjects" }), L.isAdmin(u) ? h("div", { class: "mu", text: roleText(u) }) : null]),
        h("div", { class: "row" }, [
          h("button", { text: "Settings", on: { click: function () { S.sel = u.name; main(); } } }),
          h("button", { class: "g", text: u.disabled ? "Enable" : "Disable", on: { click: function () { u.disabled = !u.disabled; change(); } } })])])]));
  });
  return c;
}

function rightsBoxes(cur) {
  var cr = h("input", { type: "checkbox" }), mg = h("input", { type: "checkbox" });
  cr.checked = !!(cur && cur.create); mg.checked = !!(cur && cur.manage);
  return { create: cr, manage: mg, el: h("div", {}, [
    h("label", { class: "ck" }, [cr, "Can create new accounts"]),
    h("label", { class: "ck" }, [mg, "Can manage accounts (lock and unlock pages, reset passwords, disable or delete normal accounts)"])]) };
}

function newAccountCard() {
  var n = h("input", { type: "text", autocomplete: "off", autocapitalize: "none" }), p = h("input", { type: "text", autocomplete: "off" });
  var type = h("select", {}, [h("option", { value: "user", text: "Normal user (can open pages only)" }), h("option", { value: "admin", text: "Account admin (can also use accountadmin.html)" })]);
  var rights = rightsBoxes({ create: true, manage: true }), rbox = h("div", { style: "display:none" }, [rights.el]);
  type.onchange = function () { rbox.style.display = type.value === "admin" ? "block" : "none"; };
  var gen = h("button", { class: "g", text: "Generate", on: { click: function () { p.value = genPass(); } } });
  var add = h("button", { text: "Create account" });
  add.onclick = async function () {
    var name = n.value.trim();
    if (!/^[A-Za-z0-9._-]{3,32}$/.test(name)) return say("Username: 3–32 letters, numbers, dot, dash or underscore.", "er");
    if (findUser(name)) return say("That username already exists.", "er");
    if (p.value.length < 8) return say("Password needs 8+ characters.", "er");
    if (type.value === "admin" && !rights.create.checked && !rights.manage.checked) return say("Tick at least one account admin right, or choose Normal user.", "er");
    add.disabled = true; say("Creating…", "wn");
    var s = await L.makeUserSecret(name, p.value), u = { name: name, salt: s.salt, ku: s.ku, iter: s.iter, pages: [], disabled: false };
    if (type.value === "admin") u.admin = { create: rights.create.checked, manage: rights.manage.checked };
    S.vault.users.push(u);
    S.sel = name; say("Account created. Write the password down now: " + p.value + " (it can't be shown again). Then unlock pages below.", "ok");
    change();
  };
  return h("div", { class: "card" }, [h("h2", { text: "New account" }),
    h("label", { text: "Username" }), n, h("label", { text: "Password" }), p,
    h("label", { text: "Account type" }), type, rbox,
    h("div", { class: "row", style: "margin-top:12px" }, [gen, add]),
    h("p", { class: "mu", text: "New accounts start with every page locked. An account admin can only give other people pages that the account admin can open themselves." })]);
}

function settingsCard() {
  var u = findUser(S.sel);
  if (!u) { S.sel = null; return accountsCard(); }
  var c = h("div", { class: "card" }, [
    h("div", { class: "row sp" }, [h("h2", { text: "Settings: " + u.name }), h("button", { class: "g", text: "← Back", on: { click: function () { S.sel = null; main(); } } })]),
    h("p", { class: "mu", text: "Status: " + (u.disabled ? "Disabled (cannot sign in once published)" : "Active") })]);
  c.appendChild(h("h2", { text: "Pages", style: "margin-top:16px" }));
  if (!topPages().length) c.appendChild(h("p", { class: "mu", text: "No pages yet. Add pages on the main screen." }));
  YEARS.forEach(function (y) {
    var list = topPages().filter(function (p) { return yearOf(p) === y[0]; });
    c.appendChild(h("h3", { class: "yh", text: y[1] + " subjects" }));
    if (!list.length) c.appendChild(h("p", { class: "mu", text: "No " + y[1] + " pages yet." }));
    list.forEach(function (pg) {
      var on = u.pages.indexOf(pg.id) >= 0, k = kids(pg.id).length;
      c.appendChild(h("div", { class: "pg" }, [
        h("div", {}, [h("b", { text: (pg.emoji || "") + " " + pg.title }), h("div", { class: on ? "ul" : "lk", text: (on ? "🔓 Unlocked" : "🔒 Locked") + (k ? " · includes " + k + " linked page" + (k > 1 ? "s" : "") + " (e.g. practice exams)" : "") })]),
        h("button", { class: on ? "d" : "", text: on ? "Lock" : "Unlock", on: { click: function () {
          u.pages = on ? u.pages.filter(function (x) { return x !== pg.id; }) : u.pages.concat(pg.id); change(); } } })]));
    });
  });
  // account admin rights
  var rights = rightsBoxes(u.admin);
  function setRights() { if (rights.create.checked || rights.manage.checked) u.admin = { create: rights.create.checked, manage: rights.manage.checked }; else delete u.admin; change(); }
  rights.create.onchange = setRights; rights.manage.onchange = setRights;
  c.appendChild(h("h2", { text: "Account admin", style: "margin-top:18px" }));
  c.appendChild(h("p", { class: "mu", text: "Tick a box to make this an account admin. They sign in at accountadmin.html with this username and password. They cannot see or change the page files, only accounts. Untick both to make it a normal account again." }));
  c.appendChild(rights.el);
  var np = h("input", { type: "text", autocomplete: "off" });
  var rs = h("button", { text: "Set new password" });
  rs.onclick = async function () {
    if (np.value.length < 8) return say("Password needs 8+ characters.", "er");
    rs.disabled = true; say("Working…", "wn");
    var s = await L.makeUserSecret(u.name, np.value);
    u.salt = s.salt; u.ku = s.ku; u.iter = s.iter;
    say("New password set: " + np.value + ". Old password stops working once you publish.", "ok"); change();
  };
  c.appendChild(h("h2", { text: "Password", style: "margin-top:18px" }));
  c.appendChild(h("div", { class: "row" }, [np, h("button", { class: "g", text: "Generate", on: { click: function () { np.value = genPass(); } } }), rs]));
  c.appendChild(h("div", { class: "row", style: "margin-top:18px" }, [
    h("button", { class: u.disabled ? "" : "d", text: u.disabled ? "Enable account" : "Disable account", on: { click: function () { u.disabled = !u.disabled; change(); } } }),
    h("button", { class: "d", text: "Delete account", on: { click: function () {
      if (confirm("Delete " + u.name + " for good?")) { S.vault.users = S.vault.users.filter(function (x) { return x !== u; }); S.sel = null; change(); } } } })]));
  return c;
}

function parentSelect(pg) {
  var sel = h("select", {}, [h("option", { value: "", text: "Nothing: this page has its own tile" })].concat(topPages().filter(function (x) { return x !== pg; }).map(function (x) { return h("option", { value: x.id, text: x.title + " (Year " + yearOf(x) + ")" }); })));
  sel.value = pg.parent || "";
  sel.onchange = function () {
    if (sel.value) { pg.parent = sel.value; kids(pg.id).forEach(function (k) { delete k.parent; }); S.vault.users.forEach(function (u) { u.pages = u.pages.filter(function (x) { return x !== pg.id; }); }); }
    else delete pg.parent;
    change();
  };
  return sel;
}
function yearSelect(pg) {
  var sel = h("select", {}, YEARS.map(function (y) { return h("option", { value: y[0], text: y[1] }); }));
  sel.value = yearOf(pg);
  sel.onchange = function () { pg.year = sel.value; kids(pg.id).forEach(function (k) { k.year = sel.value; }); change(); };
  return sel;
}

function pagesCard() {
  var c = h("div", { class: "card" }, [h("h2", { text: "Pages (" + S.vault.pages.length + ")" })]);
  YEARS.forEach(function (y) {
    var list = S.vault.pages.filter(function (p) { return yearOf(p) === y[0]; });
    c.appendChild(h("h3", { class: "yh", text: y[1] + " (" + list.length + " files)" }));
    list.forEach(function (pg) {
      var em = h("input", { type: "text", value: pg.emoji || "", maxlength: "4" }), ti = h("input", { type: "text", value: pg.title }), no = h("input", { type: "text", value: pg.note || "", placeholder: "Short description" });
      em.oninput = function () { pg.emoji = em.value; mark(); }; ti.oninput = function () { pg.title = ti.value; mark(); }; no.oninput = function () { pg.note = no.value; mark(); };
      var rep = h("input", { type: "file", accept: ".html,text/html" });
      rep.onchange = function () { if (rep.files[0]) rep.files[0].text().then(function (t) { pg.html = t; say("Replaced " + pg.id + ".html (" + Math.round(t.length / 1024) + " KB).", "ok"); change(); }); };
      c.appendChild(h("div", { class: "it" }, [
        h("div", { class: "row sp" }, [h("b", { text: pg.id + ".html" }),
          h("button", { class: "d", text: "Remove", on: { click: function () {
            if (!confirm("Remove " + pg.id + " and unlock it from every account?")) return;
            S.vault.pages = S.vault.pages.filter(function (x) { return x !== pg; });
            S.vault.pages.forEach(function (x) { if (x.parent === pg.id) delete x.parent; });
            S.vault.users.forEach(function (u) { u.pages = u.pages.filter(function (x) { return x !== pg.id; }); }); change(); } } })]),
        h("div", { class: "grid2", style: "margin-top:6px" }, [em, ti]), h("div", { style: "margin-top:8px" }, [no]),
        pg.parent ? null : h("label", { text: "Year" }), pg.parent ? null : yearSelect(pg),
        h("label", { text: "Belongs to (a linked page is unlocked together with that page, and has no tile of its own)" }), parentSelect(pg),
        h("label", { text: "Replace with a newer file" }), rep]));
    });
  });
  var ny = h("select", {}, YEARS.map(function (y) { return h("option", { value: y[0], text: y[1] }); }));
  var add = h("input", { type: "file", accept: ".html,text/html", multiple: "multiple" });
  add.onchange = function () {
    var jobs = Array.prototype.map.call(add.files, function (f) {
      var id = slug(f.name);
      if (!id || ["index", "admin", "login", "accountadmin", "listen"].indexOf(id) >= 0) { say("Skipped " + f.name + ": that name is reserved.", "er"); return null; }
      return f.text().then(function (t) {
        var m = t.match(/<title>([^<]*)<\/title>/i), title = (m && m[1].trim()) || id, ex = S.vault.pages.filter(function (x) { return x.id === id; })[0];
        if (ex) { ex.html = t; say("Updated " + id + ".", "ok"); } else S.vault.pages.push({ id: id, title: title, emoji: "📄", note: "", html: t, year: ny.value });
        return id;
      });
    }).filter(Boolean);
    Promise.all(jobs).then(function (ids) {
      // A new page named like "religion-exam-1.html" is linked to the page called "religion" automatically.
      var linked = [];
      ids.forEach(function (id) {
        var pg = S.vault.pages.filter(function (x) { return x.id === id; })[0];
        if (!pg || pg.parent) return;
        var par = topPages().filter(function (x) { return x !== pg && id.indexOf(x.id + "-") === 0; })[0];
        if (par && !kids(pg.id).length) { pg.parent = par.id; pg.year = yearOf(par); linked.push(id + " → " + par.id); S.vault.users.forEach(function (u) { u.pages = u.pages.filter(function (y) { return y !== id; }); }); }
      });
      if (linked.length) say("Linked automatically: " + linked.join(", ") + ". Check them under Pages › Belongs to.", "ok");
      change();
    });
  };
  c.appendChild(h("label", { text: "Add pages: first choose the year, then choose one or more .html files" })); c.appendChild(ny); c.appendChild(h("div", { style: "margin-top:8px" }, [add]));
  return c;
}

/* ---------- build, zip, publish ---------- */
async function afterPublish(f) {
  S.dirty = false; document.getElementById("dirty").style.display = "none";
  S.vault.rev = (S.vault.rev || 0) + 1;
  S.loaded = { "vault.enc": await L.gitSha(f["vault.enc"]), "accounts.enc": await L.gitSha(f["accounts.enc"]) };
}
function publishCard() {
  var zip = h("button", { text: "Build & download ZIP" });
  zip.onclick = async function () {
    zip.disabled = true; say("Locking pages…", "wn");
    try {
      var f = await L.build(S.vault, S.admin), a = h("a", { href: URL.createObjectURL(P.makeZip(f)), download: "year-ten-locked-site.zip" });
      document.body.appendChild(a); a.click(); a.remove(); await afterPublish(f);
      say("Done. Unzip it, then upload everything inside to GitHub (steps below).", "ok");
    } catch (e) { say("Build failed: " + e.message, "er"); }
    zip.disabled = false;
  };
  var repo = h("input", { type: "text", value: "Jakeclur/jakeclur.github.io" }), br = h("input", { type: "text", value: "main" }), tk = h("input", { type: "password", autocomplete: "off", placeholder: "github_pat_…" });
  var pub = h("button", { class: "g", text: "Publish to GitHub now" });
  pub.onclick = async function () {
    if (!tk.value) return say("Paste a GitHub token first (see the note below).", "er");
    pub.disabled = true; say("Locking pages…", "wn");
    try {
      var f = await L.build(S.vault, S.admin);
      var n = await P.publish({ repo: repo.value.trim(), branch: br.value.trim(), token: tk.value.trim(), files: f, expect: S.loaded, say: say });
      await afterPublish(f);
      say("Published " + n + " files. The live site updates in a minute or two.", "ok");
    } catch (e) { say("Publish failed: " + e.message, "er"); }
    pub.disabled = false;
  };
  return h("div", { class: "card" }, [h("h2", { text: "Publish" }),
    h("p", { class: "mu", text: "Changes only go live after you publish. Each publish also makes every old page key useless on the new files. If an account admin published after you opened this page, publishing stops so you do not undo their changes: reload and redo yours." }),
    h("div", { class: "row" }, [zip]),
    h("p", { class: "mu", text: "Upload by hand: unzip, open your repo on github.com, Add file → Upload files, drag in vault.enc, accounts.enc, access.json and the p folder, then Commit. If you removed a page, also delete its old file inside p/." }),
    h("h2", { text: "Or publish in one click", style: "margin-top:18px" }),
    h("label", { text: "Repository" }), repo, h("label", { text: "Branch" }), br, h("label", { text: "GitHub token" }), tk,
    h("p", { class: "mu", text: "Make one at github.com/settings/personal-access-tokens: only this repository, permission “Contents: Read and write”. It stays in this page's memory and is gone when you close the tab." }),
    h("div", { class: "row" }, [pub])]);
}

function adminPwCard() {
  var p1 = h("input", { type: "password", autocomplete: "new-password" }), go = h("button", { class: "g", text: "Change admin password" });
  go.onclick = async function () {
    if (p1.value.length < 12) return say("Use at least 12 characters.", "er");
    go.disabled = true; say("Working…", "wn"); S.admin = await L.newAdminKey(p1.value); p1.value = "";
    say("Admin password changed. Publish to save it.", "ok"); change();
  };
  return h("div", { class: "card" }, [h("h2", { text: "Admin password" }), h("label", { text: "New admin password (12+ characters)" }), p1, h("div", { class: "row", style: "margin-top:12px" }, [go])]);
}

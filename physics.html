const Q=(t,r,q,a)=>({t,r,q,a});
const D=[{"id": "M1", "wk": "Week 1", "title": "M1 Displacement–time graphs", "th": "<p>A <b>displacement–time graph</b> shows where an object is (relative to a starting point) at each moment. Displacement is a <b>vector</b>: its sign tells you the direction (for example north positive, south negative).</p>\n<div class=\"box\"><b>Reading the graph</b><ul><li><b>Gradient = velocity:</b> v = Δs/Δt (units m s⁻¹).</li><li><b>Flat line</b> = stationary (velocity 0).</li><li><b>Steeper line</b> = faster. A <b>negative gradient</b> means moving backwards (towards the origin or in the negative direction).</li><li><b>Straight line</b> = constant velocity. A <b>curve</b> = changing velocity (accelerating).</li><li><b>Average velocity</b> = total displacement ÷ total time.</li></ul></div>\n<div class=\"box\">⚠ The <i>height</i> of the graph is position, not speed. Work out velocity from the <i>slope</i>, and keep the sign: −6 m s⁻¹ is a different answer from 6 m s⁻¹.</div>", "qs": [{"t": "c", "r": "Q1", "q": "The graph shows an object's displacement. (a) Describe its motion. (b) Calculate the velocity between 5 and 6 seconds. (c) Calculate the velocity between 0 and 3 seconds.", "a": "(a) It starts 2 m behind the origin and moves forward at constant velocity until 3 s (reaching 6 m). It then stays still (6 m) from 3 to 5 s, then moves back to the origin, arriving at 6 s.<br>(b) v = Δs/Δt = (0 − 6)/(6 − 5) = −6 m s⁻¹ (moving backwards).<br>(c) v = (6 − (−2))/(3 − 0) = 8/3 = 2.7 m s⁻¹ (forwards).", "fig": "<svg viewBox=\"0 0 380 240\" role=\"img\" aria-label=\"Displacement-time graph: from -2 m to 6 m at 3 s, flat to 5 s, back to 0 m at 6 s\" style=\"max-width:380px;width:100%;height:auto;display:block;margin:6px 0;font:11px system-ui,sans-serif\"><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"98.3\" y1=\"200.0\" x2=\"98.3\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"146.6\" y1=\"200.0\" x2=\"146.6\ ts=\"50.0,151.3 108.6,48.3 137.9,48.3 284.4,220.0 372.3,151.3\"/><circle cx=\"50.0\" cy=\"151.3\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"108.6\" cy=\"48.3\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"137.9\" cy=\"48.3\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"284.4\" cy=\"220.0\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"372.3\" cy=\"151.3\" r=\"3\" fill=\"#8b6cff\"/></svg>"}, {"t": "c", "r": "Q5", "q": "A student walks at a constant 1.5 m s⁻¹ for 20 s, stands still for 10 s, then walks back to the start at 1.0 m s⁻¹. Sketch the displacement–time graph and find the total time of the trip.", "a": "Walk out: 1.5 × 20 = 30 m, so the line rises from (0, 0) to (20, 30). Stand still: flat from 20 s to 30 s. Walk back: time = 30/1.0 = 30 s, so the line falls from (30 s, 30 m) to (60 s, 0 m).<br>Total time = 20 + 10 + 30 = 60 s.", "afig": "<svg viewBox=\"0 0 380 240\" role=\"img\" aria-label=\"Sketch: rises to 30 m at 20 s, flat to 30 s, falls to 0 at 60 s\" style=\"max-width:380px;width:100%;height:auto;display:block;margin:6px 0;font:11px system-ui,sans-serif\"><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"100.6\" y1=\"200.0\" x2=\"100.6\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"151.3\" y1=\"200.0\" x2=\"151.3\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"201.9\" y1=\"200.0\" x2=\"201.9\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"252.6\" y1=\"200.0\" x2=\"252.6\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"303.2\" y1=\"200.0\" x2=\"303.2\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"353.9\" y1=\"200.0\" x2=\"353.9\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"200.0\" x2=\"364.0\" y2=\"200.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"146.9\" x2=\"364.0\" y2=\"146.9\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"93.7\" x2=\"364.0\" y2=\"93.7\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"40.6\" x2=\"364.0\" y2=\"40.6\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"200.0\" x2=\"364.0\" y2=\"200.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"50.0\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">0</text><text x=\"100.6\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">10</text><text x=\"151.3\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">20</text><text x=\"201.9\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">30</text><text x=\"252.6\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">40</text><text x=\"303.2\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">50</text><text x=\"353.9\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">60</text><text x=\"44.0\" y=\"204.0\" text-anchor=\"end\" fill=\"currentColor\">0</text><text x=\"44.0\" y=\"150.9\" text-anchor=\"end\" fill=\"currentColor\">10</text><text x=\"44.0\" y=\"97.7\" text-anchor=\"end\" fill=\"currentColor\">20</text><text x=\"44.0\" y=\"44.6\" text-anchor=\"end\" fill=\"currentColor\">30</text><text x=\"207.0\" y=\"236\" text-anchor=\"middle\" fill=\"currentColor\">time (s)</text><text x=\"12\" y=\"107.0\" text-anchor=\"middle\" fill=\"currentColor\" transform=\"rotate(-90 12 107.0)\">s (m)</text><polyline fill=\"none\" stroke=\"#8b6cff\" stroke-width=\"2.6\" stroke-linejoin=\"round\" points=\"50.0,200.0 151.3,40.6 201.9,40.6 353.9,200.0\"/><circle cx=\"50.0\" cy=\"200.0\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"151.3\" cy=\"40.6\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"201.9\" cy=\"40.6\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"353.9\" cy=\"200.0\" r=\"3\" fill=\"#8b6cff\"/></svg>"}], "np": true}, {"id": "M2", "wk": "Week 2", "title": "M2 Velocity–time graphs", "th": "<p>A <b>velocity–time graph</b> shows how fast an object moves, and in which direction, at each moment.</p>\n<div class=\"box\"><b>Reading the graph</b><ul><li><b>Gradient = acceleration:</b> a = Δv/Δt (units m s⁻²).</li><li><b>Area under the graph = displacement</b> (use rectangles and triangles; area below the axis counts as negative).</li><li><b>Flat line</b> = constant velocity (zero acceleration). <b>Sloping line</b> = constant acceleration.</li><li><b>Crossing the time axis</b> = the object turns round (velocity changes sign).</li><li>Moving away from the axis = speeding up; moving towards the axis = slowing down.</li></ul></div>\n<div class=\"box\">⚠ A downward-sloping line is <i>not</i> always “going down”. It means the velocity is decreasing: the object might be slowing down, or speeding up in the negative direction.</div>", "qs": [{"t": "c", "r": "Q1", "q": "The v–t graph shows a straight line from the origin to 20 m s⁻¹ at 5 s. (a) Calculate the gradient. (b) What does the gradient represent? (c) Describe the motion between 0 and 4 s. (d) Calculate the area under the graph between 0 and 4 s. (e) What does the area represent?", "a": "(a) Gradient = (20 − 0)/(5 − 0) = 4 m s⁻².<br>(b) Acceleration.<br>(c) Starts from rest and speeds up at a constant 4 m s⁻², reaching 16 m s⁻¹ at 4 s.<br>(d) Triangle: ½ × 4 × 16 = 32 m.<br>(e) The displacement (distance travelled in a straight line) in those 4 s.", "fig": "<svg viewBox=\"0 0 380 240\" role=\"img\" aria-label=\"Velocity-time graph: straight line from 0 to 20 m s⁻¹ in 5 s\" style=\"max-width:380px;width:100%;height:auto;display:block;margin:6px 0;font:11px system-ui,sans-serif\"><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"107.1\" y1=\"200.0\" x2=\"107.1\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"164.2\" y1=\"200.0\" x2=\"164.2\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"221.3\" y1=\"200.0\" x2=\"221.3\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"278.4\" y1=\"200.0\" x2=\"278.4\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"335.5\" y1=\"200.0\" x2=\"335.5\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"200.0\" x2=\"364.0\" y2=\"200.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"166.2\" x2=\"364.0\" y2=\"166.2\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"132.4\" x2=\"364.0\" y2=\"132.4\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"98.5\" x2=\"364.0\" y2=\"98.5\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"64.7\" x2=\"364.0\" y2=\"64.7\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"30.9\" x2=\"364.0\" y2=\"30.9\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"200.0\" x2=\"364.0\" y2=\"200.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"50.0\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">0</text><text x=\"107.1\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">1</text><text x=\"164.2\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">2</text><text x=\"221.3\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">3</text><text x=\"278.4\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">4</text><text x=\"335.5\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">5</text><text x=\"44.0\" y=\"204.0\" text-anchor=\"end\" fill=\"currentColor\">0</text><text x=\"44.0\" y=\"170.2\" text-anchor=\"end\" fill=\"currentColor\">4</text><text x=\"44.0\" y=\"136.4\" text-anchor=\"end\" fill=\"currentColor\">8</text><text x=\"44.0\" y=\"102.5\" text-anchor=\"end\" fill=\"currentColor\">12</text><text x=\"44.0\" y=\"68.7\" text-anchor=\"end\" fill=\"currentColor\">16</text><text x=\"44.0\" y=\"34.9\" text-anchor=\"end\" fill=\"currentColor\">20</text><text x=\"207.0\" y=\"236\" text-anchor=\"middle\" fill=\"currentColor\">time (s)</text><text x=\"12\" y=\"107.0\" text-anchor=\"middle\" fill=\"currentColor\" transform=\"rotate(-90 12 107.0)\">velocity (m s⁻¹)</text><polyline fill=\"none\" stroke=\"#8b6cff\" stroke-width=\"2.6\" stroke-linejoin=\"round\" points=\"50.0,200.0 335.5,30.9\"/><circle cx=\"50.0\" cy=\"200.0\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"335.5\" cy=\"30.9\" r=\"3\" fill=\"#8b6cff\"/></svg>"}, {"t": "c", "r": "Q2", "q": "Describe the motion shown by each of these v–t graphs (A to D).", "a": "A: starts with a positive velocity and speeds up at a constant rate (constant positive acceleration).<br>B: constant velocity, so zero acceleration.<br>C: starts moving forwards, slows down uniformly to rest, then reverses and speeds up in the opposite direction (constant negative acceleration throughout).<br>D: moving forwards and slowing down at a constant rate (constant deceleration).", "fig": "<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start\"><svg viewBox=\"0 0 150 120\" role=\"img\" aria-label=\"starts positive and increases steadily\" style=\"width:150px;max-width:100%;height:auto;font:12px system-ui,sans-serif\"><line x1=\"26.0\" y1=\"98.0\" x2=\"26.0\" y2=\"10.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"26.0\" y1=\"98.0\" x2=\"140.0\" y2=\"98.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"18.0\" y=\"18.0\" fill=\"currentColor\">v</text><text x=\"134.0\" y=\"112.0\" fill=\"currentColor\">t</text><polyline fill=\"none\" stroke=\"#8b6cff\" stroke-width=\"2.6\" points=\"26.0,71.6 140.0,18.8\"/></svg><div style='text-align:center'>A</div><svg viewBox=\"0 0 150 120\" role=\"img\" aria-label=\"constant positive velocity\" style=\"width:150px;max-width:100%;height:auto;font:12px system-ui,sans-serif\"><line x1=\"26.0\" y1=\"98.0\" x2=\"26.0\" y2=\"10.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"26.0\" y1=\"98.0\" x2=\"140.0\" y2=\"98.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"18.0\" y=\"18.0\" fill=\"currentColor\">v</text><text x=\"134.0\" y=\"112.0\" fill=\"currentColor\">t</text><polyline fill=\"none\" stroke=\"#8b6cff\" stroke-width=\"2.6\" points=\"26.0,54.0 140.0,54.0\"/></svg><div style='text-align:center'>B</div><svg viewBox=\"0 0 150 120\" role=\"img\" aria-label=\"starts positive, decreases through zero to negative\" style=\"width:150px;max-width:100%;height:auto;font:12px system-ui,sans-serif\"><line x1=\"26.0\" y1=\"98.0\" x2=\"26.0\" y2=\"10.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"26.0\" y1=\"54.0\" x2=\"140.0\" y2=\"54.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"18.0\" y=\"18.0\" fill=\"currentColor\">v</text><text x=\"134.0\" y=\"68.0\" fill=\"currentColor\">t</text><polyline fill=\"none\" stroke=\"#8b6cff\" stroke-width=\"2.6\" points=\"26.0,17.3 140.0,90.7\"/></svg><div style='text-align:center'>C</div><svg viewBox=\"0 0 150 120\" role=\"img\" aria-label=\"positive velocity decreasing steadily\" style=\"width:150px;max-width:100%;height:auto;font:12px system-ui,sans-serif\"><line x1=\"26.0\" y1=\"98.0\" x2=\"26.0\" y2=\"10.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"26.0\" y1=\"98.0\" x2=\"140.0\" y2=\"98.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"18.0\" y=\"18.0\" fill=\"currentColor\">v</text><text x=\"134.0\" y=\"112.0\" fill=\"currentColor\">t</text><polyline fill=\"none\" stroke=\"#8b6cff\" stroke-width=\"2.6\" points=\"26.0,45.2 140.0,84.8\"/></svg><div style='text-align:center'>D</div></div>"}, {"t": "c", "r": "Q3", "q": "Use the v–t graph (points A to E). (a) Calculate the acceleration between 0 and 10 s. (b) Calculate the acceleration between 15 and 40 s. (c) Describe the motion throughout the journey.", "a": "(a) a = (60 − 0)/10 = 6 m s⁻².<br>(b) a = (−40 − 60)/(40 − 15) = −100/25 = −4 m s⁻².<br>(c) Speeds up from rest to 60 m s⁻¹ in 10 s (O to A); constant velocity 60 m s⁻¹ for 5 s (A to B); slows uniformly to rest at 30 s (B to C); reverses and speeds up to 40 m s⁻¹ in the opposite direction at 40 s (C to D); then slows to rest at 55 s (D to E).", "fig": "<svg viewBox=\"0 0 400 260\" role=\"img\" aria-label=\"Velocity-time graph with points A to E\" style=\"max-width:400px;width:100%;height:auto;display:block;margin:6px 0;font:11px system-ui,sans-serif\"><line x1=\"50.0\" y1=\"220.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"108.6\" y1=\"220.0\" x2=\"108.6\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"167.2\" y1=\"220.0\" x2=\"167.2\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"225.8\" y1=\"220.0\" x2=\"225.8\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"284.4\" y1=\"220.0\" x2=\"284.4\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"343.0\" y1=\"220.0\" x2=\"343.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"220.0\" x2=\"384.0\" y2=\"220.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"185.7\" x2=\"384.0\" y2=\"185.7\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"151.3\" x2=\"384.0\" y2=\"151.3\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"117.0\" x2=\"384.0\" y2=\"117.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"82.7\" x2=\"384.0\" y2=\"82.7\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"48.3\" x2=\"384.0\" y2=\"48.3\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"14.0\" x2=\"384.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"151.3\" x2=\"384.0\" y2=\"151.3\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"50.0\" y1=\"220.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"50.0\" y=\"234.0\" text-anchor=\"middle\" fill=\"currentColor\">0</text><text x=\"108.6\" y=\"234.0\" text-anchor=\"middle\" fill=\"currentColor\">10</text><text x=\"167.2\" y=\"234.0\" text-anchor=\"middle\" fill=\"currentColor\">20</text><text x=\"225.8\" y=\"234.0\" text-anchor=\"middle\" fill=\"currentColor\">30</text><text x=\"284.4\" y=\"234.0\" text-anchor=\"middle\" fill=\"currentColor\">40</text><text x=\"343.0\" y=\"234.0\" text-anchor=\"middle\" fill=\"currentColor\">50</text><text x=\"44.0\" y=\"224.0\" text-anchor=\"end\" fill=\"currentColor\">-40</text><text x=\"44.0\" y=\"189.7\" text-anchor=\"end\" fill=\"currentColor\">-20</text><text x=\"44.0\" y=\"155.3\" text-anchor=\"end\" fill=\"currentColor\">0</text><text x=\"44.0\" y=\"121.0\" text-anchor=\"end\" fill=\"currentColor\">20</text><text x=\"44.0\" y=\"86.7\" text-anchor=\"end\" fill=\"currentColor\">40</text><text x=\"44.0\" y=\"52.3\" text-anchor=\"end\" fill=\"currentColor\">60</text><text x=\"44.0\" y=\"18.0\" text-anchor=\"end\" fill=\"currentColor\">80</text><text x=\"217.0\" y=\"256\" text-anchor=\"middle\" fill=\"currentColor\">time (s)</text><text x=\"12\" y=\"117.0\" text-anchor=\"middle\" fill=\"currentColor\" transform=\"rotate(-90 12 117.0)\">velocity (m s⁻¹)</text><polyline fill=\"none\" stroke=\"#8b6cff\" stroke-width=\"2.6\" stroke-linejoin=\"round\" points=\"50.0,151.3 108.6,48.3 137.9,48.3 225.8,151.3 284.4,220.0 372.3,151.3\"/><circle cx=\"50.0\" cy=\"151.3\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"108.6\" cy=\"48.3\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"137.9\" cy=\"48.3\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"225.8\" cy=\"151.3\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"284.4\" cy=\"220.0\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"372.3\" cy=\"151.3\" r=\"3\" fill=\"#8b6cff\"/><text x=\"113.6\" y=\"41.3\" fill=\"currentColor\" font-weight=\"700\" font-size=\"13\">A</text><text x=\"142.9\" y=\"41.3\" fill=\"currentColor\" font-weight=\"700\" font-size=\"13\">B</text><text x=\"230.8\" y=\"144.3\" fill=\"currentColor\" font-weight=\"700\" font-size=\"13\">C</text><text x=\"289.4\" y=\"213.0\" fill=\"currentColor\" font-weight=\"700\" font-size=\"13\">D</text><text x=\"377.3\" y=\"144.3\" fill=\"currentColor\" font-weight=\"700\" font-size=\"13\">E</text></svg>"}, {"t": "c", "r": "Q4", "q": "Using the graph in Q3, find the displacement between 0 and 30 s and between 30 and 55 s. Where is the object at 55 s relative to the start?", "a": "0–30 s (area above the axis): triangle 0–10 s: ½ × 10 × 60 = 300 m; rectangle 10–15 s: 5 × 60 = 300 m; triangle 15–30 s: ½ × 15 × 60 = 450 m. Total = 1050 m.<br>30–55 s (below the axis): triangle 30–40 s: ½ × 10 × 40 = 200 m; triangle 40–55 s: ½ × 15 × 40 = 300 m. Total = −500 m.<br>Net displacement = 1050 − 500 = 550 m forwards of the start."}, {"t": "c", "r": "Q5", "q": "A ball is thrown up vertically (take up as positive). Represent its motion as a velocity–time graph.", "a": "The ball leaves with a positive velocity (say 20 m s⁻¹). Gravity gives a constant acceleration of −9.8 m s⁻² (about −10), so the graph is a single straight line sloping down with gradient −9.8 m s⁻². It crosses the time axis at the top of the flight (v = 0) and carries on into negative velocities as the ball falls back. The area above the axis (upward distance) equals the area below it (downward distance) if it lands where it started.", "afig": "<svg viewBox=\"0 0 380 240\" role=\"img\" aria-label=\"Ball thrown up: velocity falls in a straight line from +20 to -20\" style=\"max-width:380px;width:100%;height:auto;display:block;margin:6px 0;font:11px system-ui,sans-serif\"><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"121.4\" y1=\"200.0\" x2=\"121.4\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"192.7\" y1=\"200.0\" x2=\"192.7\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"264.1\" y1=\"200.0\" x2=\"264.1\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"335.5\" y1=\"200.0\" x2=\"335.5\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"181.4\" x2=\"364.0\" y2=\"181.4\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"144.2\" x2=\"364.0\" y2=\"144.2\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"107.0\" x2=\"364.0\" y2=\"107.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"69.8\" x2=\"364.0\" y2=\"69.8\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"32.6\" x2=\"364.0\" y2=\"32.6\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"107.0\" x2=\"364.0\" y2=\"107.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"50.0\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">0</text><text x=\"121.4\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">1</text><text x=\"192.7\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">2</text><text x=\"264.1\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">3</text><text x=\"335.5\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">4</text><text x=\"44.0\" y=\"185.4\" text-anchor=\"end\" fill=\"currentColor\">-20</text><text x=\"44.0\" y=\"148.2\" text-anchor=\"end\" fill=\"currentColor\">-10</text><text x=\"44.0\" y=\"111.0\" text-anchor=\"end\" fill=\"currentColor\">0</text><text x=\"44.0\" y=\"73.8\" text-anchor=\"end\" fill=\"currentColor\">10</text><text x=\"44.0\" y=\"36.6\" text-anchor=\"end\" fill=\"currentColor\">20</text><text x=\"207.0\" y=\"236\" text-anchor=\"middle\" fill=\"currentColor\">time (s)</text><text x=\"12\" y=\"107.0\" text-anchor=\"middle\" fill=\"currentColor\" transform=\"rotate(-90 12 107.0)\">velocity (m s⁻¹)</text><polyline fill=\"none\" stroke=\"#8b6cff\" stroke-width=\"2.6\" stroke-linejoin=\"round\" points=\"50.0,32.6 192.7,107.0 335.5,181.4\"/><circle cx=\"50.0\" cy=\"32.6\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"192.7\" cy=\"107.0\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"335.5\" cy=\"181.4\" r=\"3\" fill=\"#8b6cff\"/></svg>"}], "np": true}, {"id": "M3", "wk": "Week 2", "title": "M3 Equations of motion (constant acceleration)", "th": "<p>When acceleration is <b>constant (uniform)</b> along a straight line, five variables describe the motion: displacement <b>s</b> (m), initial velocity <b>u</b>, final velocity <b>v</b> (m s⁻¹), acceleration <b>a</b> (m s⁻²) and time <b>t</b> (s). Each equation leaves out one variable:</p>\n<div class=\"box\"><ul><li><b>v = u + at</b> (no s)</li><li><b>s = ½(u + v)t</b> (no a)</li><li><b>s = ut + ½at²</b> (no v)</li><li><b>v² = u² + 2as</b> (no t)</li><li><b>s = vt − ½at²</b> (no u)</li></ul></div>\n<p><b>VEERS method:</b> <b>V</b>ariables (list them in SI units), <b>E</b>quation (the one with your variables), <b>E</b>nter the values, <b>R</b>earrange for the unknown, <b>S</b>olve with units.</p>\n<div class=\"box\">⚠ Convert units first (km h⁻¹ ÷ 3.6 = m s⁻¹). Slowing down means a is <i>negative</i> (or give “deceleration” as a positive number). “From rest” means u = 0; “comes to rest” means v = 0.</div>", "qs": [{"t": "c", "r": "W2 Q1", "q": "A car is travelling at 12 m s⁻¹. At t = 0 it accelerates at 1.5 m s⁻² to a speed of 18 m s⁻¹. (a) Calculate the time taken to reach 18 m s⁻¹. (b) Calculate how far the car travels in this time. (c) Calculate the car's speed when it has travelled 100 m.", "a": "u = 12, v = 18, a = 1.5.<br>(a) t = (v − u)/a = 6/1.5 = 4 s.<br>(b) s = ½(u + v)t = ½ × 30 × 4 = 60 m.<br>(c) v² = u² + 2as = 144 + 2(1.5)(100) = 444, so v = 21 m s⁻¹ (if it keeps accelerating)."}, {"t": "c", "r": "W2 Q2", "q": "A skier accelerates away at 2.0 m s⁻² from rest. (a) How fast is she going after 5.0 s? (b) How far has she gone after 5.0 s? (c) How far does she travel to reach 24 m s⁻¹? (d) She brakes from 24 m s⁻¹ to a halt over a measured 30 m. Calculate her deceleration. (e) How would she experience the “g-force” of this deceleration?", "a": "(a) v = u + at = 0 + 2.0 × 5.0 = 10 m s⁻¹.<br>(b) s = ½at² = ½ × 2.0 × 25 = 25 m.<br>(c) s = v²/(2a) = 576/4 = 144 m.<br>(d) 0 = 24² + 2a(30) ⇒ a = −576/60 = −9.6 m s⁻² (deceleration 9.6 m s⁻²).<br>(e) 9.6/9.8 ≈ 0.98 g: she feels pushed forwards (against her harness or the ground) with a force about equal to her own weight, because her body tries to keep moving."}, {"t": "c", "r": "W2 Q3", "q": "A stationary ball starts to accelerate down a slope at 0.40 m s⁻². (a) How long to reach 1.0 m s⁻¹? (b) How long to travel 1.8 m down the slope? (c) The ball then rolls along the flat, slowing from 1.6 m s⁻¹ to a stop with deceleration 0.15 m s⁻². How far does it go? (d) Name the three forces on the ball as it travels along the flat.", "a": "(a) t = v/a = 1.0/0.40 = 2.5 s.<br>(b) s = ½at² ⇒ t = √(2s/a) = √(3.6/0.40) = 3.0 s.<br>(c) s = (v² − u²)/(2a) = (0 − 2.56)/(−0.30) = 8.5 m.<br>(d) Weight (down), normal force from the surface (up) and friction (backwards, opposing motion). Weight and normal force balance."}, {"t": "c", "r": "W2 Q4", "q": "A rail car accelerates from rest to 12 m s⁻¹ in 48 s. (a) Calculate the acceleration. (b) Calculate the distance travelled. (c) The car then brakes to a stop in 16 s: calculate its deceleration. (d) Calculate the distance travelled while braking.", "a": "(a) a = 12/48 = 0.25 m s⁻².<br>(b) s = ½(0 + 12)(48) = 288 m.<br>(c) a = (0 − 12)/16 = −0.75 m s⁻² (deceleration 0.75 m s⁻²).<br>(d) s = ½(12 + 0)(16) = 96 m."}, {"t": "c", "r": "W2 Q5", "q": "A driver is travelling steadily at 12 m s⁻¹ when he spots a dog 48 m ahead. After a reaction time of 0.75 s he applies the brakes, which give a steady deceleration of 2.0 m s⁻². (a) How far does he travel during his reaction time? (b) How far does he travel while braking? (c) What happens to the dog?", "a": "(a) Constant speed: s = vt = 12 × 0.75 = 9.0 m.<br>(b) v² = u² + 2as ⇒ 0 = 144 − 4s ⇒ s = 36 m.<br>(c) Total stopping distance = 9 + 36 = 45 m, which is less than 48 m, so the car stops 3 m short and the dog is safe."}, {"t": "h", "r": "FQ1 Q13", "q": "A car starts from rest and travels at 2 m s⁻² for 10 s. Find (a) the final velocity and (b) the distance travelled.", "a": "(a) v = at = 2 × 10 = 20 m s⁻¹.<br>(b) s = ½at² = ½ × 2 × 100 = 100 m."}, {"t": "h", "r": "FQ1 Q14", "q": "A bus with uniform acceleration has an instant speed of 6 m s⁻¹. Five seconds later it has reached 36 m s⁻¹. Find (a) the acceleration and (b) the distance travelled in the 5 s.", "a": "(a) a = (36 − 6)/5 = 6 m s⁻².<br>(b) s = ½(6 + 36)(5) = 105 m."}, {"t": "h", "r": "FQ1 Q15", "q": "A boat starts from rest with a uniform acceleration of 2 m s⁻². Calculate the time and distance to reach 20 m s⁻¹.", "a": "t = v/a = 20/2 = 10 s. s = ½(0 + 20)(10) = 100 m."}, {"t": "h", "r": "FQ1 Q16", "q": "A car with velocity 12 m s⁻¹ takes 6 s to come to rest when the brakes are applied. Find (a) its acceleration, (b) its deceleration and (c) the distance it covers in coming to rest.", "a": "(a) a = (0 − 12)/6 = −2 m s⁻².<br>(b) The deceleration is 2 m s⁻².<br>(c) s = ½(12 + 0)(6) = 36 m."}, {"t": "h", "r": "FQ1 Q17", "q": "An aeroplane starting from rest is uniformly accelerated for 20 s so that it leaves the runway at 80 m s⁻¹. Estimate the shortest possible runway length.", "a": "s = ½(u + v)t = ½(0 + 80)(20) = 800 m."}, {"t": "h", "r": "FQ2 Q5", "q": "An archer can fire an arrow at 390 m s⁻¹. What time would an arrow take to hit a target 100 m away?", "a": "Constant speed: t = d/v = 100/390 = 0.26 s."}, {"t": "h", "r": "FQ2 Q6", "q": "The highest speed on land in a car is 1190.4 km h⁻¹ (Stan Barrett, 1979). What time would it take to cover the 1.6 km test distance?", "a": "Convert: 1190.4 ÷ 3.6 = 330.7 m s⁻¹ and 1.6 km = 1600 m. t = 1600/330.7 = 4.8 s."}, {"t": "h", "r": "FQ2 Q7", "q": "A person rides a bicycle 300 m north along a straight road and then 400 m west. The trip takes 3 minutes. Find (a) the average speed and (b) the average velocity.", "a": "(a) Speed uses total distance: 700 m ÷ 180 s = 3.9 m s⁻¹.<br>(b) Velocity uses displacement: √(300² + 400²) = 500 m, so 500/180 = 2.8 m s⁻¹ in a direction about 53° west of north."}, {"t": "h", "r": "FQ2 Q8", "q": "A Ferrari covers 400 m from a standing start in 14.2 s, crossing the line at 203 km h⁻¹. What is its average speed?", "a": "Average speed = distance ÷ time = 400/14.2 = 28 m s⁻¹ (about 101 km h⁻¹). The 203 km h⁻¹ is its final speed, not the average."}, {"t": "h", "r": "FQ2 Q13", "q": "A Ferrari F40 goes from 0 to 96.5 km h⁻¹ (26.8 m s⁻¹) in 3.98 s. Calculate its acceleration.", "a": "a = (v − u)/t = 26.8/3.98 = 6.7 m s⁻²."}, {"t": "h", "r": "FQ2 Q14", "q": "A rocket-engined car reaches 290 m s⁻¹ from rest with acceleration 4.2 m s⁻². How many seconds does this take?", "a": "t = (v − u)/a = 290/4.2 = 69 s."}, {"t": "h", "r": "FQ2 Q15", "q": "A rattlesnake's head accelerates at 50 m s⁻². How long would a car take to reach 27 m s⁻¹ from rest at that acceleration?", "a": "t = v/a = 27/50 = 0.54 s."}, {"t": "h", "r": "FQ2 Q16", "q": "A muon enters an electric field at 5.00 × 10⁶ m s⁻¹ and decelerates at 1.25 × 10¹⁴ m s⁻². How long until it stops?", "a": "t = (0 − 5.00 × 10⁶)/(−1.25 × 10¹⁴) = 4 × 10⁻⁸ s."}, {"t": "h", "r": "FQ2 Q22", "q": "A cyclist starts from rest and reaches 21 m s⁻¹ in 3.5 s. Calculate (a) the acceleration, (b) the displacement.", "a": "(a) a = 21/3.5 = 6.0 m s⁻².<br>(b) s = ½(0 + 21)(3.5) = 36.75 m (about 37 m)."}, {"t": "h", "r": "FQ2 Q23", "q": "A bus accelerates from 60 km h⁻¹ to 100 km h⁻¹ in 1 minute. Calculate the acceleration in m s⁻².", "a": "Δv = 40 km h⁻¹ = 40 ÷ 3.6 = 11.1 m s⁻¹. a = 11.1/60 = 0.19 m s⁻²."}, {"t": "h", "r": "FQ2 Q24", "q": "A click beetle accelerates at 24 000 m s⁻² over a distance of 5 mm. For what time does this acceleration occur?", "a": "s = 0.005 m, u = 0: s = ½at² ⇒ t = √(2s/a) = √(0.010/24 000) = 6.5 × 10⁻⁴ s (0.65 ms)."}, {"t": "h", "r": "Practice 2", "q": "A cyclist accelerates uniformly down a hill from 5.00 m s⁻¹, travelling 30.0 m to reach 18.0 m s⁻¹. Choose an equation and find the acceleration.", "a": "No time is given, so use v² = u² + 2as: a = (18.0² − 5.00²)/(2 × 30.0) = (324 − 25)/60 = 5.0 m s⁻²."}, {"t": "h", "r": "Practice 8", "q": "A new-model car accelerates uniformly from rest and covers 400.0 m in 16 s. (a) Find the average acceleration. (b) Find the final speed in m s⁻¹. (c) Convert it to km h⁻¹.", "a": "(a) s = ½at² ⇒ a = 2s/t² = 800/256 = 3.1 m s⁻².<br>(b) v = at = 3.125 × 16 = 50 m s⁻¹.<br>(c) 50 × 3.6 = 180 km h⁻¹."}, {"t": "h", "r": "Practice 10", "q": "A rocket accelerates uniformly from rest to 160 m s⁻¹ in 4.0 s, then travels at a constant 160 m s⁻¹ for 5.0 s. (a) Initial acceleration? (b) Distance in the 9.0 s (in km)? (c) Final speed in km h⁻¹? (d) Average speed over the first 4.0 s? (e) Average speed over the 9.0 s?", "a": "(a) a = 160/4.0 = 40 m s⁻².<br>(b) 4.0 s: ½(0 + 160)(4) = 320 m; next 5.0 s: 160 × 5 = 800 m. Total 1120 m = 1.1 km.<br>(c) 160 × 3.6 = 576 km h⁻¹.<br>(d) 320/4 = 80 m s⁻¹.<br>(e) 1120/9 = 124 m s⁻¹ (about 120 m s⁻¹)."}, {"t": "h", "r": "Practice 11", "q": "While overtaking, Ben increases his speed uniformly from 4.2 m s⁻¹ to 6.7 m s⁻¹ east over 0.50 s. (a) Calculate his average acceleration. (b) How far does he travel while overtaking? (c) What is his average speed during this time?", "a": "(a) a = (6.7 − 4.2)/0.50 = 5.0 m s⁻² east.<br>(b) s = ½(4.2 + 6.7)(0.50) = 2.7 m.<br>(c) Average speed = 2.725/0.50 = 5.5 m s⁻¹."}, {"t": "h", "r": "Practice 13", "q": "A car travels at 75 km h⁻¹ east. The driver's reaction time is 0.25 s, and then the car brakes at −6.0 m s⁻² to a stop. (a) Initial speed in m s⁻¹? (b) Distance travelled during the reaction time? (c) Distance while braking? (d) Total distance from first noticing the danger to the stop?", "a": "(a) 75 ÷ 3.6 = 20.8 m s⁻¹ (about 21).<br>(b) 20.8 × 0.25 = 5.2 m.<br>(c) s = (0 − 20.8²)/(2 × −6.0) = 36 m.<br>(d) 5.2 + 36 = 41 m."}], "np": true}, {"id": "M4", "wk": "Week 1", "title": "M4 Motion under gravity", "th": "<p>Near Earth's surface every freely falling object has the same acceleration due to gravity, <b>g = 9.8 m s⁻²</b> downwards (some worksheets use 10 m s⁻² for easy numbers; check the question). The gravitational field strength is 9.8 N kg⁻¹, and the <b>weight force</b> is <b>W = mg</b>.</p>\n<div class=\"box\"><b>Method for vertical motion</b><ul><li>Pick a sign convention. Common choice: <b>up = +, so a = −9.8 m s⁻²</b> (even while the object is rising).</li><li>Use the same equations as M3 with a = −g.</li><li>At the <b>top</b> of the flight v = 0, but the acceleration is still −9.8 m s⁻².</li><li>Thrown up and landing at the same height: time up = time down, and landing speed = launch speed.</li><li>Mass does not change the fall time (ignoring air resistance).</li></ul></div>\n<div class=\"box\">⚠ “v = 0 at the top” does <i>not</i> mean a = 0. And the force just before landing is still the weight, mg.</div>", "qs": [{"t": "c", "r": "W1 Q1", "q": "A boy drops a stone down a mine shaft 45 m deep. Use an equation of motion with g = −9.8 m s⁻². (a) How long does the stone take to reach the bottom? (b) What is its speed at the bottom? (c) How far does it fall in 1.5 s?", "a": "Take down as the direction of motion: u = 0, s = 45 m, a = 9.8 m s⁻².<br>(a) t = √(2s/a) = √(90/9.8) = 3.0 s.<br>(b) v = √(2as) = √(2 × 9.8 × 45) = 29.7 m s⁻¹ (about 30, downwards).<br>(c) s = ½at² = ½ × 9.8 × 1.5² = 11 m."}, {"t": "c", "r": "W1 Q2", "q": "A 1 kg object is dropped from a tower 120 m high. (a) Calculate the time to fall to the ground. (b) How long would a 10 kg object take? (c) Find the final speed on reaching the ground. (d) How long does it take to reach a speed of 35 m s⁻¹?", "a": "(a) t = √(2 × 120/9.8) = 4.95 s.<br>(b) The same, 4.95 s: all masses fall together when air resistance is ignored.<br>(c) v = √(2 × 9.8 × 120) = 48.5 m s⁻¹ (or v = gt = 9.8 × 4.95).<br>(d) t = v/g = 35/9.8 = 3.6 s."}, {"t": "c", "r": "W1 Q3", "q": "A shell is fired straight up at 98 m s⁻¹. (a) When will it have an upward speed of 49 m s⁻¹? (b) When will it have a downward speed of 49 m s⁻¹? (c) Time to reach maximum height? (d) Maximum height? (e) Acceleration at the top?", "a": "Up is positive, a = −9.8.<br>(a) 49 = 98 − 9.8t ⇒ t = 5.0 s.<br>(b) −49 = 98 − 9.8t ⇒ t = 15 s.<br>(c) 0 = 98 − 9.8t ⇒ t = 10 s.<br>(d) s = (0 − 98²)/(2 × −9.8) = 490 m.<br>(e) −9.8 m s⁻² (9.8 downwards). Gravity still acts at the top."}, {"t": "c", "r": "W1 Q4", "q": "A 180 g ball is thrown vertically upwards and is in the air for 4.8 s before hitting the ground. Use g = 10 m s⁻². (a) Weight force at the top of its motion? (b) Seconds to reach the top? (c) Initial velocity? (d) How high does it rise? (e) Force on the ball just before it lands?", "a": "m = 0.18 kg.<br>(a) W = mg = 0.18 × 10 = 1.8 N (weight does not change with speed or position).<br>(b) Up time = half of 4.8 s = 2.4 s.<br>(c) u = gt = 10 × 2.4 = 24 m s⁻¹.<br>(d) h = u²/(2g) = 576/20 = 28.8 m.<br>(e) The only force is still the weight: 1.8 N downwards."}, {"t": "c", "r": "W1 Q5", "q": "A girl throws a softball up to a height of 21 m. Use g = 10 m s⁻². (a) Speed at which it leaves her hand? (b) Time to reach the greatest height? (c) How long is the ball in the air?", "a": "(a) v² = u² − 2gh ⇒ u = √(2 × 10 × 21) = √420 = 20.5 m s⁻¹.<br>(b) t = u/g = 20.5/10 = 2.05 s.<br>(c) Up and down take equal times: 2 × 2.05 = 4.1 s."}, {"t": "c", "r": "W1 Q6", "q": "A 12 000 kg rocket is fired vertically upwards at 180 m s⁻¹ and the engines are cut off immediately. Use g = 10 m s⁻². (a) Time to reach its greatest height? (b) Greatest height? (c) Speed after 4 s? (d) Acceleration at the top? (e) Force on the rocket just before it lands?", "a": "(a) t = u/g = 180/10 = 18 s.<br>(b) h = u²/(2g) = 32 400/20 = 1620 m.<br>(c) v = 180 − 10 × 4 = 140 m s⁻¹ (upwards).<br>(d) 10 m s⁻² downwards (gravity only).<br>(e) Weight = mg = 12 000 × 10 = 1.2 × 10⁵ N downwards."}, {"t": "h", "r": "FQ1 Q18", "q": "A stone is dropped from a bridge and takes 4 s to reach the water. How high is the bridge above the water? (Use g = 10 m s⁻².)", "a": "s = ½gt² = ½ × 10 × 16 = 80 m."}, {"t": "h", "r": "FQ1 Q19", "q": "A stone falls 20 m from rest to the ground. (a) Velocity as it strikes the ground? (b) How long does it take? (g = 10 m s⁻².)", "a": "(a) v = √(2gs) = √400 = 20 m s⁻¹.<br>(b) t = v/g = 2 s."}, {"t": "h", "r": "FQ1 Q20", "q": "A ball is thrown vertically up from the ground at 30 m s⁻¹ (g = 10 m s⁻²). (a) Maximum height? (b) Time to reach the maximum height? (c) Time to fall back down? (d) Sketch the velocity–time graph.", "a": "(a) h = u²/(2g) = 900/20 = 45 m.<br>(b) t = u/g = 3 s.<br>(c) 3 s (same as the way up).<br>(d) A straight line from +30 m s⁻¹ at 0 s, through 0 at 3 s, to −30 m s⁻¹ at 6 s (gradient −10 m s⁻²).", "afig": "<svg viewBox=\"0 0 380 240\" role=\"img\" aria-label=\"velocity falls from 30 to -30 in a straight line over 6 s\" style=\"max-width:380px;width:100%;height:auto;display:block;margin:6px 0;font:11px system-ui,sans-serif\"><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"97.6\" y1=\"200.0\" x2=\"97.6\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"145.2\" y1=\"200.0\" x2=\"145.2\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"192.7\" y1=\"200.0\" x2=\"192.7\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"240.3\" y1=\"200.0\" x2=\"240.3\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"287.9\" y1=\"200.0\" x2=\"287.9\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"335.5\" y1=\"200.0\" x2=\"335.5\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"186.7\" x2=\"364.0\" y2=\"186.7\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"146.9\" x2=\"364.0\" y2=\"146.9\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"107.0\" x2=\"364.0\" y2=\"107.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"67.1\" x2=\"364.0\" y2=\"67.1\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"27.3\" x2=\"364.0\" y2=\"27.3\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"107.0\" x2=\"364.0\" y2=\"107.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"50.0\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">0</text><text x=\"97.6\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">1</text><text x=\"145.2\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">2</text><text x=\"192.7\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">3</text><text x=\"240.3\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">4</text><text x=\"287.9\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">5</text><text x=\"335.5\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">6</text><text x=\"44.0\" y=\"190.7\" text-anchor=\"end\" fill=\"currentColor\">-30</text><text x=\"44.0\" y=\"150.9\" text-anchor=\"end\" fill=\"currentColor\">-15</text><text x=\"44.0\" y=\"111.0\" text-anchor=\"end\" fill=\"currentColor\">0</text><text x=\"44.0\" y=\"71.1\" text-anchor=\"end\" fill=\"currentColor\">15</text><text x=\"44.0\" y=\"31.3\" text-anchor=\"end\" fill=\"currentColor\">30</text><text x=\"207.0\" y=\"236\" text-anchor=\"middle\" fill=\"currentColor\">time (s)</text><text x=\"12\" y=\"107.0\" text-anchor=\"middle\" fill=\"currentColor\" transform=\"rotate(-90 12 107.0)\">velocity (m s⁻¹)</text><polyline fill=\"none\" stroke=\"#8b6cff\" stroke-width=\"2.6\" stroke-linejoin=\"round\" points=\"50.0,27.3 192.7,107.0 335.5,186.7\"/><circle cx=\"50.0\" cy=\"27.3\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"192.7\" cy=\"107.0\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"335.5\" cy=\"186.7\" r=\"3\" fill=\"#8b6cff\"/></svg>"}, {"t": "h", "r": "FQ2 Q27", "q": "A ball is thrown vertically up from the ground at 35 m s⁻¹ (use g = 10 m s⁻²). (a) Maximum height? (b) Time to reach it? (c) Time to fall back to the ground?", "a": "(a) h = 35²/20 = 61 m (61.25 m).<br>(b) t = 35/10 = 3.5 s.<br>(c) 3.5 s again."}, {"t": "h", "r": "FQ2 Q28", "q": "A person in a balloon rising at a constant 4.9 m s⁻¹ drops a sandbag at an elevation of 98 m. (a) How long until it hits the ground? (b) Its velocity on impact? (g = 10 m s⁻².)", "a": "The sandbag starts with u = +4.9 m s⁻¹ (still moving up) and s = −98 m.<br>(a) −98 = 4.9t − 5t² ⇒ 5t² − 4.9t − 98 = 0 ⇒ t = 4.9 s.<br>(b) v = 4.9 − 10(4.94) = −44.5 m s⁻¹ (44.5 m s⁻¹ downwards)."}, {"t": "h", "r": "FQ2 Q29", "q": "A startled armadillo leaps upward and rises 54.4 cm in 0.20 s and keeps rising. (a) Initial speed? (b) Speed at this height? (c) How much higher does it go? (g = 10 m s⁻².)", "a": "s = 0.544 m, t = 0.20 s, a = −10.<br>(a) s = ut + ½at² ⇒ u = (0.544 + 0.2)/0.2 = 3.72 m s⁻¹.<br>(b) v = u + at = 3.72 − 2.0 = 1.72 m s⁻¹.<br>(c) Extra height = v²/(2g) = 2.96/20 = 0.15 m = 15 cm."}, {"t": "h", "r": "Practice 4", "q": "A window cleaner accidentally drops her phone, which falls vertically with acceleration 9.80 m s⁻². (a) Speed after 3.0 s? (b) How fast is it moving after it has fallen 30.0 m? (c) Average velocity during the fall of 30.0 m?", "a": "(a) v = gt = 9.80 × 3.0 = 29 m s⁻¹.<br>(b) v = √(2 × 9.80 × 30.0) = 24 m s⁻¹.<br>(c) Average velocity = (0 + 24.2)/2 = 12 m s⁻¹ downwards."}, {"t": "h", "r": "Practice 5", "q": "A super ball is bounced straight up and reaches its highest point after 1.5 s (g = 9.80 m s⁻²). (a) Velocity at the highest point? (b) Initial speed leaving the ground? (c) Maximum height?", "a": "(a) v = 0.<br>(b) u = gt = 9.80 × 1.5 = 15 m s⁻¹.<br>(c) h = u²/(2g) = 14.7²/19.6 = 11 m."}, {"t": "h", "r": "Practice 6", "q": "A book is knocked off a bench and falls to the floor in 0.40 s. (a) Speed as it lands? (b) Height of the bench? (c) How far does it fall in the first 0.20 s? (d) How far does it fall in the final 0.20 s?", "a": "(a) v = gt = 9.8 × 0.40 = 3.9 m s⁻¹.<br>(b) s = ½gt² = ½ × 9.8 × 0.16 = 0.78 m.<br>(c) ½ × 9.8 × 0.04 = 0.20 m.<br>(d) 0.78 − 0.20 = 0.59 m. Falling gets faster, so more distance is covered in the second half."}, {"t": "h", "r": "Practice 7", "q": "A party popper lid goes straight up and takes 4.0 s to return to its starting point. (a) Time to reach maximum height? (b) Launch speed? (c) Maximum height? (d) Velocity when it returns?", "a": "(a) 2.0 s (half the flight).<br>(b) u = gt = 9.8 × 2.0 = 20 m s⁻¹.<br>(c) h = ½gt² = ½ × 9.8 × 4.0 = 20 m.<br>(d) −20 m s⁻¹ (20 m s⁻¹ downwards, same speed it left with)."}], "np": true}, {"id": "F1", "wk": "Week 3", "title": "F1 Newton's laws and kinematics", "th": "<p>A <b>force</b> is a push or a pull, measured in <b>newtons (N)</b>. The <b>net (unbalanced) force</b> is the vector sum of all forces on an object.</p>\n<div class=\"box\"><ul><li><b>Newton's first law:</b> an object stays at rest, or moves at constant velocity, unless an unbalanced force acts on it (balanced forces ⇒ no change in motion).</li><li><b>Newton's second law:</b> <b>F = ma</b>, where F is the <i>net</i> force. Same net force: smaller mass ⇒ bigger acceleration.</li><li><b>Newton's third law:</b> if A pushes on B, then B pushes back on A with an equal and opposite force. The two forces act on <i>different</i> objects.</li><li><b>Weight</b> W = mg. 1 N = 1 kg m s⁻².</li></ul></div>\n<p><b>Linking forces and motion:</b> find the net force, use F = ma to get acceleration, then use the equations of motion (M3) for velocity, distance or time. Or go the other way: use kinematics to find a, then F = ma.</p>\n<div class=\"box\">⚠ Use the <i>net</i> force in F = ma (applied force minus friction and resistive forces). Convert grams to kilograms.</div>", "qs": [{"t": "c", "r": "W3 Q2", "q": "A 450 g trolley rests on a rough table. A horizontal force is applied and the mass travels 0.65 m and reaches a final speed of 1.3 m s⁻¹. (a) Use v² = u² + 2ad to calculate the acceleration. (b) Hence find the force that acts on the trolley.", "a": "m = 0.45 kg, u = 0.<br>(a) a = v²/(2d) = 1.69/1.30 = 1.3 m s⁻².<br>(b) F = ma = 0.45 × 1.3 = 0.585 N (the <i>net</i> force)."}, {"t": "c", "r": "W3 Q3", "q": "The force applied to the trolley above is actually 0.75 N. This is because there is another force acting on the mass. (a) What sort of force is it and how big is it? (b) In which direction does it act?", "a": "(a) Friction between the trolley and the rough table: 0.75 − 0.585 = 0.165 N (about 0.17 N).<br>(b) It acts opposite to the motion (backwards, against the applied force)."}, {"t": "c", "r": "W3 Q4", "q": "A 150 kg car trailer is at rest on a smooth flat road. The car starts off and accelerates to 12 m s⁻¹ in 3.6 s. (a) Calculate the acceleration of the trailer. (b) Calculate the force of the car on the trailer. (c) What is the force of the trailer dragging on the car? (d) Which law of Newton does this illustrate?", "a": "(a) a = (12 − 0)/3.6 = 3.3 m s⁻².<br>(b) F = ma = 150 × 3.33 = 500 N (smooth road, so no friction).<br>(c) 500 N, in the opposite direction (backwards on the car).<br>(d) Newton's third law (action–reaction pair)."}, {"t": "c", "r": "W3 Q5", "q": "After the 3.6 s the trailer moves on to a rough surface where the friction force is estimated at 120 N. (a) What is the total force now acting on the trailer? (b) Hence calculate the new acceleration. (c) When the trailer is travelling at 18 m s⁻¹ the car's engine is switched off. How long does it take the trailer to stop?", "a": "(a) Net force = 500 − 120 = 380 N (assuming the car still pulls with 500 N).<br>(b) a = F/m = 380/150 = 2.5 m s⁻².<br>(c) With the engine off only friction acts: a = −120/150 = −0.80 m s⁻². t = (0 − 18)/(−0.80) = 22.5 s (about 23 s)."}, {"t": "c", "r": "W3 Q6a", "q": "A small truck has a load of very wet soil on board. On a long trip the driver notices the soil is drying out. Explain how this would affect the truck's acceleration. Use Newton's second law.", "a": "Newton's second law: a = F/m. As the soil dries, the total mass m decreases. If the net force stays the same, the acceleration increases (a is inversely proportional to m)."}, {"t": "c", "r": "W3 Q6b", "q": "A student suggests that air resistance R is proportional to the square of the speed v. Measurements: v = 5, 10, 15, 20, 25 m s⁻¹ give R = 200, 800, 1800, 3200, 5000 N. Does the data support the hypothesis? Explain.", "a": "Test R ÷ v²: 200/25 = 8, 800/100 = 8, 1800/225 = 8, 3200/400 = 8, 5000/625 = 8. The ratio is constant (8 N s² m⁻²), so R ∝ v². Also doubling v (5 to 10) quadruples R (200 to 800). Yes, the data supports the hypothesis."}, {"t": "c", "r": "W3 Q6c", "q": "At a certain speed the air resistance is 4 kN and other resistive forces total 400 N. The total mass of truck and soil is 1000 kg and the engine force is 5 kN. Calculate the unbalanced force on the truck.", "a": "Net force = forward − backward = 5000 − (4000 + 400) = 600 N forwards."}, {"t": "c", "r": "W3 Q6d", "q": "Calculate the acceleration of the truck in Q6c.", "a": "a = F/m = 600/1000 = 0.60 m s⁻²."}, {"t": "h", "r": "Practice A", "q": "A 1200 kg car has an engine force of 3000 N and total resistive forces of 600 N. Find its acceleration, and the time and distance to reach 20 m s⁻¹ from rest.", "a": "Net = 3000 − 600 = 2400 N. a = 2400/1200 = 2.0 m s⁻². t = v/a = 10 s. s = ½at² = ½ × 2.0 × 100 = 100 m."}, {"t": "h", "r": "Practice B", "q": "A 0.50 kg ball is kicked and leaves the boot at 20 m s⁻¹ after a contact time of 0.010 s. Find the average force on the ball.", "a": "a = Δv/t = 20/0.010 = 2000 m s⁻². F = ma = 0.50 × 2000 = 1000 N."}], "np": true}, {"id": "F2", "wk": "Term 2", "title": "F2 Free-body diagrams", "th": "<p>A <b>free-body diagram</b> shows all the forces acting <i>on one object</i>. The object is drawn as a box or dot and each force is an arrow starting at the centre.</p>\n<div class=\"box\"><b>Steps</b><ul><li>1. Identify the object and the forces on it (think of every contact and every field).</li><li>2. Draw each arrow from the centre, in the direction the force acts.</li><li>3. Arrow <b>length</b> shows relative size: equal arrows ⇒ balanced.</li><li>4. Label each arrow with its type.</li></ul></div>\n<p><b>Common force symbols:</b> Fg (weight, mg), Fn (normal, perpendicular to a surface), Ff (friction, opposes sliding), Ft (tension, along a rope), Fair (air resistance / drag), Fapp (applied push or pull), thrust, lift.</p>\n<div class=\"box\">⚠ Do not draw forces <i>by</i> the object, and do not invent a “force of motion”. An object moving at constant velocity has balanced forces. Net force ⇒ acceleration in that direction.</div>", "qs": [{"t": "c", "r": "Sheet 1 Q1", "q": "A book is at rest on a table top. Draw the forces on the book.", "a": "Weight Fg down and normal force Fn up. They are equal, so the net force is zero.", "afig": "<svg viewBox=\"0 0 210 184\" role=\"img\" aria-label=\"Free-body diagram: Weight Fg down and normal force Fn up\" style=\"max-width:210px;width:100%;height:auto;display:block;margin:6px 0;font:12px system-ui,sans-serif\"><rect x=\"91.0\" y=\"92.0\" width=\"28\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"131.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,140.0 100.5,131.0 109.5,131.0\"/><text x=\"105.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fg</text><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"73.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,64.0 109.5,73.0 100.5,73.0\"/><text x=\"105.0\" y=\"54.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fn</text></svg>"}, {"t": "c", "r": "Sheet 1 Q2", "q": "A girl is suspended motionless from the ceiling by a rope. Draw the forces on the girl.", "a": "Weight Fg down and tension Ft up (rope), equal in size.", "afig": "<svg viewBox=\"0 0 210 184\" role=\"img\" aria-label=\"Free-body diagram: Weight Fg down and tension Ft up (rope), equal in size\" style=\"max-width:210px;width:100%;height:auto;display:block;margin:6px 0;font:12px system-ui,sans-serif\"><rect x=\"91.0\" y=\"92.0\" width=\"28\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"131.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,140.0 100.5,131.0 109.5,131.0\"/><text x=\"105.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fg</text><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"73.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,64.0 109.5,73.0 100.5,73.0\"/><text x=\"105.0\" y=\"54.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Ft</text></svg>"}, {"t": "c", "r": "Sheet 1 Q3", "q": "An egg is free-falling from a nest. Neglect air resistance. Draw the forces on the egg.", "a": "Only the weight Fg, acting down. The net force is the weight, so a = g.", "afig": "<svg viewBox=\"0 0 210 184\" role=\"img\" aria-label=\"Free-body diagram: Only the weight Fg, acting down\" style=\"max-width:210px;width:100%;height:auto;display:block;margin:6px 0;font:12px system-ui,sans-serif\"><rect x=\"91.0\" y=\"92.0\" width=\"28\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"131.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,140.0 100.5,131.0 109.5,131.0\"/><text x=\"105.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fg</text></svg>"}, {"t": "c", "r": "Sheet 1 Q4", "q": "An egg is falling (not freely: do not neglect air resistance). Draw the forces on the egg.", "a": "Weight Fg down and air resistance Fair up. Fair is smaller than Fg while the egg is still speeding up.", "afig": "<svg viewBox=\"0 0 210 184\" role=\"img\" aria-label=\"Free-body diagram: Weight Fg down and air resistance Fair up\" style=\"max-width:210px;width:100%;height:auto;display:block;margin:6px 0;font:12px system-ui,sans-serif\"><rect x=\"91.0\" y=\"92.0\" width=\"28\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"131.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,140.0 100.5,131.0 109.5,131.0\"/><text x=\"105.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fg</text><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"92.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,83.0 109.5,92.0 100.5,92.0\"/><text x=\"105.0\" y=\"73.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fair</text></svg>"}, {"t": "c", "r": "Sheet 1 Q5", "q": "A rightward force moves a book across a desk with a rightward acceleration. Consider friction. Neglect air resistance.", "a": "Weight Fg down, normal Fn up (equal), applied force Fapp right and friction Ff left. Fapp is longer than Ff, so there is a net force to the right.", "afig": "<svg viewBox=\"0 0 210 184\" role=\"img\" aria-label=\"Free-body diagram: Weight Fg down, normal Fn up (equal), applied force Fapp right and friction Ff left\" style=\"max-width:210px;width:100%;height:auto;display:block;margin:6px 0;font:12px system-ui,sans-serif\"><rect x=\"91.0\" y=\"92.0\" width=\"28\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"131.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,140.0 100.5,131.0 109.5,131.0\"/><text x=\"105.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fg</text><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"73.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,64.0 109.5,73.0 100.5,73.0\"/><text x=\"105.0\" y=\"54.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fn</text><line x1=\"105.0\" y1=\"102.0\" x2=\"145.4\" y2=\"102.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"154.4,102.0 145.4,106.5 145.4,97.5\"/><text x=\"162.4\" y=\"106.0\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\">Fapp</text><line x1=\"105.0\" y1=\"102.0\" x2=\"91.2\" y2=\"102.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"82.2,102.0 91.2,97.5 91.2,106.5\"/><text x=\"74.2\" y=\"106.0\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"700\">Ff</text></svg>"}, {"t": "c", "r": "Sheet 1 Q6", "q": "A rightward force moves a book across a desk at constant velocity. Consider friction. Neglect air resistance.", "a": "As Q5 but Fapp and Ff are equal in length (balanced forces mean constant velocity).", "afig": "<svg viewBox=\"0 0 210 184\" role=\"img\" aria-label=\"Free-body diagram: As Q5 but Fapp and Ff are equal in length (balanced forces mean constant velocity)\" style=\"max-width:210px;width:100%;height:auto;display:block;margin:6px 0;font:12px system-ui,sans-serif\"><rect x=\"91.0\" y=\"92.0\" width=\"28\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"131.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,140.0 100.5,131.0 109.5,131.0\"/><text x=\"105.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fg</text><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"73.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,64.0 109.5,73.0 100.5,73.0\"/><text x=\"105.0\" y=\"54.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fn</text><line x1=\"105.0\" y1=\"102.0\" x2=\"134.0\" y2=\"102.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"143.0,102.0 134.0,106.5 134.0,97.5\"/><text x=\"151.0\" y=\"106.0\ lor\" font-weight=\"700\">Ff</text></svg>"}, {"t": "c", "r": "Sheet 1 Q10", "q": "A hot air balloon is accelerating upward.", "a": "Weight Fg down and the upward lift (buoyancy) force Flift up. Flift is bigger than Fg, so the net force is upward.", "afig": "<svg viewBox=\"0 0 210 184\" role=\"img\" aria-label=\"Free-body diagram: Weight Fg down and the upward lift (buoyancy) force Flift up\" style=\"max-width:210px;width:100%;height:auto;display:block;margin:6px 0;font:12px system-ui,sans-serif\"><rect x=\"91.0\" y=\"92.0\" width=\"28\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"131.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,140.0 100.5,131.0 109.5,131.0\"/><text x=\"105.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fg</text><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"54.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,45.0 109.5,54.0 100.5,54.0\"/><text x=\"105.0\" y=\"35.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Flift</text></svg>"}, {"t": "c", "r": "Sheet 1 Q11", "q": "A car is coasting to the right and slowing down.", "a": "Weight Fg down, normal Fn up (equal), and friction/air resistance Fres to the left. There is no driving force, so the net force is to the left.", "afig": "<svg viewBox=\"0 0 210 184\" role=\"img\" aria-label=\"Free-body diagram: Weight Fg down, normal Fn up (equal), and friction/air resistance Fres to the left\" style=\"max-width:210px;width:100%;height:auto;display:block;margin:6px 0;font:12px system-ui,sans-serif\"><rect x=\"91.0\" y=\"92.0\" width=\"28\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"131.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,140.0 100.5,131.0 109.5,131.0\"/> t x=\"105.0\" y=\"141.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fair</text></svg>"}, {"t": "h", "r": "Sheet 2 Q19", "q": "A skier is accelerating down a slope. There is friction and air resistance.", "a": "Fg down, Fn perpendicular to the slope, and Ff and Fair both up the slope (opposing motion). The net force is down the slope.", "afig": "<svg viewBox=\"0 0 210 184\" role=\"img\" aria-label=\"Free-body diagram: Fg down, Fn perpendicular to the slope, and Ff and Fair both up the slope (opposing motion)\" style=\"max-width:210px;width:100%;height:auto;display:block;margin:6px 0;font:12px system-ui,sans-serif\"><rect x=\"91.0\" y=\"92.0\" width=\"28\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"131.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,140.0 100.5,131.0 109.5,131.0\"/><text x=\"105.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fg</text><line x1=\"105.0\" y1=\"102.0\" x2=\"93.0\" y2=\"81.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"88.5,73.2 96.9,78.8 89.1,83.3\"/><text x=\"84.5\" y=\"64.3\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"700\">Fn</text><line x1=\"105.0\" y1=\"102.0\" x2=\"108.8\" y2=\"99.8\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"116.6,95.3 111.0,103.7 106.5,95.9\"/><text x=\"123.5\" y=\"95.4\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\">Ff</text><line x1=\"105.0\" y1=\"102.0\" x2=\"117.0\" y2=\"95.1\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"124.8,90.6 119.3,99.0 114.8,91.2\"/><text x=\"131.8\" y=\"90.6\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\">Fair</text></svg>"}], "np": true}, {"id": "F3", "wk": "Forces", "title": "F3 Terminal velocity and drag", "th": "<p>When an object falls through air, <b>drag</b> (air resistance) opposes its motion. Drag <b>increases with speed</b> (roughly with the square of the speed), and also depends on the object's shape and cross-sectional area and the density of the fluid.</p>\n<div class=\"box\"><b>Falling, step by step</b><ul><li>At the start v = 0, so drag = 0 and the net force = weight: a = g.</li><li>As v increases, drag increases, the net force (Fg − drag) shrinks, and the acceleration decreases.</li><li>At <b>terminal velocity</b>, drag = weight, the net force is zero, so a = 0 and the speed stays constant.</li><li>Parachute: bigger area ⇒ more drag at a given speed ⇒ a much lower terminal velocity.</li></ul></div>\n<div class=\"box\">⚠ Terminal velocity does not mean the object has stopped or that gravity stopped acting. Forces are balanced, so it moves at constant velocity.</div>\n<p>Typical terminal velocities (m s⁻¹): shotput ball 150, skydiver 50, cricket ball 40, tennis ball 30, rock (1 cm) 25, basketball 20, ping-pong ball 10, raindrop 7, insect 6, parachutist 5.</p>", "fig": "<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start\"><svg viewBox=\"0 0 340 230\" role=\"img\" aria-label=\"Velocity against time for a tennis ball in free fall, levelling off near 240 m per second\" style=\"max-width:340px;width:100%;height:auto;display:block;margin:6px 0;font:11px system-ui,sans-serif\"><line x1=\"50.0\" y1=\"190.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"87.8\" y1=\"190.0\" x2=\"87.8\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"125.6\" y1=\"190.0\" x2=\"125.6\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"163.4\" y1=\"190.0\" x2=\"163.4\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"201.2\" y1=\"190.0\" x2=\"201.2\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"239.0\" y1=\"190.0\" x2=\"239.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"276.8\" y1=\"190.0\" x2=\"276.8\

ill=\"currentColor\">8</text><text x=\"239.0\" y=\"204.0\" text-anchor=\"middle\" fill=\"currentColor\">10</text><text x=\"276.8\" y=\"204.0\" text-anchor=\"middle\" fill=\"currentColor\">12</text><text x=\"314.6\" y=\"204.0\" text-anchor=\"middle\" fill=\"currentColor\">14</text><text x=\"44.0\" y=\"194.0\" text-anchor=\"end\" fill=\"currentColor\">0</text><text x=\"44.0\" y=\"160.2\" text-anchor=\"end\" fill=\"currentColor\">50</text><text x=\"44.0\" y=\"126.3\" text-anchor=\"end\" fill=\"currentColor\">100</text><text x=\"44.0\" y=\"92.5\" text-anchor=\"end\" fill=\"currentColor\">150</text><text x=\"44.0\" y=\"58.6\" text-anchor=\"end\" fill=\"currentColor\">200</text><text x=\"44.0\" y=\"24.8\" text-anchor=\"end\" fill=\"currentColor\">250</text><text x=\"187.0\" y=\"226\" text-anchor=\"middle\" fill=\"currentColor\">time (s)</text><text x=\"12\" y=\"102.0\" text-anchor=\"middle\" fill=\"currentColor\" transform=\"rotate(-90 12 102.0)\">velocity (m s⁻¹)</text><polyline fill=\"none\" stroke=\"#8b6cff\" stroke-width=\"2.6\" stroke-linejoin=\"round\" points=\"50.0,190.0 68.9,183.2 87.8,169.7 106.7,150.7 125.6,125.7 144.5,97.3 163.4,71.5 182.3,49.9 201.2,37.0 220.1,30.9 239.0,28.9 257.9,28.9 276.8,28.9 295.7,28.9 314.6,28.9\"/><circle cx=\"50.0\" cy=\"190.0\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"68.9\" cy=\"183.2\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"87.8\" cy=\"169.7\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"106.7\" cy=\"150.7\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"125.6\" cy=\"125.7\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"144.5\" cy=\"97.3\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"163.4\" cy=\"71.5\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"182.3\" cy=\"49.9\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"201.2\" cy=\"37.0\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"220.1\" cy=\"30.9\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"239.0\" cy=\"28.9\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"257.9\" cy=\"28.9\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"276.8\" cy=\"28.9\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"295.7\" cy=\"28.9\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"314.6\" cy=\"28.9\" r=\"3\" fill=\"#8b6cff\"/></svg>"}, {"t": "c", "r": "Apply 4", "q": "Felix Baumgartner fell from 38 km in 2012, reaching 1358 km h⁻¹, and deployed his parachute after 4 minutes. Calculate his average speed during the descent (2 s.f.).", "a": "Using 38 km in 4 min: 38 000 m ÷ 240 s = 158 m s⁻¹ ≈ 160 m s⁻¹ (about 570 km h⁻¹)."}, {"t": "c", "r": "Check 1", "q": "Explain terminal velocity in the context of a magazine falling with the cover facing down versus falling with the edge facing down, using a free-body diagram.", "a": "Weight is the same in both cases. Drag depends on area: with the cover facing down the area is large, so drag grows quickly and equals the weight at a low speed (low terminal velocity). Edge-down has a small area, so drag is smaller at each speed and the magazine reaches a higher terminal velocity. At terminal velocity in either case Fdrag = Fg (balanced, a = 0).", "afig": "<svg viewBox=\"0 0 210 184\" role=\"img\" aria-label=\"Terminal velocity: weight and drag equal and opposite\" style=\"max-width:210px;width:100%;height:auto;display:block;margin:6px 0;font:12px system-ui,sans-serif\"><rect x=\"91.0\" y=\"92.0\" width=\"28\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"131.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,140.0 100.5,131.0 109.5,131.0\"/><text x=\"105.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fg (weight)</text><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"73.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,64.0 109.5,73.0 100.5,73.0\"/><text x=\"105.0\" y=\"54.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fdrag</text></svg>"}, {"t": "c", "r": "Check 2", "q": "Identify the factors on which drag force depends.", "a": "Speed of the object, its cross-sectional area (and shape), and the density (type) of the fluid it moves through."}, {"t": "c", "r": "Check 3", "q": "Describe the relationship between drag forces and terminal velocity for a falling tennis ball.", "a": "As the ball speeds up, drag increases. The net force (weight − drag) and so the acceleration decrease. When drag equals weight the net force is zero, the acceleration is zero, and the ball falls at constant (terminal) velocity."}, {"t": "c", "r": "Check 4", "q": "A tennis ball is thrown vertically into the air. If air resistance is taken into account, determine whether the time upwards is shorter than, equal to, or longer than the time coming back down.", "a": "Going up, weight and drag both act downwards, so the deceleration is bigger than g and the ball rises for a shorter time. Coming down, drag acts upwards against the weight, so the acceleration is smaller than g and the fall takes longer. The time up is shorter than the time down."}, {"t": "h", "r": "Check 6", "q": "If a human and a mouse fell from the 20th storey of a high-rise building, the human would not survive but the mouse would. Propose why, in terms of air resistance.", "a": "A mouse has a much larger surface area compared with its weight, so drag becomes equal to its weight at a low speed (low terminal velocity). A human has a high terminal velocity and hits the ground much faster, with a far larger and more damaging deceleration on impact."}, {"t": "h", "r": "Check 7", "q": "Two skydivers are free-falling and try to throw a tennis ball back and forth. Propose why this will not work, and whether it would be possible once their parachutes open.", "a": "A skydiver's terminal velocity (about 50 m s⁻¹) is greater than a tennis ball's (about 30 m s⁻¹), so the ball cannot keep up: it would be left behind. After the parachutes open the skydivers' terminal velocity (about 5 m s⁻¹) is far lower than the ball's, so the ball would fall away much faster than they do. It would not be possible in either case."}, {"t": "h", "r": "Check 8", "q": "“When the upwards force of air resistance on a parachutist equals their weight, they will be stationary.” Draw a conclusion about this statement and justify your reasoning.", "a": "The statement is false. Equal and opposite forces mean zero net force, so there is zero <i>acceleration</i>. By Newton's first law the parachutist keeps moving at constant velocity (terminal velocity), not necessarily zero."}], "np": true}, {"id": "E1", "wk": "Energy", "title": "E1 Kinetic energy", "th": "<p>Energy is the ability to do work and is measured in <b>joules (J)</b>. The <b>kinetic energy store</b> is the energy an object has because it is moving:</p>\n<div class=\"box\"><b>Ek = ½mv²</b> &nbsp; (m in kg, v in m s⁻¹, Ek in J)<ul><li>Double the mass ⇒ double the energy.</li><li>Double the speed ⇒ <b>four times</b> the energy (v is squared).</li><li>Rearranged: v = √(2Ek/m) and m = 2Ek/v².</li></ul></div>\n<div class=\"box\">⚠ Convert first: g ÷ 1000 = kg, km × 1000 = m, km h⁻¹ ÷ 3.6 = m s⁻¹, kJ × 1000 = J. Square only the speed, not the ½ or the mass.</div>", "qs": [{"t": "c", "r": "Q1", "q": "Define kinetic energy store.", "a": "The energy an object has because of its motion."}, {"t": "c", "r": "Q2", "q": "What is the formula for the kinetic energy store?", "a": "Ek = ½mv², where m is the mass in kg, v is the speed in m s⁻¹ and Ek is in joules (J)."}, {"t": "c", "r": "Q3", "q": "Why does a train waiting at a station have 0 kinetic energy store?", "a": "Its speed is zero (v = 0), so ½mv² = 0."}, {"t": "c", "r": "Q4", "q": "Why does a lorry travelling at 30 mph have more kinetic energy than a car travelling at the same velocity?", "a": "Ek is proportional to mass. At the same speed, the lorry's larger mass gives it a bigger kinetic energy store."}, {"t": "h", "r": "Q5", "q": "A ball of mass 0.2 kg moves at 5 m s⁻¹. Find its kinetic energy store.", "a": "Ek = ½mv² = ½ × 0.2 × 5² = 2.50 J."}, {"t": "h", "r": "Q6", "q": "A rocket of mass 2800 kg travels at 1.4 km s⁻¹. Find its kinetic energy store.", "a": "1.4 km s⁻¹ = 1400 m s⁻¹. Ek = ½mv² = ½ × 2800 × 1400² = 2.74 × 10⁹ J."}, {"t": "h", "r": "Q7", "q": "A cannonball of mass 8.5 kg moves at 3389 m s⁻¹. Find its kinetic energy store.", "a": "Ek = ½mv² = ½ × 8.5 × 3389² = 4.88 × 10⁷ J."}, {"t": "h", "r": "Q8", "q": "A car of mass 78 950 kg has a velocity of 287 m s⁻¹. Find its kinetic energy store.", "a": "Ek = ½mv² = ½ × 78950 × 287² = 3.25 × 10⁹ J."}, {"t": "h", "r": "Q9", "q": "An eagle of mass 0.9 kg travels at 18 m s⁻¹. Find its kinetic energy store.", "a": "Ek = ½mv² = ½ × 0.9 × 18² = 146 J."}, {"t": "h", "r": "Q10", "q": "A moon of mass 9800 kg orbits at 600 m s⁻¹. Find its kinetic energy store.", "a": "Ek = ½mv² = ½ × 9800 × 600² = 1.76 × 10⁹ J."}, {"t": "h", "r": "Q11", "q": "A plane of mass 5665 kg flies at 490 m s⁻¹. Find its kinetic energy store.", "a": "Ek = ½mv² = ½ × 5665 × 490² = 6.80 × 10⁸ J."}, {"t": "h", "r": "Q12", "q": "A trampolinist has KE of 8500 J and a mass of 65 kg. What velocity is he travelling at?", "a": "v = √(2Ek/m) = √(2 × 8500/65) = √261.5 = 16.2 m s⁻¹."}, {"t": "h", "r": "Q13", "q": "A tossed pancake has a mass of 0.05 kg and a kinetic energy store of 27 J. What is its velocity?", "a": "v = √(2 × 27/0.05) = √1080 = 32.9 m s⁻¹."}, {"t": "h", "r": "Q14", "q": "A sneezed snot droplet has a mass of 0.7 g. Find its kinetic energy store when moving at 14 m s⁻¹.", "a": "m = 0.7 g = 0.0007 kg. Ek = ½ × 0.0007 × 14² = 0.0686 J."}, {"t": "h", "r": "Q15", "q": "An alien spacecraft flies past the Earth at 28 000 m s⁻¹. What is its mass given that it has 786 500 J of kinetic energy store?", "a": "m = 2Ek/v² = 2 × 786 500/28 000² = 0.00201 kg (about 2.0 g)."}, {"t": "h", "r": "Q16", "q": "A bullet of mass 0.012 kg has 140 J of kinetic energy store. What is its velocity?", "a": "v = √(2 × 140/0.012) = 153 m s⁻¹."}, {"t": "h", "r": "Q17", "q": "A motorbike has 657 800 J of KE and a velocity of 70 m s⁻¹. What is its mass?", "a": "m = 2Ek/v² = 2 × 657 800/70² = 268 kg."}, {"t": "h", "r": "Q18", "q": "Find the velocity of a cyclist with mass 158 kg and 4.7 kJ of kinetic energy store.", "a": "4.7 kJ = 4700 J. v = √(2 × 4700/158) = 7.71 m s⁻¹."}], "np": true}, {"id": "E2", "wk": "Energy", "title": "E2 Gravitational potential energy", "th": "<p>The <b>gravitational potential energy (GPE) store</b> is the energy an object has because of its height above a reference level in a gravitational field:</p>\n<div class=\"box\"><b>Ep = mgh</b> &nbsp; (m in kg, g in N kg⁻¹, h in m, Ep in J)<ul><li>g = 9.8 N kg⁻¹ on Earth, 1.63 on the Moon, 24.5 on Jupiter.</li><li>Double the height ⇒ double the Ep.</li><li>Rearranged: m = Ep/(gh) and h = Ep/(mg).</li></ul></div>\n<div class=\"box\">⚠ Heights in <i>metres</i> (km × 1000, cm ÷ 100), mass in <i>kilograms</i> (g ÷ 1000), energy in J (kJ × 1000, MJ × 1 000 000).</div>", "qs": [{"t": "c", "r": "Q1", "q": "Define gravitational potential energy.", "a": "The energy stored in an object because of its height in a gravitational field (relative to a reference level)."}, {"t": "c", "r": "Q2", "q": "What does g measure?", "a": "The gravitational field strength: the force (weight) per kilogram of mass. On Earth g = 9.8 N kg⁻¹ (equivalently, the free-fall acceleration 9.8 m s⁻²)."}, {"t": "c", "r": "Q3", "q": "What will happen to Ep if you double the height of an object?", "a": "Ep = mgh, so Ep is proportional to h: doubling the height doubles the gravitational potential energy."}, {"t": "h", "r": "Q4", "q": "An apple of mass 0.23 kg is 65 m above the Earth's surface (g = 9.8 N kg⁻¹). Find the gravitational potential energy stored.", "a": "Ep = mgh = 0.23 × 9.8 × 65 = 147 J."}, {"t": "h", "r": "Q5", "q": "A cable car of mass 4500 kg is suspended 1.2 km above the Earth's surface (g = 9.8 N kg⁻¹). Find the gravitational potential energy stored.", "a": "h = 1.2 km = 1200 m. Ep = mgh = 4500 × 9.8 × 1200 = 5.29 × 10⁷ J."}, {"t": "h", "r": "Q6", "q": "An astronaut lifts a 200 g golf ball 2.6 m above the Moon's surface (g = 1.63 N kg⁻¹). Find the gravitational potential energy stored.", "a": "m = 200 g = 0.2 kg. Ep = mgh = 0.2 × 1.63 × 2.6 = 0.848 J."}, {"t": "h", "r": "Q7", "q": "A spaceship of mass 9950 kg lands at the top of a mountain 5.5 km above Jupiter's surface (g = 24.5 N kg⁻¹). Find the gravitational potential energy stored.", "a": "h = 5500 m. Ep = mgh = 9950 × 24.5 × 5500 = 1.34 × 10⁹ J."}, {"t": "h", "r": "Q8", "q": "An aeroplane of mass 3500 kg flies at a height of 6.8 km (g = 9.8 N kg⁻¹). Give the answer in kJ. Find the gravitational potential energy stored.", "a": "h = 6800 m. Ep = mgh = 3500 × 9.8 × 6800 = 2.33 × 10⁸ J = 2.33 × 10⁵ kJ."}, {"t": "h", "r": "Q9", "q": "A helicopter hovers 568 m above a field and 96 kJ of gravitational potential energy is stored (g = 9.8 N kg⁻¹). Find the helicopter's mass.", "a": "m = Ep/(gh) = 96 000/(9.8 × 568) = 17.2 kg."}, {"t": "h", "r": "Q10", "q": "What is the mass of a rocket 5000 m above the Moon's surface if 84 kJ of gravitational potential energy is stored (g = 1.63 N kg⁻¹)?", "a": "m = 84 000/(1.63 × 5000) = 10.3 kg."}, {"t": "h", "r": "Q11", "q": "A buzzard flies 98 m above the Earth's surface (g = 9.8). What is its mass if the Ep stored is 5403 J?", "a": "m = 5403/(9.8 × 98) = 5.63 kg."}, {"t": "h", "r": "Q12", "q": "Find the mass of a peach if its Ep is 1.2 J and it hangs 90 cm above the Earth's surface (g = 9.8).", "a": "h = 0.90 m. m = 1.2/(9.8 × 0.90) = 0.136 kg."}, {"t": "h", "r": "Q13", "q": "A blimp is 3.9 km above Jupiter's surface (g = 24.5). Find its mass if its gravitational potential energy is 2.8 MJ.", "a": "Ep = 2.8 × 10⁶ J, h = 3900 m. m = 2.8 × 10⁶/(24.5 × 3900) = 29.3 kg."}, {"t": "h", "r": "Q14", "q": "A helicopter of mass 6500 kg has 48 900 J of gravitational potential energy stored. Find its height above the Earth's surface (g = 9.8).", "a": "h = Ep/(mg) = 48 900/(6500 × 9.8) = 0.768 m."}, {"t": "h", "r": "Q15", "q": "Find the height of a crow of mass 860 g if its Ep is 5643 J (g = 9.8).", "a": "m = 0.86 kg. h = 5643/(0.86 × 9.8) = 670 m."}, {"t": "h", "r": "Q16", "q": "What height must a 57 kg block be raised above the Moon's surface to store 2445 J of Ep (g = 1.63)?", "a": "h = 2445/(57 × 1.63) = 26.3 m."}, {"t": "h", "r": "Q17", "q": "A mosquito has mass 0.04 g and 80 075 J of Ep stored. Find its height above Earth (g = 9.8).", "a": "m = 0.04 g = 4 × 10⁻⁵ kg. h = 80 075/(4 × 10⁻⁵ × 9.8) = 2.04 × 10⁸ m. (This height is absurd for a mosquito: check data in the worksheet; the method is what matters.)"}, {"t": "h", "r": "Q18", "q": "A space probe has 5008 J of Ep stored and a mass of 78 kg. Find its height above Jupiter's surface (g = 24.5).", "a": "h = 5008/(78 × 24.5) = 2.62 m."}], "np": true}, {"id": "E3", "wk": "Energy", "title": "E3 Conservation of energy", "th": "<p>Energy is stored in different <b>stores</b> (kinetic, gravitational, thermal, chemical, elastic…) and can be <b>transferred</b> between them. In a <b>closed system</b> no energy enters or leaves, so the <b>total stays constant</b>.</p>\n<div class=\"box\"><b>Falling or rising object (no friction)</b><ul><li>Loss in GPE = gain in KE: <b>mgh = ½mv²</b>.</li><li>So v = √(2gh), and the mass cancels.</li><li>Thrown upwards: KE at launch = GPE at the top: h = v²/(2g).</li><li>Total energy = GPE + KE is the same at every height.</li></ul></div>\n<div class=\"box\">⚠ In real situations some energy goes to thermal stores (friction, air resistance) and the system is not closed. Always say which assumption you are making.</div>", "qs": [{"t": "c", "r": "Q1", "q": "What is the definition of a closed system?", "a": "A system in which no energy enters or leaves (no energy is transferred in or out), so the total energy stays constant."}, {"t": "c", "r": "Q2", "q": "State the law of conservation of energy.", "a": "Energy cannot be created or destroyed. It can only be transferred from one store to another (or one form to another), so the total energy in a closed system is constant."}, {"t": "c", "r": "Q3", "q": "An apple in a tree has a gravitational store of 8 J. As it falls it accelerates until it hits the ground. What is its maximum kinetic store? Explain (closed system).", "a": "8 J. All of the gravitational store is transferred to the kinetic store just before impact (energy is conserved)."}, {"t": "c", "r": "Q4", "q": "A child at the top of a slide has a gravitational store of 1800 J. What is his maximum kinetic store as he slides down? Explain.", "a": "1800 J. In a closed system there is no energy loss (no friction), so the whole gravitational store becomes kinetic energy at the bottom."}, {"t": "c", "r": "Q5", "q": "A bouncing ball has 50 J of kinetic energy as it leaves the ground. What is its maximum gravitational store at its highest point? Explain.", "a": "50 J: at the top its speed is zero, so all of the kinetic store has become gravitational store."}, {"t": "c", "r": "Q6", "q": "A cannonball is shot straight up from a cannon with an initial kinetic store of 7000 J. What is its maximum gravitational energy at its highest point? Explain.", "a": "7000 J, by conservation of energy (kinetic ⇒ gravitational at the top of the flight)."}, {"t": "h", "r": "Q7", "q": "A 4 kg brick is held at a height of 12 m (g = 9.8 N kg⁻¹). Find the maximum kinetic energy just before it hits the ground.", "a": "Ek (max) = Ep (start) = mgh = 4 × 9.8 × 12 = 470 J."}, {"t": "h", "r": "Q8", "q": "A bird of mass 2.5 kg is flying at a height of 220 m (g = 9.8). If a hunter shoots the bird, find its maximum kinetic energy just before it hits the ground.", "a": "Ek = mgh = 2.5 × 9.8 × 220 = 5390 J."}, {"t": "h", "r": "Q9", "q": "If the bird gets stuck in a tree 10 m above the ground, what is its maximum kinetic energy just before it hits the tree?", "a": "It falls 220 − 10 = 210 m: Ek = 2.5 × 9.8 × 210 = 5145 J."}, {"t": "h", "r": "Q10", "q": "A 90 kg kangaroo jumps with an initial velocity of 5 m s⁻¹. What is its maximum gravitational energy at the highest point?", "a": "Ek = ½ × 90 × 5² = 1125 J, so maximum Ep = 1125 J."}, {"t": "h", "r": "Q11", "q": "A bouncing golf ball of mass 200 g leaves the ground at 3 m s⁻¹. What is the maximum gravitational store at its highest point?", "a": "m = 0.2 kg: Ek = ½ × 0.2 × 3² = 0.900 J, so max Ep = 0.900 J."}, {"t": "h", "r": "Q12", "q": "A 25 kg cannonball is fired straight up at 8 m s⁻¹ (g = 9.8). What maximum height can it reach?", "a": "Ek = ½ × 25 × 64 = 800 J = mgh ⇒ h = 800/(25 × 9.8) = 3.27 m (or h = v²/2g)."}, {"t": "h", "r": "Q13", "q": "An alien of mass 180 kg jumps straight up at 2.4 m s⁻¹. If g = 8.7 N kg⁻¹, what is the maximum height?", "a": "h = v²/(2g) = 5.76/(2 × 8.7) = 0.331 m (mass cancels)."}, {"t": "c", "r": "Q14", "q": "A stone of mass 0.4 kg is dropped from 4 m (g = 9.8, closed system, no friction). Complete a table of GPE and KE at heights 4.0, 3.0, 2.0, 1.0 and 0.0 m and describe the relationship between GPE and KE.", "a": "h = 4.0 m: GPE = 0.4 × 9.8 × 4.0 = 15.68 J, KE = 0.00 J<br>h = 3.0 m: GPE = 0.4 × 9.8 × 3.0 = 11.76 J, KE = 3.92 J<br>h = 2.0 m: GPE = 0.4 × 9.8 × 2.0 = 7.84 J, KE = 7.84 J<br>h = 1.0 m: GPE = 0.4 × 9.8 × 1.0 = 3.92 J, KE = 11.76 J<br>h = 0.0 m: GPE = 0.4 × 9.8 × 0.0 = 0.00 J, KE = 15.68 J<br>Relationship: GPE + KE = 15.68 J at every height. As the stone falls, GPE decreases and KE increases by the same amount (energy is transferred from the gravitational store to the kinetic store; the total is conserved)."}], "np": true}, {"id": "E4", "wk": "Energy", "title": "E4 Power", "th": "<p><b>Power</b> is the rate at which energy is transferred (or work is done). One watt (W) is one joule per second.</p>\n<div class=\"box\"><b>P = E/t</b> &nbsp; (P in W, E in J, t in s)<ul><li>E = P × t and t = E/P.</li><li>Convert time to <b>seconds</b>: minutes × 60, hours × 3600.</li><li>kW × 1000 = W.</li></ul></div>\n<div class=\"box\">⚠ A higher power does not mean more energy overall: it means that energy is transferred faster. Energy used depends on both power and time.</div>", "qs": [{"t": "c", "r": "Q1", "q": "A toaster has a power of 1200 W. How much energy does it transfer in (a) one second, (b) two seconds, (c) five seconds?", "a": "Power is energy per second: 1200 W = 1200 J s⁻¹.<br>(a) 1200 J (b) 2400 J (c) 6000 J."}, {"t": "c", "r": "Q2", "q": "How does the toaster transfer the energy? A toaster could toast bread even in space. What does this say about the heat transfer involved?", "a": "Electrical energy is transferred to the thermal store of the bread, mainly by <b>radiation</b> (infrared) from the hot element. Because it works in space (a vacuum), the transfer does not need particles or a medium: it is radiation, not conduction or convection."}, {"t": "c", "r": "Q3", "q": "A motor uses a battery to turn. (a) Which energy stores are involved? (b) Which energy transfer is involved? (c) The motor has a power of 12 W. How much energy can it transfer in 10 s?", "a": "(a) Chemical store (battery) ⇒ kinetic store of the motor (plus some wasted thermal energy).<br>(b) Electrical transfer (a current), then mechanical work by the motor.<br>(c) E = Pt = 12 × 10 = 120 J."}, {"t": "c", "r": "Q4", "q": "An object is lifted by the motor (12 W). (a) What energy stores are involved? (b) Which transfer? (c) The object needs 24 J to be lifted to the right height. How long does the motor take?", "a": "(a) Chemical store (battery) ⇒ gravitational store of the object (some thermal wasted).<br>(b) Electrical, then work done by the motor (mechanical).<br>(c) t = E/P = 24/12 = 2 s."}, {"t": "h", "r": "Q5", "q": "A device has a power of 450 W and is left on for 10 s. How much energy is transferred?", "a": "E = Pt = 450 × 10 = 4500 J."}, {"t": "h", "r": "Q6", "q": "A device has a power of 900 W and is left on for 15 s. How much energy is transferred?", "a": "E = 900 × 15 = 13 500 J."}, {"t": "h", "r": "Q7", "q": "Find the energy transferred by (a) a 60 W bulb in 30 s (b) a 12 W battery in 45 s.", "a": "(a) 60 × 30 = 1800 J.<br>(b) 12 × 45 = 540 J."}, {"t": "h", "r": "Q8", "q": "Find the energy transferred by (a) a 200 W kettle in 2 minutes (b) a 1500 W microwave in 4 minutes.", "a": "Convert minutes to seconds (× 60).<br>(a) 200 × 120 = 24 000 J.<br>(b) 1500 × 240 = 360 000 J."}, {"t": "h", "r": "Q9", "q": "How much time does it take for a 500 W device to transfer (a) 1500 J (b) 750 J?", "a": "t = E/P.<br>(a) 1500/500 = 3 s.<br>(b) 750/500 = 1.5 s."}, {"t": "h", "r": "Q10", "q": "What is the time taken for (a) 5000 J by a 100 W hoover (b) 300 J by a 50 W speaker (c) 20 000 J by a 150 W radio (d) 1200 J by a 40 W bulb? Then convert each time to minutes.", "a": "(a) 50 s = 0.83 min.<br>(b) 6 s = 0.10 min.<br>(c) 133 s = 2.2 min.<br>(d) 30 s = 0.50 min."}, {"t": "h", "r": "Q11", "q": "Find the power of (a) a heater transferring 420 J in 6 s (b) a heater transferring 100 J in 40 s (c) a battery transferring 2 J in 15 s.", "a": "P = E/t.<br>(a) 420/6 = 70 W.<br>(b) 100/40 = 2.5 W.<br>(c) 2/15 = 0.13 W."}, {"t": "h", "r": "Q12", "q": "Find the power of (a) a charger transferring 214 J in 1 minute (b) a TV transferring 1600 J in 3 minutes (c) a washing machine transferring 1250 J in 50 minutes.", "a": "Convert to seconds first.<br>(a) 214/60 = 3.6 W.<br>(b) 1600/180 = 8.9 W.<br>(c) 1250/3000 = 0.42 W."}, {"t": "h", "r": "Q13", "q": "A person lifts an object and transfers 78 J in half a minute. What is the power of the person?", "a": "P = 78/30 = 2.6 W."}, {"t": "h", "r": "Q14", "q": "Calculate the time in hours in which a 3 W mobile phone transfers 2890 J of energy.", "a": "t = E/P = 2890/3 = 963 s. In hours: 963 ÷ 3600 = 0.27 h (about 16 minutes)."}, {"t": "h", "r": "Q15", "q": "Mixed: (a) A device transfers 80 J in ten minutes: power? (b) 20 J in 30 s: power? (c) A 0.8 W device transfers 300 J: time? (d) A 5.5 W device is left on for two hours: energy? (e) How long for a 12 W device to transfer 900 J? (f) 88 J in 2 hours: power?", "a": "(a) 80/600 = 0.13 W.<br>(b) 20/30 = 0.67 W.<br>(c) 300/0.8 = 375 s (6.25 min).<br>(d) 2 h = 7200 s: E = 5.5 × 7200 = 39 600 J.<br>(e) 900/12 = 75 s.<br>(f) 88/7200 = 0.012 W."}], "np": true}];

const BL={"M1": "Reading velocity from the gradient; distance vs displacement.", "M2": "Gradient is acceleration, area is displacement.", "M3": "The five constant-acceleration equations and the VEERS method.", "M4": "Free fall, thrown objects and the g = 9.8 m s⁻² convention.", "F1": "Net force, F = ma, third-law pairs and linking to kinematics.", "F2": "Drawing and labelling all forces on one object.", "F3": "Drag, balanced forces and falling in air.", "E1": "Ek = ½mv² and rearranging for v or m.", "E2": "Ep = mgh, including other planets.", "E3": "Energy transfers between stores; GPE ⇄ KE.", "E4": "P = E/t, with unit conversions."};
const EX={"M1": [["An object's displacement is 0 m at 0 s, 20 m at 4 s, stays at 20 m until 8 s, then returns to 0 m at 12 s. Find its velocity in each stage and the distance travelled.", "0–4 s: v = 20/4 = 5 m s⁻¹. 4–8 s: v = 0. 8–12 s: v = (0 − 20)/4 = −5 m s⁻¹.<br>Distance = 20 + 0 + 20 = 40 m, but the displacement is 0 m.", "<svg viewBox=\"0 0 380 240\" role=\"img\" aria-label=\"Worked example graph\" style=\"max-width:380px;width:100%;height:auto;display:block;margin:6px 0;font:11px system-ui,sans-serif\"><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"100.2\" y1=\"200.0\" x2=\"100.2\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"150.5\" y1=\"200.0\" x2=\"150.5\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"200.7\" y1=\"200.0\" x2=\"200.7\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"251.0\" y1=\"200.0\" x2=\"251.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"301.2\" y1=\"200.0\" x2=\"301.2\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"351.4\" y1=\"200.0\" x2=\"351.4\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"169.0\" x2=\"364.0\" y2=\"169.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"138.0\" x2=\"364.0\" y2=\"138.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"107.0\" x2=\"364.0\" y2=\"107.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"76.0\" x2=\"364.0\" y2=\"76.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"45.0\" x2=\"364.0\" y2=\"45.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"14.0\" x2=\"364.0\" y2=\"14.0\" stroke=\"currentColor\" opacity=\".15\"/><line x1=\"50.0\" y1=\"169.0\" x2=\"364.0\" y2=\"169.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"14.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"50.0\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">0</text><text x=\"100.2\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">2</text><text x=\"150.5\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">4</text><text x=\"200.7\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">6</text><text x=\"251.0\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">8</text><text x=\"301.2\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">10</text><text x=\"351.4\" y=\"214.0\" text-anchor=\"middle\" fill=\"currentColor\">12</text><text x=\"44.0\" y=\"173.0\" text-anchor=\"end\" fill=\"currentColor\">0</text><text x=\"44.0\" y=\"142.0\" text-anchor=\"end\" fill=\"currentColor\">5</text><text x=\"44.0\" y=\"111.0\" text-anchor=\"end\" fill=\"currentColor\">10</text><text x=\"44.0\" y=\"80.0\" text-anchor=\"end\" fill=\"currentColor\">15</text><text x=\"44.0\" y=\"49.0\" text-anchor=\"end\" fill=\"currentColor\">20</text><text x=\"44.0\" y=\"18.0\" text-anchor=\"end\" fill=\"currentColor\">25</text><text x=\"207.0\" y=\"236\" text-anchor=\"middle\" fill=\"currentColor\">time (s)</text><text x=\"12\" y=\"107.0\" text-anchor=\"middle\" fill=\"currentColor\" transform=\"rotate(-90 12 107.0)\">s (m)</text><polyline fill=\"none\" stroke=\"#8b6cff\" stroke-width=\"2.6\" stroke-linejoin=\"round\" points=\"50.0,169.0 150.5,45.0 251.0,45.0 351.4,169.0\"/><circle cx=\"50.0\" cy=\"169.0\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"150.5\" cy=\"45.0\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"251.0\" cy=\"45.0\" r=\"3\" fill=\"#8b6cff\"/><circle cx=\"351.4\" cy=\"169.0\" r=\"3\" fill=\"#8b6cff\"/></svg>"], ["A cyclist's position is 12 m at 2 s and 30 m at 8 s on a straight line. Find the average velocity.", "v = Δs/Δt = (30 − 12)/(8 − 2) = 18/6 = 3 m s⁻¹."]], "M2": [["A train speeds up uniformly from rest to 24 m s⁻¹ in 8 s, then travels at that velocity for 10 s. Find the acceleration and the total distance.", "a = (24 − 0)/8 = 3 m s⁻². Distance = ½ × 8 × 24 + 10 × 24 = 96 + 240 = 336 m."], ["A cyclist's v–t graph falls in a straight line from 12 m s⁻¹ at 0 s to 0 m s⁻¹ at 6 s. Find the acceleration and braking distance.", "a = (0 − 12)/6 = −2 m s⁻² (a deceleration of 2 m s⁻²). Distance = area = ½ × 6 × 12 = 36 m."]], "M3": [["A car accelerates uniformly from 8.0 m s⁻¹ to 20 m s⁻¹ in 6.0 s. Find the acceleration and the distance travelled (use VEERS).", "V: u = 8.0, v = 20, t = 6.0, a = ?, s = ?. a = (v − u)/t = 12/6.0 = 2.0 m s⁻². s = ½(u + v)t = ½(28)(6.0) = 84 m."], ["A ball rolls to rest from 3.0 m s⁻¹ over 4.5 m. Find the deceleration and the time taken.", "No t: v² = u² + 2as ⇒ 0 = 9 + 2a(4.5) ⇒ a = −1.0 m s⁻². Then t = (v − u)/a = (0 − 3.0)/(−1.0) = 3.0 s."]], "M4": [["A ball is thrown straight up at 14.7 m s⁻¹ (g = 9.8 m s⁻²). Find the time to the top, the height reached and the time in the air.", "Up positive, a = −9.8. Top: 0 = 14.7 − 9.8t ⇒ t = 1.5 s. Height: s = 14.7²/(2 × 9.8) = 11 m. Total time in the air = 2 × 1.5 = 3.0 s."], ["A coin is dropped from a 20 m bridge (g = 9.8 m s⁻²). Find the fall time and impact speed.", "u = 0, s = 20, a = 9.8. t = √(2 × 20/9.8) = 2.0 s. v = gt = 9.8 × 2.02 = 20 m s⁻¹."]], "F1": [["A 60 kg skater is pushed with a net force of 90 N. Find the acceleration and the speed after 4.0 s from rest.", "a = F/m = 90/60 = 1.5 m s⁻². v = at = 1.5 × 4.0 = 6.0 m s⁻¹."], ["A 2.0 kg book rests on a table. Name the Newton's third law pair for its weight.", "The Earth pulls the book down (weight, 19.6 N). The book pulls the Earth up with an equal force (19.6 N). These act on different objects, so they are a third-law pair. The table's upward normal force is a different force that balances the weight (first law)."]], "F2": [["Draw the forces on a box being pushed along a rough floor at constant speed.", "Four forces: Fg down, Fn up (equal), Fapp forwards and Ff backwards (equal). Equal pairs mean zero net force, so constant velocity.", "<svg viewBox=\"0 0 210 184\" role=\"img\" aria-label=\"Box pushed at constant speed: four balanced forces\" style=\"max-width:210px;width:100%;height:auto;display:block;margin:6px 0;font:12px system-ui,sans-serif\"><rect x=\"91.0\" y=\"92.0\" width=\"28\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"131.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,140.0 100.5,131.0 109.5,131.0\"/><text x=\"105.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fg</text><line x1=\"105.0\" y1=\"102.0\" x2=\"105.0\" y2=\"73.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"105.0,64.0 109.5,73.0 100.5,73.0\"/><text x=\"105.0\" y=\"54.0\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">Fn</text><line x1=\"105.0\" y1=\"102.0\" x2=\"134.0\" y2=\"102.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"143.0,102.0 134.0,106.5 134.0,97.5\"/><text x=\"151.0\" y=\"106.0\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\">Fapp</text><line x1=\"105.0\" y1=\"102.0\" x2=\"76.0\" y2=\"102.0\" stroke=\"#8b6cff\" stroke-width=\"2.4\"/><polygon fill=\"#8b6cff\" points=\"67.0,102.0 76.0,97.5 76.0,106.5\"/><text x=\"59.0\" y=\"106.0\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"700\">Ff</text></svg>"], ["What changes in the diagram if the box accelerates?", "Fapp becomes longer than Ff. The vertical forces are still balanced, but there is a net forward force and so a forward acceleration."]], "F3": [["A skydiver of weight 800 N falls and reaches terminal velocity. What is the drag force at that point, and what is the acceleration?", "At terminal velocity the forces are balanced: drag = 800 N upwards. Net force = 0, so a = 0."], ["Why does a parachutist have a much lower terminal velocity than a skydiver in free fall?", "The open parachute greatly increases the cross-sectional area, so drag reaches the same size as the weight at a much lower speed."]], "E1": [["Find the kinetic energy of a 1200 kg car travelling at 20 m s⁻¹.", "Ek = ½mv² = ½ × 1200 × 400 = 240 000 J (240 kJ)."], ["A 0.5 kg ball has 25 J of kinetic energy. Find its speed.", "v = √(2Ek/m) = √(50/0.5) = √100 = 10 m s⁻¹."]], "E2": [["Find the GPE of a 2.0 kg book on a shelf 1.5 m above the floor (g = 9.8).", "Ep = mgh = 2.0 × 9.8 × 1.5 = 29.4 J."], ["A 60 kg climber has 17 640 J of GPE relative to the base of a rock face. How high has she climbed?", "h = Ep/(mg) = 17 640/(60 × 9.8) = 30 m."]], "E3": [["A 0.50 kg ball is dropped from 5.0 m (g = 9.8, no air resistance). Find its speed just before hitting the ground.", "mgh = ½mv² ⇒ v = √(2gh) = √(2 × 9.8 × 5.0) = 9.9 m s⁻¹."], ["A 2.0 kg trolley at the top of a frictionless ramp 0.80 m high is released. Find its kinetic energy at the bottom.", "Ek = Ep = mgh = 2.0 × 9.8 × 0.80 = 15.7 J."]], "E4": [["A 1500 W microwave runs for 2 minutes. How much energy does it transfer?", "t = 120 s. E = Pt = 1500 × 120 = 180 000 J (180 kJ)."], ["A crane lifts a load, doing 4800 J of work in 8 s. Find its power.", "P = E/t = 4800/8 = 600 W."]]};

function mt(t,i,dir){let d=0;for(let k=i;k>=0&&k<t.length;k+=dir){const c=t[k];if("([".includes(c))d+=dir==-1?-1:1;else if(")]".includes(c))d+=dir==-1?1:-1;if(d==0)return k}return -1}
function st(x){return /^[(\[]/.test(x)&&mt(x,0,1)==x.length-1?x.slice(1,-1):x}
function fr(t){
 for(let i=0;i<t.length;i++){
  if(t[i]!="/")continue;
  let l=i-1,r=i+1,l2=l,r2=r;
  while(t[l2]==" ")l2--;while(t[r2]==" ")r2++;
  if(")]".includes(t[l2]||"#")&&"([".includes(t[r2]||"#")){l=l2;r=r2}else if(t[l]==" "||t[r]==" ")continue;
  let ls,re;
  if(")]".includes(t[l])){ls=mt(t,l,-1);if(ls<0)continue}else{ls=l;while(ls>=0&&W.test(t[ls]))ls--;ls++}
  if("([".includes(t[r])){re=mt(t,r,1);if(re<0)continue}else{re=r;while(re<t.length){if(W.test(t[re]))re++;else if(t[re]=="("&&t[re-1]=="^"){const j=mt(t,re,1);if(j<0)break;re=j+1}else break}re--;while(t[re]==".")re--}
  if(ls>l||re<r)continue;
  const A0=t.slice(ls,l+1),B0=t.slice(r,re+1),bad=x=>!/^[(\[]/.test(x)&&/[A-Za-z]{3,}/.test(x);if(bad(A0)||bad(B0))continue;
  const h='<span class=fr><span class=nu>'+fr(st(t.slice(ls,l+1)))+'</span><span class=de>'+fr(st(t.slice(r,re+1)))+'</span></span>';
  t=t.slice(0,ls)+h+t.slice(re+1);i=ls+h.length-1}
 return t}

 const q=ti.value.trim();if(!q||busy)return;if(!smp&&!key){noAI();return}busy=true;ti.value="";add("u",q);hist.push({role:"user",content:q});
 const b=add("a","Thinking…");let m=hist.slice(-12);while(m.length&&m[0].role!="user")m.shift();
 const raw=m;m=m.map((x,i)=>i==0?{role:"user",content:SYS+"\n\nStudent: "+x.content}:x);
 try{let tx;if(smp){const r=await smp(m,{cache:false,onText:o=>{b.textContent=o.text;ms.scrollTop=ms.scrollHeight}});tx=r.text}else tx=await viaKey(raw);b.textContent=tx;hist.push({role:"assistant",content:tx})}
 catch(e){hist.pop();b.textContent=e&&e.message=="badkey"?"Anthropic rejected that API key. Check it with the 🔑 Key button.":e&&e.name=="TypeError"&&!smp?"Couldn’t reach Anthropic. Check your internet connection (and that nothing is blocking api.anthropic.com).":e&&e.code=="not_granted"?"The tutor needs your permission to run. Reload and allow it when asked.":e&&e.code=="rate_limited"?"Too many questions too quickly. Wait a moment and try again.":"Sorry, something went wrong. Try again."}
 busy=false}
document.getElementById("ts").onclick=send;
ti.addEventListener("keydown",e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();send()}});

</script><script>
/* ===== Feature pack: self-rating, spaced flashcards (Leitner boxes), Quiz me ===== */
(function(){
const LB={g:"Got it",n:"Nearly",x:"Not yet"},IC={g:"✅",n:"🟡",x:"❌"},DAY=864e5;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)};
const $=id=>document.getElementById(id);
const nm=s=>(typeof SH!=="undefined"&&SH[s.id])||s.title;

/* ---------- Feature 3: self-rating on every question ---------- */
function setRating(key,v){
  if(P["r:"+key]==v){delete P["r:"+key];delete P["rt:"+key]}
  else{P["r:"+key]=v;P["rt:"+key]=Date.now();if(v=="g")P[key]=true}
  save();return P["r:"+key]
}
const origQ=qCard;
qCard=function(s,q){
  const key=s.id+q.r,r=P["r:"+key];
  const row='<div class="rate"><span>How did it go?</span>'+["g","n","x"].map(k=>'<button class="rb'+(r==k?" on "+k:"")+'" data-rate="'+k+'" data-rk="'+key+'">'+IC[k]+" "+LB[k]+"</button>").join("")+"</div>";
  return origQ(s,q).replace("<details>",row+"<details>")
};
FL.push(["w","⚠ Needs work"]);
const origFill=fill;
fill=function(){
  const w=filt=="w";if(w)filt="all";
  origFill();
  if(w){filt="w";prune()}
};
function prune(){
  const res=$("res");if(!res)return;
  res.querySelectorAll(".q").forEach(el=>{const v=P["r:"+el.id.slice(2)];if(v!="n"&&v!="x")el.remove()});
  res.querySelectorAll("section").forEach(sec=>{
    if(!sec.querySelector(".q")){sec.remove();return}
    sec.querySelectorAll("h3").forEach(h=>{let n=h.nextElementSibling,c=0;while(n&&n.tagName!="H3"){if(n.classList.contains("q"))c++;n=n.nextElementSibling}
      if(!c)h.remove();else h.textContent=h.textContent.replace(/\(\d+\)\s*$/,"("+c+")")})
  });
  if(!res.querySelector(".q"))res.innerHTML='<p class="sub">Nothing is marked “Nearly” or “Not yet”. Rate questions after you try them and they will collect here.</p>'
}

/* ---------- Feature 1: spaced flashcards ---------- */
const INT=[0,1,3,7,14];          // days until the next review for boxes 1 to 5
const ck=i=>"c:"+hash(FC[i][0]);
const cst=i=>P[ck(i)]||null;
const isDue=i=>{const c=cst(i);return!c||c.d<=Date.now()};
const dueList=()=>FC.map((_,i)=>i).filter(isDue);
function gradeCard(i,v){
  const c=cst(i)||{b:0,d:0};let b=c.b,d;
  if(v=="a"){b=0;d=Date.now()+10*60e3}
  else if(v=="n"){d=Date.now()+Math.max(1,Math.round(INT[b]/2))*DAY}
  else{b=Math.min(4,b+1);d=Date.now()+INT[b]*DAY}
  P[ck(i)]={b:b,d:d,t:Date.now()};save();return P[ck(i)]
}
function nextDue(){
  let m=Infinity;FC.forEach((_,i)=>{const c=cst(i);if(c&&c.d<m)m=c.d});
  if(m===Infinity)return"";const h=Math.max(1,Math.round((m-Date.now())/36e5));
  return h<24?"in about "+h+" hour"+(h==1?"":"s"):"in about "+Math.round(h/24)+" day"+(Math.round(h/24)==1?"":"s")
}
const mode=()=>P["cmode"]||"due";
function syncFC(){fc.o=mode()=="due"?shuffle(dueList()):FC.map((_,i)=>i);fc.i=0;fc.f=false}
revP=function(){
  syncFC();const due=dueList().length,m=mode();
  return'<section id="FC"><span class="wk">Revision</span><h2>Flashcards &amp; cheat sheet</h2>'+
  '<div class="fcstat"><span><b id="fcdue">'+due+'</b> due today · '+(FC.length-due)+' not due</span><span class="acts"><button data-fcm="due" class="'+(m=="due"?"on":"")+'">Study due cards</button><button data-fcm="all" class="'+(m=="all"?"on":"")+'">All cards</button></span></div>'+
  '<div id="fcard" class="fcard" tabindex="0"></div>'+
  '<div id="fcr" class="acts" style="display:none"><button class="rb x" data-fcr="a">🔁 Again</button><button class="rb n" data-fcr="n">🟡 Almost</button><button class="rb g" data-fcr="g">✅ Got it</button></div>'+
  '<div class="acts"><button id="fp">◀ Prev</button><button id="fn">Next ▶</button><button id="fs">🔀 Shuffle</button><span class="sub" id="fcn"></span></div>'+
  '<p class="sub" style="margin:8px 0 0">Flip the card, then rate yourself. “Again” brings it back soon, “Got it” moves it to a longer gap (1, 3, 7, then 14 days).</p>'+
  '<details class="rs"><summary>Show all cards as a cheat sheet</summary><table>'+FC.map(x=>"<tr><td><b>"+fm(x[0])+"</b></td><td>"+fm(x[1])+"</td></tr>").join("")+"</table></details></section>"
};
drawFC=function(){
  const c=$("fcard");if(!c)return;
  const r=$("fcr"),n=$("fcn");
  if(!fc.o.length){c.className="fcard";c.innerHTML=(mode()=="due"?"🎉 All caught up!<br><small>No cards are due right now"+(nextDue()?". The next one is due "+nextDue():"")+".</small>":"No cards yet.");r.style.display="none";n.textContent="";return}
  const x=FC[fc.o[fc.i]];
  c.className="fcard"+(fc.f?" bk":"");c.innerHTML=fm(fc.f?x[1]:x[0]);
  r.style.display=fc.f?"flex":"none";
  n.textContent=(fc.i+1)+" / "+fc.o.length+(fc.f?"":" (tap card to flip)")
};

/* ---------- Feature 2: Quiz me (mixed, shuffled practice) ---------- */
let qz={step:"setup",sel:null,n:10,pri:true,list:[],i:0,show:false,res:[]};
const allQ=()=>{const a=[];D.forEach(s=>s.qs.forEach(q=>a.push({s:s,q:q,key:s.id+q.r})));return a};
function buildList(sel,n,pri,only){
  let pool=allQ().filter(x=>sel.has(x.s.id)&&(!only||only.has(x.key)));
  const w=x=>{if(!pri)return Math.random();const v=P["r:"+x.key];const base=v=="x"?3:v=="n"?2:!v?1.2:0.25;return base*(0.6+Math.random())};
  pool=pool.map(x=>({x:x,w:w(x)})).sort((a,b)=>b.w-a.w).slice(0,n).map(o=>o.x);
  return shuffle(pool)
}
function startQuiz(){
  const sel=qz.sel||new Set(D.map(s=>s.id));
  qz.list=buildList(sel,qz.n,qz.pri,null);qz.i=0;qz.show=false;qz.res=[];qz.step=qz.list.length?"run":"setup"
}
function quizP(){
  if(qz.step=="run")return qRun();
  if(qz.step=="end")return qEnd();
  const sel=qz.sel||(qz.sel=new Set(D.map(s=>s.id)));
  const rated=allQ().filter(x=>P["r:"+x.key]=="n"||P["r:"+x.key]=="x").length;
  return'<section><span class="wk">Mixed practice</span><h2>🎯 Quiz me</h2>'+
  '<p class="sub">A shuffled mix of questions from the topics you choose. Mixing topics trains you to decide <i>which</i> method to use, and trying an answer before looking is one of the best ways to learn. Work each one on paper, then check and rate yourself.</p>'+
  '<h3>Topics</h3><div class="acts">'+D.map(s=>'<button data-qt="'+s.id+'" class="'+(sel.has(s.id)?"on":"")+'">'+s.id+" "+nm(s)+"</button>").join("")+"</div>"+
  '<div class="acts"><button data-qall="1">Select all</button><button data-qnone="1">Clear</button></div>'+
  '<h3>Number of questions</h3><div class="acts">'+[5,10,15,20].map(n=>'<button data-qn="'+n+'" class="'+(qz.n==n?"on":"")+'">'+n+"</button>").join("")+"</div>"+
  '<label class="d" style="display:flex;gap:8px;align-items:center;margin:12px 0"><input type="checkbox" id="qpri" '+(qz.pri?"checked":"")+'> Prioritise questions I have not got yet'+(rated?" ("+rated+" marked to practise)":"")+"</label>"+
  '<div class="acts"><button class="on" data-qstart="1">Start quiz</button></div></section>'
}
function qRun(){
  const it=qz.list[qz.i],s=it.s,q=it.q;
  let h='<section><span class="wk">Question '+(qz.i+1)+" of "+qz.list.length+"</span> <span class=\"wk\">"+s.id+" "+nm(s)+"</span>"+
  '<div style="height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 10px"><i style="display:block;height:100%;width:'+Math.round(100*qz.i/qz.list.length)+'%;background:var(--ok,#1f8f55)"></i></div>'+
  '<div class="qzq"><b>'+q.r+"</b> "+fm(q.q)+(q.fig?'<div class="fig">'+q.fig+"</div>":"")+"</div>";
  if(!qz.show)h+='<p class="sub">Try it on paper first.</p><div class="acts"><button class="on" data-qshow="1">Show solution</button><button data-qstop="1">Stop quiz</button></div>';
  else h+='<div class="sol">'+fm(q.a)+(q.afig?'<div class="fig">'+q.afig+"</div>":"")+'</div><div class="rate"><span>How did it go?</span>'+["g","n","x"].map(k=>'<button class="rb" data-qr="'+k+'">'+IC[k]+" "+LB[k]+"</button>").join("")+"</div>";
  return h+"</section>"
}
function qEnd(){
  const c={g:0,n:0,x:0};qz.res.forEach(r=>c[r.v]++);const t=qz.res.length||1;
  const miss=qz.res.filter(r=>r.v!="g");
  let h='<section><span class="wk">Quiz finished</span><h2>🎉 '+c.g+" of "+qz.res.length+" got it</h2>"+
  '<p class="sub">✅ '+c.g+" got it · 🟡 "+c.n+" nearly · ❌ "+c.x+" not yet ("+Math.round(100*c.g/t)+"% got it). Your ratings were saved, so “Needs work” on the Questions page and the next quiz will use them.</p>";
  if(miss.length){h+="<h3>To revisit ("+miss.length+")</h3>"+miss.map(r=>{const it=qz.list.find(x=>x.key==r.key);return'<div class="q"><div class="h"><div><b>'+it.s.id+" "+it.q.r+"</b> "+fm(it.q.q)+'</div></div><div class="acts"><button data-qopen="'+r.key+'">Open in Questions</button></div></div>'}).join("")}
  h+='<div class="acts" style="margin-top:12px">'+(miss.length?'<button class="on" data-qretry="1">Retry the ones I missed</button>':"")+'<button data-qnew="1">New quiz</button></div></section>';
  return h
}
const origBk=bkP;
bkP=function(id){return id=="quiz"?quizP():origBk(id)};
const origNav=navR;
navR=function(){
  origNav();
  if(pg=="rev"){const c=nav.querySelector(".chips2");if(c){const b=document.createElement("button");b.setAttribute("data-go","rev/quiz");b.className=tp=="quiz"?"on":"";b.textContent="🎯 Quiz me";c.insertBefore(b,c.children[1]||null)}}
};
const origQP=qP;
qP=function(){return origQP().replace('<button id="rn">','<button data-go="rev/quiz">🎯 Quiz me</button><button id="rn">')};

/* ---------- click handling (runs before the page's own handler) ---------- */
function redrawQuiz(scroll){main.innerHTML=quizP();if(scroll)window.scrollTo(0,0)}
function handle(e){
  const t=e.target.closest?e.target.closest("button,#fcard"):null;if(!t)return;
  const d=t.dataset||{};
  const stop=()=>{e.stopPropagation();e.preventDefault()};
  if(d.rate){stop();const k=d.rk,v=setRating(k,d.rate),row=t.parentElement;
    row.querySelectorAll(".rb").forEach(x=>{x.className="rb"+(v==x.dataset.rate?" on "+x.dataset.rate:"")});
    if(v=="g"){const cb=document.querySelector('input[data-k="'+k+'"]');if(cb)cb.checked=true}
    stat();return}
  if(pg=="rev"&&tp=="fc"){
    if(t.id=="fcard"){stop();if(fc.o.length){fc.f=!fc.f;drawFC()}return}
    if(t.id=="fn"){stop();if(fc.o.length){fc.i=(fc.i+1)%fc.o.length;fc.f=false;drawFC()}return}
    if(t.id=="fp"){stop();if(fc.o.length){fc.i=(fc.i+fc.o.length-1)%fc.o.length;fc.f=false;drawFC()}return}
    if(t.id=="fs"){stop();fc.o=shuffle(fc.o);fc.i=0;fc.f=false;drawFC();return}
    if(d.fcm){stop();P["cmode"]=d.fcm;save();main.innerHTML=revP();drawFC();return}
    if(d.fcr){stop();if(!fc.o.length)return;const idx=fc.o[fc.i];gradeCard(idx,d.fcr);
      if(mode()=="due"){fc.o.splice(fc.i,1);if(d.fcr=="a")fc.o.push(idx);if(fc.i>=fc.o.length)fc.i=0}
      else fc.i=(fc.i+1)%fc.o.length;
      fc.f=false;const el=$("fcdue");if(el)el.textContent=dueList().length;drawFC();return}
  }
  if(pg=="rev"&&tp=="quiz"){
    if(d.qt){stop();const s=qz.sel||(qz.sel=new Set());s.has(d.qt)?s.delete(d.qt):s.add(d.qt);redrawQuiz();return}
    if(d.qall){stop();qz.sel=new Set(D.map(s=>s.id));redrawQuiz();return}
    if(d.qnone){stop();qz.sel=new Set();redrawQuiz();return}
    if(d.qn){stop();qz.n=+d.qn;redrawQuiz();return}
    if(d.qstart){stop();const cb=$("qpri");if(cb)qz.pri=cb.checked;if(!qz.sel||!qz.sel.size)qz.sel=new Set(D.map(s=>s.id));startQuiz();redrawQuiz(true);return}
    if(d.qshow){stop();qz.show=true;redrawQuiz();return}
    if(d.qstop){stop();qz.step="setup";redrawQuiz(true);return}
    if(d.qr){stop();const it=qz.list[qz.i];P["r:"+it.key]=d.qr;P["rt:"+it.key]=Date.now();if(d.qr=="g")P[it.key]=true;save();stat();
      qz.res.push({key:it.key,v:d.qr});qz.i++;qz.show=false;if(qz.i>=qz.list.length)qz.step="end";redrawQuiz(true);return}
    if(d.qretry){stop();const only=new Set(qz.res.filter(r=>r.v!="g").map(r=>r.key));qz.list=shuffle(allQ().filter(x=>only.has(x.key)));qz.i=0;qz.show=false;qz.res=[];qz.step="run";redrawQuiz(true);return}
    if(d.qnew){stop();qz.step="setup";redrawQuiz(true);return}
    if(d.qopen){stop();const key=d.qopen,s=D.find(x=>key.indexOf(x.id)==0);pg="q";tp=s?s.id:tp;filt="all";qry="";render();const el=$("q-"+key);if(el){el.scrollIntoView({block:"center"});el.style.outline="2px solid var(--ac)";setTimeout(()=>{el.style.outline=""},2500)}return}
  }
}
main.addEventListener("click",handle,true);
window.__yt={ck:ck,setRating:setRating,gradeCard:gradeCard,dueList:dueList,buildList:buildList,handle:handle,quiz:()=>qz,startQuiz:startQuiz,quizP:quizP,qRun:qRun,qEnd:qEnd,syncFC:syncFC,INT:INT};
render();
})();
</script>
<script>
/* Tabs: put the icon above the label on narrow phones so all three tabs and the dark-mode button fit */
(function(){if(typeof navR!=="function")return;var o=navR;navR=function(){o();var b=document.querySelectorAll(".tab");for(var i=0;i<b.length;i++){var t=b[i].textContent,k=t.indexOf(" ");if(k>0&&!b[i].querySelector(".te")){b[i].innerHTML='<span class="te"></span><span class="tl"></span>';b[i].firstChild.textContent=t.slice(0,k);b[i].lastChild.textContent=t.slice(k+1)}}};navR()})();
</script>
<script>
/* Offline support: registers sw.js when the site is served over https */
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){
 addEventListener("load",function(){
  var had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(function(){});
  navigator.serviceWorker.addEventListener("controllerchange",function(){
   if(!had){had=true;return}
   if(document.getElementById("ytupd"))return;
   var b=document.createElement("div");b.id="ytupd";
   b.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:99;background:#1d2433;color:#fff;padding:10px 14px;border-radius:12px;font:600 14px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center";
   var t=document.createElement("span");t.textContent="A new version is ready.";
   var k=document.createElement("button");k.textContent="Refresh";k.style.cssText="font:600 13px system-ui,sans-serif;border:0;border-radius:999px;padding:6px 12px;background:#a58bff;color:#12141c;cursor:pointer";
   k.onclick=function(){location.reload()};b.appendChild(t);b.appendChild(k);document.body.appendChild(b)
  })
 })
}
</script>
